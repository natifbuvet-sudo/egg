<style>
:root{--bg:#f3f0e6;--s:#fffdf7;--ink:#1d2330;--mut:#5d6577;--line:#d9d3c0;--acc:#2d5be3;--accink:#fff;--y:#f5b82e;--bad:#b3261e;--ok:#1b7a3d;--purp:#6b3fa0}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Arial,sans-serif;line-height:1.45;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);font-size:15px}
main{max-width:540px;margin:0 auto;padding:10px 12px 36px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:6px}
h1{font-size:1.05rem;margin:0;display:flex;align-items:center;gap:6px}
.ver{font-size:.72rem;background:var(--s);border:1px solid var(--line);padding:2px 7px;border-radius:6px;color:var(--mut);font-weight:600}
.icon-btn{background:var(--s);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:.82rem;cursor:pointer;font-weight:600}
.row{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
input,select{font:inherit;color:var(--ink);background:var(--s);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;font-size:.88rem}
button{font:inherit;background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:.86rem}
button.hero-btn{margin-top:9px;background:var(--y);color:#12151d;padding:6px 14px;font-size:.84rem;border-radius:8px}
button.sm-btn{margin-top:6px;background:transparent;color:var(--acc);border:1px solid var(--acc);padding:3px 10px;font-size:.78rem;border-radius:6px}
button.copy-btn{background:var(--acc);color:var(--accink);width:100%;padding:8px;margin-top:8px;border-radius:8px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.nav{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:var(--s);color:var(--ink);border:1px solid var(--line);padding:5px 10px;font-size:.78rem;border-radius:20px;flex-shrink:0}
.nav button.active{background:var(--acc);color:var(--accink);border-color:var(--acc)}

.phase-bar{background:var(--s);border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8rem}
.phase-tag{background:var(--acc);color:var(--accink);padding:2px 8px;border-radius:6px;font-weight:700;font-size:.74rem}
.event-pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;width:100%}
.event-pill{background:rgba(245,184,46,.24);color:var(--ink);border:1px solid var(--y);padding:2px 7px;border-radius:6px;font-size:.72rem;font-weight:700;cursor:pointer;user-select:none}
.event-pill.off{background:var(--bg);color:var(--mut);border:1px dashed var(--line);font-weight:500;opacity:.82}

.hud{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:10px}
.hud-box{background:var(--s);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.hud-box small{display:block;font-size:.7rem;color:var(--mut)}
.hud-box b{font-size:.86rem;display:block;margin-top:1px}

.hero{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 15px;margin:10px 0;border-inline-start:6px solid var(--y)}
.hero small{display:block;color:var(--y);font-weight:700;font-size:.76rem;margin-bottom:3px;letter-spacing:.2px}
.hero h2{margin:0 0 5px;font-size:1.15rem;line-height:1.25}
.hero p{margin:0;opacity:.92;font-size:.87rem}

ol{list-style:none;margin:0 0 12px;padding:0}
li.it{background:var(--s);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:7px}
li.it b{display:block;font-size:.9rem}
li.it span{color:var(--mut);font-size:.82rem;display:block;margin-top:2px}
.step-num{display:inline-block;background:var(--line);color:var(--ink);font-size:.72rem;font-weight:700;padding:0 6px;border-radius:5px;margin-inline-end:6px}

.tag-ok{display:inline-block;background:var(--ok);color:#fff;font-size:.72rem;padding:2px 7px;border-radius:5px;font-weight:700}
.tag-wait{display:inline-block;background:var(--line);color:var(--ink);font-size:.72rem;padding:2px 7px;border-radius:5px;font-weight:600}
.tag-warn{display:inline-block;background:var(--bad);color:#fff;font-size:.72rem;padding:2px 7px;border-radius:5px;font-weight:700}
.tier-pill{display:inline-block;background:var(--line);color:var(--ink);font-size:.68rem;padding:1px 5px;border-radius:4px;margin-inline-end:5px;font-weight:700}
.stone-pill{display:inline-block;background:rgba(45,91,227,.14);color:var(--acc);font-size:.7rem;padding:1px 6px;border-radius:4px;margin-inline-start:4px;font-weight:600}
.err{color:var(--bad);margin:6px 0;font-weight:600;font-size:.9rem}
.warn{background:var(--s);border:1px solid var(--y);border-radius:8px;padding:7px 10px;margin:6px 0;font-size:.8rem}

.card{background:var(--s);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:.88rem}
.card h3{margin:0 0 8px;font-size:.95rem;display:flex;justify-content:space-between;align-items:center}
.card .l{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);align-items:center}
.card .l:first-of-type{border-top:0;padding-top:2px}
.card small{color:var(--mut)}
.card p{margin:5px 0;font-size:.85rem}

.prog-bar{background:var(--line);border-radius:6px;height:7px;overflow:hidden;margin:5px 0}
.prog-fill{background:var(--acc);height:100%;transition:width .3s}
.prog-fill.ok{background:var(--ok)}
.prog-fill.bad{background:var(--bad)}

.status-banner{border-radius:9px;padding:9px 11px;margin-bottom:8px;border:1px solid var(--line);background:var(--bg)}
.status-banner.do{border-color:var(--ok);background:rgba(27,122,61,.12)}
.status-banner.alert{border-color:var(--bad);background:rgba(179,38,30,.12)}
.status-banner.hold{border-color:var(--line)}
.status-banner b{display:block;font-size:.92rem;margin-bottom:2px}

.c-box{border-top:1px solid var(--line);padding:8px 0}
.c-box:first-of-type{border-top:0;padding-top:2px}
.c-head{font-weight:700;font-size:.92rem;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.c-card{background:var(--bg);border:1px solid var(--line);border-inline-start:4px solid var(--acc);border-radius:10px;padding:9px 11px;margin-bottom:8px}
.c-card.p1{border-inline-start-color:var(--y)}
.c-card.col{border-inline-start-color:var(--purp)}
.c-card.pts{border-inline-start-color:var(--mut)}

.c-chips{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0;font-size:.74rem}
.c-chip{background:var(--s);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--ink);font-weight:500}
.c-chip.ok{border-color:var(--ok);color:var(--ok);font-weight:600}
.c-chip.bad{border-color:var(--bad);color:var(--bad);font-weight:700}
.c-next{margin-top:6px;padding:6px 9px;border-radius:7px;background:var(--s);border-inline-start:3px solid var(--acc);font-size:.82rem;line-height:1.4}
.c-next.do{border-inline-start-color:var(--ok)}
.c-next.alert{border-inline-start-color:var(--bad)}
.c-meta-line{font-size:.78rem;color:var(--mut);margin-top:4px}
.c-res-box{margin-top:7px;background:var(--s);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.c-res-head{display:flex;justify-content:space-between;align-items:center;font-size:.86rem;font-weight:700;margin-bottom:4px}
.c-res-head small{font-weight:500;color:var(--mut)}
.c-res-sum{font-size:.8rem;color:var(--mut);margin:0 0 4px}
details.c-fold{margin-top:7px;border-top:1px dashed var(--line);padding-top:6px}
.c-fold-sum{cursor:pointer;font-size:.79rem;font-weight:700;color:var(--acc);display:flex;justify-content:space-between;align-items:center;user-select:none}
.c-mini-row{padding:7px 0;border-top:1px solid var(--line);font-size:.81rem}
.c-mini-row:first-child{border-top:0;padding-top:3px}
.sec-sub{font-size:.78rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;margin:8px 0 4px;padding-bottom:3px;border-bottom:1px dashed var(--line)}
.badge{font-size:.72rem;padding:2px 7px;border-radius:5px;font-weight:700}
.b-pe{background:var(--y);color:#12151d}
.b-col{background:var(--purp);color:#fff}
.b-rew{background:var(--acc);color:var(--accink)}

.b-hold{background:#f59e0b;color:#12151d}

function getBoostInfo(id){
 if(BOOST_CAT[id])return BOOST_CAT[id];
 var s=String(id||'');
 var pwr=s.indexOf('orange')>=0?50:(s.indexOf('purple')>=0?10:2);
 if(s.indexOf('jimbos')===0)return {name:shipName(s),cat:'feed',power:pwr};
 if(s.indexOf('tachyon')===0)return {name:shipName(s),cat:'tachyon',power:pwr};
 if(s.indexOf('soul_beacon')===0||(s.indexOf('soul_')===0 && s.indexOf('mirror')<0))return {name:shipName(s),cat:'soul',power:pwr};
 if(s.indexOf('boost_beacon')===0||s.indexOf('boost_')===0)return {name:shipName(s),cat:'beacon',power:pwr};
 if(s.indexOf('soul_mirror')===0)return {name:shipName(s),cat:'mirror',power:pwr};
 return {name:shipName(s),cat:'other',power:1};
}

  var wMap={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  if(wMap[map.weekday]!==undefined)ptDay=wMap[map.weekday];

 }

 var sunWks=Math.abs(Math.round(((Date.UTC(ptY,ptMonth-1,ptDate-(ptHour<9?1:0))-Date.UTC(2026,10,22))/86400000)/7));

function pt9AmToUtcMs(y,m,d){
 var utc=Date.UTC(y,m-1,d,17,0,0);
 try{
  var fmt=new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',hour12:false});
  for(var iter=0;iter<2;iter++){
   var parts=fmt.formatToParts(new Date(utc)),mp={};
   parts.forEach(function(p){mp[p.type]=p.value});
   var fy=parseInt(mp.year,10),fm=parseInt(mp.month,10),fd=parseInt(mp.day,10),fh=parseInt(mp.hour,10)%24,fmin=parseInt(mp.minute,10);
   var targetUtc=Date.UTC(y,m-1,d,9,0,0);
   var gotUtc=Date.UTC(fy,fm-1,fd,fh,fmin,0);
   utc+=(targetUtc-gotUtc);
  }
 }catch(e){}
 return utc;
}

function getNextContractRelease(nowSec){
 var nowMs=(nowSec>0?nowSec*1000:Date.now());
 var ptY=new Date(nowMs).getUTCFullYear(),ptM=new Date(nowMs).getUTCMonth()+1,ptD=new Date(nowMs).getUTCDate();
 try{
  var parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date(nowMs));
  var mp={};parts.forEach(function(p){mp[p.type]=p.value});
  ptY=parseInt(mp.year,10);ptM=parseInt(mp.month,10);ptD=parseInt(mp.day,10);
 }catch(e){}
 var dayNamesHe=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
 var dropMeta={
  1:{type:'SEASONAL',shortLabel:'יום שני (עונתי)',label:'חוזה עונתי חדש (Seasonal)',isPE:false,isSeasonal:true,guardHours:48},

 };
 var nextDrop=null,prevDropMs=0;
 for(var offset=-3;offset<=8;offset++){
  var probe=new Date(Date.UTC(ptY,ptM-1,ptD+offset,12,0,0));
  var cy=probe.getUTCFullYear(),cm=probe.getUTCMonth()+1,cd=probe.getUTCDate(),wd=probe.getUTCDay();
  if(!dropMeta[wd])continue;
  var relMs=pt9AmToUtcMs(cy,cm,cd);
  if(relMs<=nowMs){

  }else if(!nextDrop){
   var meta=dropMeta[wd];
   var locDate=new Date(relMs);

    localTimeStr:'יום '+locDay+' ב-'+locHH+':'+locMM
   };
  }
 }
 var hoursSinceLast=prevDropMs>0?((nowMs-prevDropMs)/3600000):999;
 return {

 };

function epicPlan(R,lv,avail,peCount,epicDisc,ctx){
 var discMult=1-(epicDisc||0);
 var ep=R.filter(function(r){return r.type==='epic'}).map(function(r){
  var pr=getEpicPrices(r);return Object.assign({},r,{prices:pr,levels:pr.length||r.levels});
 }).filter(function(r){return (lv[r.id]||0)<r.levels});
 var rows=ep.map(function(r){
  var L=lv[r.id]||0;
  var price=Math.max(1,Math.floor((r.prices[L]||1)*discMult));
  var left=0;
  for(var i=L;i<r.levels;i++)left+=Math.max(1,Math.floor(r.prices[i]*discMult));
  var roi=getEpicWeight(r.id,peCount,L,ctx)/Math.max(1,price);
  return {r:r,L:L,price:price,left:left,roi:roi};
 });
 rows.sort(function(a,b){return b.roi-a.roi});

 var simLv=Object.assign({},lv);
 var rem=Math.max(0,Number(avail)||0);
 var buyMap={};
 var buyList=[];
 var totalSum=0;
 var totalLevels=0;

 for(var step=0;step<250;step++){
  var best=null;
  for(var i=0;i<ep.length;i++){
   var r=ep[i],L=simLv[r.id]||0;
   if(L>=r.levels)continue;
   var p=Math.max(1,Math.floor((r.prices[L]||0)*discMult));
   if(!p || p>rem)continue;
   var sc=getEpicWeight(r.id,peCount,L,ctx)/p;
   if(!best || sc>best.sc)best={r:r,L:L,p:p,sc:sc};
  }
  if(!best)break;
  rem-=best.p;
  totalSum+=best.p;
  totalLevels++;
  simLv[best.r.id]=best.L+1;
  if(!buyMap[best.r.id]){
   buyMap[best.r.id]={r:best.r,from:best.L,to:best.L+1,n:1,sum:best.p};
   buyList.push(buyMap[best.r.id]);
  }else{
   buyMap[best.r.id].to=best.L+1;
   buyMap[best.r.id].n++;
   buyMap[best.r.id].sum+=best.p;
  }
 }

 var buy=null;
 if(rows.length){
  buy={row:rows[0],n:buyList.length?buyList[0].n:0,sum:buyList.length?buyList[0].sum:0,list:buyList,totalSum:totalSum,totalLevels:totalLevels,remGE:rem};
 }
 return {rows:rows,buy:buy};
}

function cgain(r,L,ctx,price){
 var p=r.per_level,g;
 if(r.effect_type==='multiplicative'){g=r.levels_compound==='multiplicative'?Math.log(p>=1?p:(1+p)):Math.log((1+p*(L+1))/(1+p*L))}
 else{g=p/(1+p*L+(p<1?1:10))}
 var cat=r.categories;
 var w=W[cat];
 if(w===undefined)w=0.1;

 if(cat==='egg_value' && p>=1.0){
  w=2.4;
 }

 if(ctx){
  if(cat==='shipping_capacity' || cat==='fleet_size'){
   if(ctx.shipBottleneck)w=(cat==='shipping_capacity')?2.5:1.8;
   else if(ctx.shipUtilPct>=75)w=(cat==='shipping_capacity')?1.1:0.5;
   else if(ctx.shipUtilPct>=55)w=(cat==='shipping_capacity')?0.45:0.2;
   else w=0.12;
  }else if(cat==='internal_hatchery_rate'){
   var cheapIHR=(ctx.cash>0 && price < ctx.cash*0.01);
   w=(ctx.habPct<85)?(cheapIHR?1.55:0.95):0.2;
  }else if(cat==='hab_capacity'){
   if(ctx.habPct>=85){
    w=ctx.keepOneWD?0.35:1.6;
   }else{
    w=0.55;
   }
  }
 }
 return g*w;
}

function commonPlan(R,lv,virt,cash,elv,ctx,commonDisc,puzzleCubeMult,colleggDiscMult){
 var simLv=Object.assign({},lv);
 var cm=R.filter(function(r){return r.type==='common'});
 var labDisc=(1-0.05*(elv['cheaper_research']||0))*(puzzleCubeMult||1)*(1-(commonDisc||0))*(colleggDiscMult||1);
 if(labDisc<0.05)labDisc=0.05;
 function bought(t){var n=0;cm.forEach(function(r){if(r.tier<=t)n+=simLv[r.id]||0});return n}

 var remCash=(cash!==undefined && cash!==null)?Number(cash):0;
 var startCash=remCash;
 var buyById={};
 var buyOrder=[];
 var totalLevelsBought=0;
 var totalSpent=0;
 var nextOutOfBudget=[];

 for(var step=0;step<2500;step++){
  var best=null;
  for(var i=0;i<cm.length;i++){
   var r=cm[i],L=simLv[r.id]||0;
   if(L>=r.levels)continue;
   if(r.tier>1&&(r.tier-1>=TH.length||bought(r.tier-1)<TH[r.tier-1]))continue;
   if(ctx && ctx.keepOneWD && r.id==='wormhole_dampening' && L>=r.levels-1)continue;
   var pr=(virt?r.virtue_prices:r.prices)||r.prices;
   var p=(pr[L]||0)*labDisc;
   if(!p)continue;
   var sc=cgain(r,L,ctx,p)/p;
   if(!best||sc>best.score)best={r:r,L:L,price:p,score:sc};
  }
  if(!best)break;

  if(remCash>=best.price){
   remCash-=best.price;
   totalSpent+=best.price;
   totalLevelsBought++;
   simLv[best.r.id]=best.L+1;
   if(!buyById[best.r.id]){
    buyById[best.r.id]={r:best.r,from:(lv[best.r.id]||0),to:best.L+1,count:1,cost:best.price,canBuy:true,firstScore:best.score};
    buyOrder.push(buyById[best.r.id]);
   }else{
    buyById[best.r.id].to=best.L+1;
    buyById[best.r.id].count++;
    buyById[best.r.id].cost+=best.price;
   }
  }else{
   simLv[best.r.id]=best.L+1;
   var lastNext=nextOutOfBudget[nextOutOfBudget.length-1];
   if(lastNext && lastNext.r.id===best.r.id){
    lastNext.to=best.L+1;
    lastNext.count++;
    lastNext.cost+=best.price;
   }else{
    if(nextOutOfBudget.length>=5)break;
    nextOutOfBudget.push({r:best.r,from:best.L,to:best.L+1,count:1,cost:best.price,canBuy:false,firstScore:best.score});
   }
  }
 }

 buyOrder.sort(function(a,b){
  if(a.r.tier!==b.r.tier)return a.r.tier-b.r.tier;
  return b.firstScore-a.firstScore;
 });

 return {
  affordableList:buyOrder,
  nextList:nextOutOfBudget,
  totalLevelsBought:totalLevelsBought,
  totalSpent:totalSpent,
  remCash:remCash,
  startCash:startCash
 };
}

function calcBaseMaxRCB(clv,elv,R){
 var rcbAdd=0, rcbMult=1, seenEpicMult=false;
 if(R && R.length){
  for(var k=0;k<R.length;k++){
   var r=R[k];
   var L=(r.type==='epic'?(elv[r.id]||0):(clv[r.id]||0));
   if(L<=0)continue;
   if(r.id==='epic_multiplier')seenEpicMult=true;
   var cats=String(r.categories||'').split(',');
   if(cats.indexOf('running_chicken_bonus')>=0){
    if(r.id==='excitable_chickens' || r.id==='excitable' || r.id==='epic_clucking' || r.per_level<0.05)continue;
    if(r.levels_compound==='multiplicative')rcbMult*=Math.pow((r.per_level>=1?r.per_level:(1+r.per_level)),L);
    else rcbAdd+=r.per_level*L;
   }
  }
 }
 if(!seenEpicMult)rcbAdd+=2*((elv&&elv['epic_multiplier'])||0);
 return Math.max(5,(5 + rcbAdd) * rcbMult);
}

function calcEggProgress(b,sim,logi,fuelInfo){
 var g=b.game||{};
 var curEgg=sim.eggType||'EDIBLE';
 var idx=EGG_ORDER.indexOf(curEgg);
 var nextEgg=(idx>=0 && idx<EGG_ORDER.length-1)?EGG_ORDER[idx+1]:null;
 var reqDiscoverFV=(idx>=0 && idx+1<EGG_DISCOVER_FV.length)?EGG_DISCOVER_FV[idx+1]:0;
 var reqUpgradeFV=(idx>=0 && idx+1<EGG_UPGRADE_FV.length)?EGG_UPGRADE_FV[idx+1]:0;
 var curFV=logi.farmValue;
 var fvAt90Pct=logi.fvAt90Pct||curFV;
 var pct=reqUpgradeFV>0?Math.min(100,(curFV/reqUpgradeFV)*100):100;
 var canUpgradeEgg=(nextEgg && curFV>=reqUpgradeFV && reqUpgradeFV>0);
 var maxReachedIdx=EGG_ORDER.indexOf(g.maxEggReached||'');
 var alreadyDiscovered=(maxReachedIdx>idx) || (reqDiscoverFV>0 && curFV>=reqDiscoverFV);

 var peakPrestigeIdx=(idx>=0)?Math.min(17,Math.max(idx,maxReachedIdx)):-1;
 var peakPrestigeEgg=(peakPrestigeIdx>=0)?EGG_ORDER[peakPrestigeIdx]:curEgg;
 var peakPrestigeName=EGG_HE[peakPrestigeEgg]||peakPrestigeEgg;
 var belowPeakEgg=(idx>=0 && peakPrestigeIdx>idx);
 var nextEggIsPrestigeUpgrade=!!(nextEgg && nextEgg!=='ENLIGHTENMENT' && reqUpgradeFV>0);
 var willCrossNextEggAt90=!!(nextEggIsPrestigeUpgrade && fvAt90Pct>=reqUpgradeFV);

 var isFuelEggForShip=(fuelInfo.reqFuels.indexOf(curEgg)>=0);
 var shouldFillTankFirst=(fuelInfo.hasFuelTank && isFuelEggForShip && !fuelInfo.hasFuelInTank && fuelInfo.tankFreeSpace>=1e8);

 return {
  curEgg:curEgg,curName:EGG_HE[curEgg]||curEgg,
  nextEgg:nextEgg,nextName:nextEgg?(EGG_HE[nextEgg]||nextEgg):null,
  curFV:curFV,fvAt90Pct:fvAt90Pct,reqFV:reqUpgradeFV,reqDiscoverFV:reqDiscoverFV,pct:pct,
  canUpgradeEgg:canUpgradeEgg,alreadyDiscovered:alreadyDiscovered,

  belowPeakEgg:belowPeakEgg,willCrossNextEggAt90:willCrossNextEggAt90,
  shouldFillTankFirst:shouldFillTankFirst
 };
}

 }

 }else if(isLate && hasActiveBoost && hab.pop>=4.2e9){

function analyzeArtifacts(b,permitTier,curEgg,peCount,elv,clv,R){
 var isVirt=!!VIRT[curEgg];
 var db=isVirt?((b.virtue&&b.virtue.afx)||{}):(b.artifactsDb||{});
 var inv=db.inventoryItems||[];
 var byId={};
 inv.forEach(function(it){byId[it.itemId]=it});

 var isEnlightenment=(curEgg==='ENLIGHTENMENT');
 var sets=db.activeArtifactSets||[];
 var homeSet=(sets[0]&&sets[0].slots)||[];
 var maxArtSlots=(permitTier===3)?4:2;

 var baseMaxRCB=calcBaseMaxRCB(clv||{},elv||{},R||[]);
 var basePE=1 + (5 + ((elv&&elv['prophecy_bonus'])||0))/100;
 var baseSE=10 + ((elv&&elv['soul_eggs'])||0);

 function normLevel(l){return l||'INFERIOR'}
 function normRarity(r){return r||'COMMON'}

 function formatArtLabel(sp){
  var info=ART_INFO[sp.name]||{name:shipName(sp.name),role:'other',desc:''};
  var lvl=normLevel(sp.level);
  var rar=normRarity(sp.rarity);
  var tLabel=TIER_MAP[lvl]||lvl;
  var rLabel=RARITY_MAP[rar]||'';
  return info.name+' ('+tLabel+rLabel+')';
 }

 function formatStoneList(stones){
  return (stones||[]).filter(function(st){return st&&st.name}).map(function(st){
   var sInfo=STONE_INFO[st.name]||{name:shipName(st.name)};
   var sTier=STONE_TIER_MAP[normLevel(st.level)]||'';
   return sInfo.name+(sTier?' '+sTier:'');
  });
 }

 function evalItemPrestigeSE(sp,stones,mode){
  var isLunar=(mode==='lunar' || mode===true);
  var isActiveRun=(mode==='active' || mode===false);
  var lvl=normLevel(sp.level);
  var rar=normRarity(sp.rarity);
  var stList=(stones||[]).filter(function(st){return st&&st.name});
  var dCount=stList.filter(function(st){return st.name==='DILITHIUM_STONE'}).length;

  var earnMult=1, featherMult=1, vialAdd=0, terraAdd=0, lunarMult=1, bookAdd=0, prophPts=0, soulPts=0;
  if(sp.name==='PHOENIX_FEATHER')featherMult=getFeatherMult(lvl,rar);
  else if(sp.name==='DEMETERS_NECKLACE')earnMult=getNecklaceMult(lvl,rar);
  else if(sp.name==='TUNGSTEN_ANKH')earnMult=getAnkhMult(lvl,rar);
  else if(sp.name==='BOOK_OF_BASAN')bookAdd=getBookBonus(lvl,rar);
  else if(sp.name==='VIAL_MARTIAN_DUST')vialAdd=getVialAdd(lvl,rar);
  else if(sp.name==='LUNAR_TOTEM')lunarMult=getTotemMult(lvl,rar);
  else if(sp.name==='LIGHT_OF_EGGENDIL' && isEnlightenment)earnMult=getEnlightenmentMult(lvl,rar);

  stList.forEach(function(st){
   var sl=normLevel(st.level);
   if(st.name==='PROPHECY_STONE')prophPts+=(PROPHECY_STONE_PTS[sl]||0);
   else if(st.name==='SOUL_STONE')soulPts+=(SOUL_STONE_PTS[sl]||0);
   else if(st.name==='SHELL_STONE')earnMult*=(SHELL_STONE_MULT[sl]||1);
   else if(st.name==='TERRA_STONE')terraAdd+=(TERRA_STONE_ADD[sl]||0);
   else if(st.name==='LUNAR_STONE')lunarMult*=(LUNAR_STONE_MULT[sl]||1);
  });

  var seStatMult=(baseSE + soulPts)/baseSE;
  var peStatMult=Math.pow((basePE + (bookAdd + prophPts)/100)/basePE, peCount||0);
  var rcbMult=isActiveRun?((baseMaxRCB + vialAdd + terraAdd)/Math.max(3,baseMaxRCB)):1;
  var awayMult=isLunar?lunarMult:1;
  var totalEarnMult=earnMult * seStatMult * peStatMult * rcbMult * awayMult;
  return {
   seGainMult:featherMult * Math.pow(Math.max(1,totalEarnMult),0.21),
   dCount:dCount,
   isPureDilithium:(dCount>0 && dCount===stList.length)
  };
 }

 var equipped=[];
 var gussetMult=1, metronomeMult=1, compassMult=1, chaliceMult=1, featherMult=1;
 var tachyonStoneMult=1, quantumStoneMult=1, dilithiumMult=1, lifeStoneMult=1;
 var lunarTotemMult=1, lunarStoneMult=1;
 var artifactEarningsMult=1, puzzleCubeMult=1, mercurysLensMult=1;
 var bookBonus=0, soulStonePts=0, prophStonePts=0, vialAdd=0, terraAdd=0;
 var enlightenmentWarnings=[];
 var equippedActiveSEMult=1, equippedPassiveSEMult=1, equippedLunarSEMult=1;
 var equippedEmptySlots=0, equippedEmptyDetails=[];

 for(var i=0;i<maxArtSlots;i++){
  var sl=homeSet[i];
  if(sl && sl.occupied && byId[sl.itemId]){
   var it=byId[sl.itemId];
   var comp=it.artifact||{};
   var sp=comp.spec||{};
   var lvl=normLevel(sp.level);
   var rar=normRarity(sp.rarity);
   var stones=comp.stones||[];
   var info=ART_INFO[sp.name]||{name:shipName(sp.name),role:'other',desc:''};

   var clarityPower=0;
   var stoneLabels=formatStoneList(stones);
   stones.forEach(function(st){
    if(!st || !st.name)return;
    if(st.name==='CLARITY_STONE')clarityPower+=(CLARITY_STONE_VAL[normLevel(st.level)]||0);
   });

   var effMult=1;
   if(isEnlightenment && sp.name!=='LIGHT_OF_EGGENDIL'){
    effMult=clarityPower;
    if(clarityPower<=0)enlightenmentWarnings.push(formatArtLabel(sp));
   }

   if(effMult>0){

function optimizeStones(art,logi){
 var bSE=logi.bonusPerSE||150;
 var bPE=logi.bonusPerPE||1.10;
 var pe=logi.peCount||0;
 var soulGainMult=(bSE + art.bestSoulPts)/bSE;
 var prophGainMult=Math.pow((bPE + art.bestProphPts/100)/bPE, pe);
 var useProphecy=(prophGainMult >= soulGainMult);
 var prestigeStoneAdvice=useProphecy
  ?('שבץ Prophecy Stones (+'+((prophGainMult-1)*100).toFixed(2)+'% לאבן מול +'+((soulGainMult-1)*100).toFixed(2)+'% ב-Soul Stone עם '+pe+' PE)')
  :('שבץ Soul Stones (+'+((soulGainMult-1)*100).toFixed(2)+'% לאבן מול +'+((prophGainMult-1)*100).toFixed(2)+'% ב-Prophecy Stone עם '+pe+' PE)');

 var slots=art.totalContractSlots||0;
 var contractStoneAdvice='';
 if(slots<=0){
  contractStoneAdvice='אין סלוטים פנויים בסט החוזים הנוכחי (נדרשים ארטיפקטים Rare/Epic/Legendary).';
 }else{
  var rawLay=(logi.totalLayRate / (Math.max(1,art.metronomeMult)*Math.max(1,art.tachyonStoneMult))) * (art.contractMetronomeMult||1);
  var rawShip=(logi.totalShipCap / (Math.max(1,art.compassMult)*Math.max(1,art.quantumStoneMult))) * (art.contractCompassMult||1);
  if(rawLay<=0 || rawShip<=0){
   contractStoneAdvice='שבץ '+slots+' אבני Tachyon (להאצת הטלה) ואז אזן עם Quantum כשהמשלוחים מתקרבים ל-90%.';
  }else{
   var bestK=0, bestThroughput=-1;
   for(var k=0;k<=slots;k++){
    var q=slots-k;
    var lay=rawLay * Math.pow(art.bestTachyonMult,k);
    var ship=rawShip * Math.pow(art.bestQuantumMult,q);
    var thr=Math.min(lay,ship);
    if(thr>bestThroughput){bestThroughput=thr;bestK=k;}
   }
   var bestQ=slots-bestK;
   contractStoneAdvice='חלוקה אופטימלית ל-'+slots+' סלוטים (עם סט החוזים): '+bestK+'× Tachyon + '+bestQ+'× Quantum';
  }
 }
 return {useProphecy:useProphecy,prestigeStoneAdvice:prestigeStoneAdvice,contractStoneAdvice:contractStoneAdvice};
}

   shouldUseNow=true;

function shipName(s){
 if(SHIP_META[s])return SHIP_META[s].name;
 return String(s||'').split('_').map(function(w){return w.charAt(0)+w.slice(1).toLowerCase()}).join(' ');
}
function cleanContractName(id){return String(id||'חוזה').split('-').map(function(w){return w.charAt(0).toUpperCase()+w.slice(1)}).join(' ')}
function hrs(sec){if(sec<=0)return '0 דקות';var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);return h>=48?Math.round(h/24)+' ימים':h+' שעות ו-'+m+' דקות'}

function formatRewardItem(g){
 var rt=g.rewardType||'';
 var amt=Number(g.rewardAmount)||0;
 if(rt==='EGGS_OF_PROPHECY')return (amt>1?Math.round(amt)+' ':'')+'Prophecy Egg';
 if(rt==='GOLDEN_EGGS'||rt==='GOLD')return fmt(amt)+' GE';
 if(rt==='SOUL_EGGS')return fmt(amt)+' SE';
 if(rt==='ARTIFACT_CASE')return 'תיבת ארטיפקטים';
 if(rt==='EPIC_RESEARCH_ITEM')return 'שדרוג Epic';
 if(rt==='BOOST')return (amt>1?Math.round(amt)+'× ':'')+(g.rewardSubType?getBoostInfo(g.rewardSubType).name:'בוסט');
 if(rt==='PIGGY_FILL')return '+'+fmt(amt)+' Piggy';
 if(rt==='PIGGY_LEVEL_BUMP')return 'רמת Piggy +'+Math.max(1,Math.round(amt));
 if(rt==='SHELL_SCRIPT')return fmt(amt)+' תלושי עיצוב';
 if(rt==='CASH')return 'מזומן';
 return shipName(rt||'פרס');
}

function getContractGoals(c,b){
 var k=c.contract||{};
 var grade=c.grade || (b.contracts && b.contracts.lastGraded) || '';
 if(Array.isArray(k.gradeSpecs) && k.gradeSpecs.length){
  var matched=null;
  if(grade){
   for(var i=0;i<k.gradeSpecs.length;i++){
    if(k.gradeSpecs[i].grade===grade){matched=k.gradeSpecs[i];break}
   }
  }
  var spec=matched || k.gradeSpecs[0];
  if(spec && Array.isArray(spec.goals))return spec.goals;
 }
 if(Array.isArray(k.goalSets) && k.goalSets.length){
  var gs=k.goalSets[c.league||0] || k.goalSets[0];
  if(gs && Array.isArray(gs.goals))return gs.goals;
 }
 return Array.isArray(k.goals)?k.goals:[];
}

function analyzeContractRewards(c,b){
 var goals=getContractGoals(c,b);
 var hasPE=false;
 var peCount=0;
 var items=[];
 goals.forEach(function(g){
  if(g.rewardType==='EGGS_OF_PROPHECY'){
   hasPE=true;
   peCount+=Math.max(1,Math.round(Number(g.rewardAmount)||1));
  }
  items.push(formatRewardItem(g));
 });
 return {hasPE:hasPE,peCount:peCount,rewardsText:items.join(' • ')};
}

function checkColleggtibleStatus(k,b){
 var customId=k.customEggId || (k.egg==='CUSTOM_EGG'?(k.identifier||''):'');
 if(!customId && k.egg && EGG_ORDER.indexOf(k.egg)<0 && !VIRT[k.egg])customId=k.egg;
 if(!customId)return {isColleggtible:false,needs10B:false,customId:''};
 var infoList=(b.contracts && b.contracts.customEggInfo)||[];
 var bestPop=0;
 infoList.forEach(function(ce){
  if(ce && (ce.identifier===customId || ce.id===customId)){
   bestPop=Math.max(bestPop,Number(ce.maxPopulation||ce.population||0));
  }
 });
 return {isColleggtible:true,needs10B:(bestPop<1e10),bestPop:bestPop,customId:customId};
}

function getContractInventorySummary(b,permitTier){
 var g=(b&&b.game)||{};
 var maxBoostSlots=(permitTier===3)?5:2;
 var owned=[];
 (g.boosts||[]).forEach(function(bo){
  var bid=bo.boostId||bo.id||'';
  if(bid && (bo.count||0)>0){
   var info=getBoostInfo(bid);
   owned.push({id:bid,count:bo.count,name:info.name,cat:info.cat,power:info.power});
  }
 });
 function pick(cat,minPwr,maxPwr){
  var list=owned.filter(function(x){
   if(x.cat!==cat)return false;
   if(minPwr!==undefined && x.power<minPwr)return false;
   if(maxPwr!==undefined && x.power>maxPwr)return false;
   return true;
  });
  list.sort(function(a,b){return b.power-a.power});
  return list[0]||null;
 }
var availGE=Math.max(0,(g.goldenEggsEarned||0)-(g.goldenEggsSpent||0));
 var spare100x=owned.filter(function(x){
  return x.cat==='tachyon'&&x.power>=100&&x.power<1000&&x.count>=3;
 })[0]||null;
 return {
  maxBoostSlots:maxBoostSlots,availGE:availGE,owned:owned,
  best1000x:pick('tachyon',1000,10000),
  best100x:pick('tachyon',100,999),
  best10xFree:pick('tachyon',1,99),
  bestBeacon10x:pick('beacon',10,100),
  bestBeacon2x:pick('beacon',2,9),
  bestMirror:pick('mirror',1,10000),
  bestFeed:pick('feed',1,1000)
 };
}

function getPermitTier(b){

function detectBestShip(b,isVirt,events,hasFuelTank,curSE,permitTier){
 var sel=$('shipTarget').value;
 var db=b.artifactsDb||{};
 var vafx=(b.virtue&&b.virtue.afx)||{};
 var seenMaxIdx=0;
 var launchCounts={};

 function recordShip(s,countToHistory){
  var i=SHIP_ORDER.indexOf(s);
  if(i>seenMaxIdx)seenMaxIdx=i;
  if(s && countToHistory)launchCounts[s]=(launchCounts[s]||0)+1;
 }
 (db.missionInfos||[]).forEach(function(m){recordShip(m.ship,true)});
 (db.missionArchive||[]).forEach(function(m){recordShip(m.ship,true)});
 if(vafx.lastFueledShip)recordShip(vafx.lastFueledShip,false);
 if(db.lastFueledShip)recordShip(db.lastFueledShip,false);

 var unlockedIdx=seenMaxIdx;
 while(unlockedIdx<SHIP_ORDER.length-1){
  var nextKey=SHIP_ORDER[unlockedIdx+1];
  var nextM=SHIP_META[nextKey];
  var prevCount=launchCounts[SHIP_ORDER[unlockedIdx]]||0;
  if(prevCount>=nextM.reqPrevLaunches && curSE>=nextM.reqSE){
   unlockedIdx++;
  }else{
   break;
  }
 }
 if(isVirt && unlockedIdx>9)unlockedIdx=9;

 var highestUnlockedShip=SHIP_ORDER[unlockedIdx]||'CHICKEN_ONE';

 var effectiveIdx=unlockedIdx;
 var cappedReason='';
 while(effectiveIdx>0){
  var sKey=SHIP_ORDER[effectiveIdx];
  var sMeta=SHIP_META[sKey];
  var sFuels=Object.keys(sMeta.fuels.SHORT||{});
  if(!hasFuelTank && sFuels.length>1){
   cappedReason=sMeta.name+' דורשת '+sFuels.length+' סוגי דלק (מיכל הדלק נפתח ב-100K SE)';
   effectiveIdx--;
   continue;
  }
  if(permitTier===1 && sIdxExceedsFreeTank(sKey)){
   cappedReason=sMeta.name+' דורשת יותר מ-2B דלק במיכל (מגבלת מיכל ללא Pro Permit)';
   effectiveIdx--;
   continue;
  }
  break;
 }

 var defaultTarget=SHIP_ORDER[effectiveIdx]||'CHICKEN_ONE';
 var target=(sel && sel!=='auto')?sel:defaultTarget;
 var tIdx=SHIP_ORDER.indexOf(target);
 var tMeta=SHIP_META[target]||SHIP_META.CHICKEN_ONE;
 var isTargetUnlocked=(tIdx<=unlockedIdx);

 var nextUnlockIdx=unlockedIdx+1;
 var nextShip=(nextUnlockIdx<SHIP_ORDER.length)?SHIP_ORDER[nextUnlockIdx]:null;
 var nextMeta=nextShip?SHIP_META[nextShip]:null;
 var curShipLaunches=launchCounts[SHIP_ORDER[unlockedIdx]]||0;
 var missingLaunches=nextMeta?Math.max(0,nextMeta.reqPrevLaunches-curShipLaunches):0;
 var missingSE=nextMeta?Math.max(0,nextMeta.reqSE-curSE):0;

 var preferExtended=(target==='HENERPRISE' || target==='ATREGGIES');
 var durKey=preferExtended?'EXTENDED':'SHORT';
 var missionDur=preferExtended?'Extended':'Short';
 if(events && events.missionCapacityMultiplier>1 && !preferExtended)missionDur='Short (2x Capacity!)';

 return {
  target:target,tIdx:tIdx,isTargetUnlocked:isTargetUnlocked,
  highestUnlockedShip:highestUnlockedShip,unlockedIdx:unlockedIdx,
  cappedReason:cappedReason,
  curShipLaunches:curShipLaunches,
  nextShip:nextShip,nextMeta:nextMeta,missingLaunches:missingLaunches,missingSE:missingSE,
  preferExtended:preferExtended,durKey:durKey,missionDur:missionDur,
  fundCost:tMeta.fundCost
 };
}

function sIdxExceedsFreeTank(shipKey){
 var idx=SHIP_ORDER.indexOf(shipKey);
 return idx>=5;
}

function checkShipFuel(b,sim,isVirt,events,cash,logi,permitTier){
 var g=b.game||{};
 var curSE=Number(g.soulEggsD||g.soulEggs||0);
 var db=b.artifactsDb||{};
 var vafx=(b.virtue&&b.virtue.afx)||{};
 var tank=db.tankFuels||vafx.tankFuels||[];
 var tankLevel=Number(db.tankLevel||0);
 var tankTotal=tank.reduce(function(x,y){return x+(y||0)},0);
 var hasAnyMissions=((db.missionInfos&&db.missionInfos.length>0)||(db.missionArchive&&db.missionArchive.length>0));

 var launchpadUnlocked=(curSE>=10000 || hasAnyMissions || isVirt);
 var hasFuelTank=(curSE>=100000 || tankTotal>0 || tankLevel>0 || isVirt);

 var shipProg=detectBestShip(b,isVirt,events,hasFuelTank,curSE,permitTier);
 var target=shipProg.target;
 var tMeta=SHIP_META[target]||SHIP_META.CHICKEN_ONE;
 var costMap=(tMeta.fuels&&tMeta.fuels[shipProg.durKey])||{ROCKET_FUEL:1e5};
 var reqFuels=Object.keys(costMap);
 var fundCost=tMeta.fundCost||0;

 var curEgg=sim.eggType||'';
 var curEggIdx=EGG_ORDER.indexOf(curEgg);
 var rfIdx=EGG_ORDER.indexOf('ROCKET_FUEL');
 var curEggName=EGG_HE[curEgg]||curEgg;

 var tankCapacity=hasFuelTank?(TANK_CAPACITIES[Math.min(tankLevel,TANK_CAPACITIES.length-1)]||2e9):0;
 var tankFreeSpace=hasFuelTank?Math.max(0,tankCapacity-tankTotal):0;

 var onFuelEgg=(reqFuels.indexOf(curEgg)>=0);
 var minLaunchesInTank=Infinity;
 var missingDetails=[];
 var hasAllFuelsInTank=true;
 var hasOtherFuelsInTank=true;
 var canFuelNow=false;

 if(!launchpadUnlocked){
  hasAllFuelsInTank=false;
  hasOtherFuelsInTank=false;
  minLaunchesInTank=0;
  missingDetails.push('כן השיגור נפתח ב-10,000 SE (חסרים '+fmt(Math.max(0,10000-curSE))+' SE) + 100K ביצים/דקה ב-Rocket Fuel');
 }else if(!shipProg.isTargetUnlocked){
  hasAllFuelsInTank=false;
  hasOtherFuelsInTank=false;
  minLaunchesInTank=0;
  var prevShipName=SHIP_ORDER[shipProg.tIdx-1]?shipName(SHIP_ORDER[shipProg.tIdx-1]):'';
  missingDetails.push('ספינת '+shipName(target)+' טרם נפתחה (דורשת '+tMeta.reqPrevLaunches+' שיגורי '+prevShipName+' ו-'+fmt(tMeta.reqSE)+' SE)');
 }else if(!hasFuelTank){
  hasAllFuelsInTank=false;
  hasOtherFuelsInTank=false;
  minLaunchesInTank=0;
  if(reqFuels.length>1){
   canFuelNow=false;
   missingDetails.push('ספינת '+shipName(target)+' דורשת '+reqFuels.length+' סוגי דלק — מיכל הדלק נפתח ב-100K SE');
  }else if(onFuelEgg){
   if(logi.totalLayRate<100000 && !hasAnyMissions){
    canFuelNow=false;
    missingDetails.push('הגע לקצב הטלה של 100,000 ביצים/דקה לבניית כן השיגור (כרגע '+fmt(logi.totalLayRate)+'/דק\')');
   }else{
    canFuelNow=true;
   }
  }else{
   canFuelNow=false;
   if(curEggIdx>=0 && curEggIdx<rfIdx){
    missingDetails.push('התקדם לביצת Rocket Fuel לתדלוק ישיר (מיכל דלק נפתח ב-100K SE)');
   }else{
    missingDetails.push('מיכל דלק נעול עד 100K SE — לא ניתן לתדלק מביצת '+curEggName+' (תדלק ישירות מ-Rocket Fuel בריצה הבאה)');
   }
  }
 }else{
  reqFuels.forEach(function(f){
   var idx=EGG_ORDER.indexOf(f);
   var stored=(idx>=0)?(tank[idx]||0):0;
   var reqAmt=costMap[f]||1e6;
   var launches=Math.floor(stored/reqAmt);
   if(launches<minLaunchesInTank)minLaunchesInTank=launches;
   if(stored<reqAmt){
    hasAllFuelsInTank=false;
    if(f!==curEgg)hasOtherFuelsInTank=false;
    missingDetails.push((EGG_HE[f]||f)+': '+fmt(stored)+'/'+fmt(reqAmt)+' (חסר '+fmt(reqAmt-stored)+')');
   }
  });
  if(!isFinite(minLaunchesInTank))minLaunchesInTank=0;
  canFuelNow=(onFuelEgg?hasOtherFuelsInTank:hasAllFuelsInTank);
 }

 var canAffordFund=(cash>=fundCost);
 var canLaunchNow=(canFuelNow && canAffordFund);

 var affordableFallback=null;
 if(canFuelNow && !canAffordFund && shipProg.tIdx>0){
  for(var fi=shipProg.tIdx-1;fi>=0;fi--){
   var fk=SHIP_ORDER[fi];
   var fm=SHIP_META[fk];
   var fCostMap=(fm.fuels&&fm.fuels.SHORT)||{};
   var fReqs=Object.keys(fCostMap);
   if(!hasFuelTank && fReqs.length>1)continue;
   if(cash>=fm.fundCost){
    var fbOk=false;
    if(!hasFuelTank){
     fbOk=(fReqs.length===1 && fReqs[0]===curEgg);
    }else{
     fbOk=fReqs.every(function(fe){
      if(fe===curEgg)return true;
      var eIdx=EGG_ORDER.indexOf(fe);
      return eIdx>=0 && (tank[eIdx]||0)>=(fCostMap[fe]||0);
     });
    }
    if(fbOk){
     affordableFallback={key:fk,name:fm.name,fundCost:fm.fundCost};
     break;
    }
   }
  }
 }

 var reqNames=reqFuels.map(function(e){
  var amt=costMap[e];
  return (EGG_HE[e]||e)+(amt?' ('+fmt(amt)+')':'');
 }).join(', ');

 var fuelBreakdown=reqFuels.map(function(f){
  var idx=EGG_ORDER.indexOf(f);
  var stored=(hasFuelTank && idx>=0)?(tank[idx]||0):0;
  var reqAmt=costMap[f]||1e6;
  return {egg:f,name:EGG_HE[f]||f,stored:stored,reqAmt:reqAmt,missingAmt:Math.max(0,reqAmt-stored),launches:reqAmt>0?Math.floor(stored/reqAmt):0};
 });

 return {
  curSE:curSE,launchpadUnlocked:launchpadUnlocked,hasFuelTank:hasFuelTank,fuelBreakdown:fuelBreakdown,
  curEggIdx:curEggIdx,rfIdx:rfIdx,
  target:target,shipProg:shipProg,reqFuels:reqFuels,reqNames:reqNames,onFuelEgg:onFuelEgg,
  hasFuelInTank:hasAllFuelsInTank,canFuelNow:canFuelNow,canAffordFund:canAffordFund,fundCost:fundCost,
  canLaunchNow:canLaunchNow,affordableFallback:affordableFallback,
  tankTotal:tankTotal,tankCapacity:tankCapacity,tankFreeSpace:tankFreeSpace,tankLevel:tankLevel,
  minLaunchesInTank:minLaunchesInTank,missingDetails:missingDetails,
  curEggName:curEggName
 };
}

function resolveArtifactContext(b,art,logi,macro,prestigeInfo,eggProg,hasActiveBoost,runMode,activeRunning,CD){
 var focusPref=($('artFocus')?$('artFocus').value:'auto')||'auto';
 var farms=b.farms||[];

 function pickPrimaryContract(){
  if(!activeRunning || !activeRunning.length)return null;
  var ranked=activeRunning.slice().sort(function(x,y){
   var px=(x.needs10B||x.hasPE)?1:0;
   var py=(y.needs10B||y.hasPE)?1:0;
   if(px!==py)return py-px;
   var rx=(!x.pointsOnly)?1:0;
   var ry=(!y.pointsOnly)?1:0;
   if(rx!==ry)return ry-rx;
   var gx=(x.cfMetrics && x.cfMetrics.habPct<90)?1:0;
   var gy=(y.cfMetrics && y.cfMetrics.habPct<90)?1:0;
   if(gx!==gy)return gy-gx;
   return 0;
  });
  return ranked[0]||null;
 }

 var mode='home_passive';
 var targetContract=pickPrimaryContract();

 if(focusPref==='contract'){
  mode='contract';
 }else if(focusPref==='home_active'){
  mode=macro.isEnl?'enlightenment':'home_active';
 }else if(focusPref==='home_passive'){
  mode=macro.isEnl?'enlightenment':(logi.lunarBeatsActive?'home_lunar':'home_passive');
 }else{
  if(macro.isEnl){
   mode='enlightenment';
  }else if(macro.isVirt){
   mode=(hasActiveBoost)?'home_active':'home_passive';
  }else if((hasActiveBoost && !logi.lunarBeatsActive) || prestigeInfo.status==='boost_then_prestige' || runMode==='ready'){
   mode='home_active';
  }else if(prestigeInfo.status==='ready' || eggProg.canUpgradeEgg){
   mode=logi.lunarBeatsActive?'home_lunar':'home_passive';
  }else if(targetContract){
   mode='contract';
  }else if(logi.lunarBeatsActive){
   mode='home_lunar';
  }else{
   mode='home_passive';
  }
 }

 if(mode==='contract'){
  if(targetContract){
   var cfIdx=-1;
   for(var fi=0;fi<farms.length;fi++){
    if(farms[fi].farmType==='CONTRACT' && farms[fi].contractId===targetContract.id){cfIdx=fi;break}
   }
   var cEq=(cfIdx>0 && art.getSetEquippedForFarmIndex)?art.getSetEquippedForFarmIndex(cfIdx):[];
   var stage='CONTRACT_PROD';
   var stageLabel='תפוקת חוזה מקסימלית';
   var cTargetSet=art.setContract.slice();
   if(!art.bestOwned['TACHYON_DEFLECTOR'] && art.bestOwned['SHIP_IN_A_BOTTLE'] && cTargetSet.length<art.maxArtSlots){
    cTargetSet.unshift(art.bestOwned['SHIP_IN_A_BOTTLE']);
   }
   var cm=targetContract.cfMetrics;
   var crp=targetContract.researchPlan;
   if(cm && cm.pop<5e7 && ((crp && crp.affordableList.length>0) || cm.habPct<15)){
    stage='CONTRACT_RESEARCH';
    stageLabel='תחילת חוזה — מחקר והכנסות (ללא ריצה)';
    cTargetSet=art.setContractResearch.length?art.setContractResearch:cTargetSet;
   }else if(cm && (!crp || crp.affordableList.length===0) && cm.habPct<80){
    stage='CONTRACT_IHR';
    stageLabel='מילוי לולים בחוזה (IHR)';
    cTargetSet=art.setContractIHR.length?art.setContractIHR:cTargetSet;
   }
   var eqByRaw={};
   cEq.forEach(function(it){
    if(!eqByRaw[it.rawName] || (it.score||0)>eqByRaw[it.rawName].score)eqByRaw[it.rawName]=it;
   });
   var missingItems=cTargetSet.filter(function(t){
    var cur=eqByRaw[t.rawName];
    return !cur || (cur.score||0)<(t.score||0);
   });
   var isOpt=(cTargetSet.length===0) || (missingItems.length===0);
   return {
    focusPref:focusPref,
    mode:'contract',
    modeBadge:'חוזה פעיל: '+targetContract.name+' ('+stageLabel+')',
    contractId:targetContract.id,
    contractName:targetContract.name,
    contractStage:stage,
    stageLabel:stageLabel,
    targetSet:cTargetSet,
    equippedList:cEq,
    farmLabel:'בחוזה '+targetContract.name,
    isOptimal:isOpt,
    gainBoostPct:0,
    whyNote:'מותאם לשלב הנוכחי בחוזה ללא תלות בריצת תרנגולות.'
   };
  }
  var fallbackEq=art.equipped;
  var fbEqByRaw={};
  fallbackEq.forEach(function(it){
   if(!fbEqByRaw[it.rawName] || (it.score||0)>fbEqByRaw[it.rawName].score)fbEqByRaw[it.rawName]=it;
  });
  var fbMissing=art.setContract.filter(function(t){
   var cur=fbEqByRaw[t.rawName];
   return !cur || (cur.score||0)<(t.score||0);
  });
  return {
   focusPref:focusPref,
   mode:'contract',
   modeBadge:'מצב חוזים (אין חוזה פתוח כרגע — מוצג סט קו-אופ)',
   contractId:null,
   contractName:'',
   contractStage:'CONTRACT_PROD',
   stageLabel:'סט חוזים כללי',
   targetSet:art.setContract,
   equippedList:fallbackEq,
   farmLabel:'כרגע',
   isOptimal:(art.setContract.length===0 || fbMissing.length===0),
   gainBoostPct:0,
   whyNote:'סט חוזים כללי ללא תלות בריצת תרנגולות.'
  };
 }

 if(mode==='enlightenment'){
  var enlOpt=(art.enlightenmentWarnings.length===0 && art.equipped.length>=art.setMain.length && art.equippedPassiveSEMult>=art.optimalPassiveSEMult*0.98);
  return {
   focusPref:focusPref,
   mode:'enlightenment',
   modeBadge:'ביצת Enlightenment (Clarity Stones)',
   contractId:null,contractName:'',contractStage:'',stageLabel:'Enlightenment',
   targetSet:art.setMain,
   equippedList:art.equipped,
   farmLabel:'בחווה',
   isOptimal:enlOpt,
   gainBoostPct:0,
   whyNote:'מבוסס על Light of Eggendil וארטיפקטים עם אבני Clarity.'
  };
 }

 if(mode==='home_lunar'){
  var optL=art.optimalLunarSEMult;
  var curL=art.equippedLunarSEMult;
  var isOptL=(art.equipped.length>=art.setLunar.length && curL>=optL*0.98) || (optL<=curL*1.02);
  var gainL=Math.max(0,Math.round(((optL/Math.max(1,curL))-1)*100));
  return {
   focusPref:focusPref,
   mode:'home_lunar',
   modeBadge:'חווה ראשית — אופליין / Lunar (ללא ריצת תרנגולות)',
   contractId:null,contractName:'',contractStage:'',stageLabel:'אופליין / Lunar',
   targetSet:art.setLunar,
   equippedList:art.equipped,
   farmLabel:'בחווה',
   isOptimal:isOptL,
   gainBoostPct:gainL,
   whyNote:'סט Lunar Totem ממקסם הכנסות ו-SE ללא צורך בהחזקת כפתור הריצה.'
  };
 }

 if(mode==='home_active'){
  var optA=art.optimalActiveSEMult;
  var curA=art.equippedActiveSEMult;
  var isOptA=(art.equipped.length>=art.setMain.length && curA>=optA*0.98) || (optA<=curA*1.02);
  var gainA=Math.max(0,Math.round(((optA/Math.max(1,curA))-1)*100));
  return {
   focusPref:focusPref,
   mode:'home_active',
   modeBadge:'חווה ראשית — ריצת תרנגולות פעילה (Prestige)',
   contractId:null,contractName:'',contractStage:'',stageLabel:'ריצה פעילה',
   targetSet:art.setMain,
   equippedList:art.equipped,
   farmLabel:'בחווה',
   isOptimal:isOptA,
   gainBoostPct:gainA,
   whyNote:'כולל תוספי Running Chicken Bonus (Vial/Terra) לדחיפת Prestige אקטיבית.'
  };
 }

 var optP=art.optimalPassiveSEMult;
 var curP=art.equippedPassiveSEMult;
 var isOptP=(art.equipped.length>=art.setPassive.length && curP>=optP*0.98) || (optP<=curP*1.02);
 var gainP=Math.max(0,Math.round(((optP/Math.max(1,curP))-1)*100));
 return {
  focusPref:focusPref,
  mode:'home_passive',
  modeBadge:'חווה ראשית — פאסיבי (ללא תלות בריצת תרנגולות)',
  contractId:null,contractName:'',contractStage:'',stageLabel:'פאסיבי (ללא ריצה)',
  targetSet:art.setPassive,
  equippedList:art.equipped,
  farmLabel:'בחווה',
  isOptimal:isOptP,
  gainBoostPct:gainP,
  whyNote:'נבחרו ארטיפקטים שעובדים 100% ללא החזקת כפתור ריצת התרנגולות (ללא Vial/Terra).'
 };
}

 var now=Date.now()/1000,g=b.game||{},sim=homeFarm(b),db=b.artifactsDb||{},permitTier=getPermitTier(b),shipSlots=3,runMode=$('run').value,a=[];

 var prestigeInfo=calcPrestigeInfo(b,sim,logi,C,cash,eggProg,macro,events,hasActiveBoost,elv,art);

 });

    h+='<details class="c-fold"><summary class="c-fold-sum"><span>מדריך 5 שלבים למקסימום CS בחוזה זה</span><span>▼</span></summary>';

    h+='</details>';
   }
   h+='</div>';
  });
 }

 if(recAvailList.length){
  h+='<div class="sec-sub">מומלץ להצטרף עכשיו ('+recAvailList.length+')</div>';
  recAvailList.forEach(function(av){

   h+='<div class="c-card '+cardCls+'">';
   h+='<div class="c-head"><span>'+esc(av.name)+'</span><div>';
   if(av.isCurrentSeason)h+='<span class="badge b-seas" style="margin-inline-end:4px">עונתי</span>';
   h+='<span class="badge '+av.badgeClass+'">'+esc(av.badgeText)+'</span></div></div>';
   h+='<div class="c-chips">';
   if(av.eggName)h+='<span class="c-chip">'+esc(av.eggName)+'</span>';
   if(av.maxCoop)h+='<span class="c-chip">עד '+av.maxCoop+' שחקנים</span>';
   if(av.joinLeft>0)h+='<span class="c-chip">נסגר בעוד '+hrs(av.joinLeft)+'</span>';
   h+='</div>';
   if(av.rewardsText)h+='<div class="c-meta-line"><b>פרסים:</b> '+esc(av.rewardsText)+'</div>';
   h+='<div class="c-next '+(av.guardState==='SLOTS_FULL_P1'?'alert':'do')+'">'+esc(av.guardReason?av.guardReason+' ':'')+esc(av.shortWhy)+'</div>';
   if(av.isReplay && av.playbook){
    h+='<details class="c-fold"><summary class="c-fold-sum"><span>תוכנית פעולה למקסימום CS (5 שלבים)</span><span>▼</span></summary>';
    h+=renderPlaybookBox(av.playbook,'תוכנית פעולה למקסימום נקודות בחוזה '+av.name+':');
    h+='</details>';
   }
   h+='</div>';
  });
 }

 var totalDeferred=waitingList.length + otherAvailList.length;
 if(totalDeferred>0){
  h+='<details class="c-fold" style="margin-top:10px"><summary class="c-fold-sum"><span>ממתינים לסגירה וחוזים נוספים ('+totalDeferred+')</span><span>▼</span></summary>';
  h+='<div style="margin-top:6px">';
  waitingList.forEach(function(d){
   h+='<div class="c-mini-row"><div class="c-head"><span>'+esc(d.name)+'</span><span class="badge b-wait">ממתין לסגירת קבוצה</span></div>';
   h+='<small>כל 3 היעדים נאספו'+(d.coop?' • קבוצה: '+esc(d.coop):'')+'. אין פעולה נדרשת.</small></div>';
  });
  otherAvailList.forEach(function(av){
   h+='<div class="c-mini-row"><div class="c-head"><span>'+esc(av.name)+'</span><div>';
   if(av.isCurrentSeason)h+='<span class="badge b-seas" style="margin-inline-end:4px">עונתי</span>';
   h+='<span class="badge '+av.badgeClass+'">'+esc(av.badgeText)+'</span></div></div>';
   h+='<small>'+(av.guardReason?esc(av.guardReason):esc(av.shortWhy))+(av.joinLeft>0?' • נסגר בעוד '+hrs(av.joinLeft):'')+'</small></div>';
  });
  h+='</div></details>';
 }
 h+='</div>';

 h+='<div id="sec-epic" class="card"><h3>מחקר אפיק ודלק ספינות</h3>';
 h+=row('ספינות פעילות / פנויות','<b>'+P.busy+'/'+P.shipSlots+'</b> ('+P.free+' פנויות)');
 var targetUnlockedLbl=P.fuelInfo.shipProg.isTargetUnlocked?'':' (נעולה)';
 h+=row('ספינת יעד נוכחית','<b>'+esc(shipName(P.fuelInfo.target))+targetUnlockedLbl+'</b> ('+esc(P.fuelInfo.shipProg.missionDur)+' • '+fmt(P.fuelInfo.fundCost)+')');
 if(!P.fuelInfo.launchpadUnlocked){
  h+='<div class="status-banner hold"><b>כן השיגור נעול:</b><small>נפתח ב-10,000 Soul Eggs (חסרים '+fmt(Math.max(0,10000-P.fuelInfo.curSE))+' SE) + 100K ביצים/דקה ב-Rocket Fuel.</small></div>';
 }else if(!P.fuelInfo.hasFuelTank){
  h+='<div class="status-banner hold"><b>תדלוק ישיר (ללא מיכל דלק):</b><small>מיכל הדלק נפתח ב-100,000 SE (חסרים '+fmt(Math.max(0,100000-P.fuelInfo.curSE))+' SE). בינתיים מתדלקים ישירות מביצת Rocket Fuel.</small></div>';
 }else{
  var tankPct=P.fuelInfo.tankCapacity>0?Math.min(100,(P.fuelInfo.tankTotal/P.fuelInfo.tankCapacity)*100):0;
  h+=row('מיכל דלק (רמה '+P.fuelInfo.tankLevel+')','<b>'+fmt(P.fuelInfo.tankTotal)+' / '+fmt(P.fuelInfo.tankCapacity)+'</b> ('+tankPct.toFixed(0)+'%)');
  P.fuelInfo.fuelBreakdown.forEach(function(fb){
   h+=row('• '+esc(fb.name)+' (נדרש '+fmt(fb.reqAmt)+')',fb.missingAmt===0?'<span class="tag-ok">'+fmt(fb.stored)+' ('+fb.launches+' שיגורים)</span>':'<span class="tag-wait">'+fmt(fb.stored)+' (חסר '+fmt(fb.missingAmt)+')</span>');
  });
 }
 P.ships.forEach(function(s){h+=row(esc(s[0]),'<small>'+esc(s[1])+'</small>')});
 h+='<div style="margin-top:8px"><small><b>תוכנית רכישת Epic ('+fmt(P.avail)+' GE פנויות):</b></small></div>';
 if(P.E.buy && P.E.buy.list && P.E.buy.list.length){
  P.E.buy.list.forEach(function(x){
   h+=row('<b>'+esc(x.r.name)+'</b> <small>('+x.from+' ← '+x.to+' / '+x.r.levels+')</small>','<span class="tag-ok">'+fmt(x.sum)+' GE</span>');
  });
 }else if(P.E.rows.length){
  P.E.rows.slice(0,4).forEach(function(x){
   h+=row(esc(x.r.name)+' <small>('+x.L+'/'+x.r.levels+')</small>','<span class="tag-wait">'+fmt(x.price)+' GE</span>');
  });
 }else{
  h+='<p><small>כל מחקרי ה-Epic הושלמו!</small></p>';
 }
 h+='</div>';

 h+='<button class="copy-btn" onclick="copyDiag()">העתק נתוני חווה (ללא EID)</button>';
 $('out').innerHTML=h;
}

async function run(eid,isAuto){
 if(busy)return;
 eid=(eid||'').trim();if(!eid)return;
 busy=true;
 if(!isAuto){$('out').innerHTML='<p class="note">טוען נתונים מהשרת...</p>';$('sync').textContent=''}
 try{
  if(!isAuto)sset('eid',eid);
  $('eid').value=eid;
  $('eid-bar').style.display='none';
  var res=await Promise.all([load(eid),getRes(),fetchPeriodicals(eid,last)]);
  last=res[0];RES=res[1];
  show(last,RES);
  var t=new Date((last.approxTime||Date.now()/1000)*1000);
  $('sync').textContent='עודכן: '+t.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+(liveServerEvents?' • אירועים מסונכרנים מהשרת':'');
 }catch(e){
  if(!isAuto)$('out').innerHTML='<p class="err">'+esc(e.message)+'</p>';
 }finally{busy=false}
}

$('go').onclick=function(){run($('eid').value,false)};
$('btn-ref').onclick=function(){run($('eid').value,false)};
$('btn-eid').onclick=function(){var b=$('eid-bar');b.style.display=(b.style.display==='none')?'flex':'none';$('eid').focus()};
$('eid').onkeydown=function(e){if(e.key==='Enter')run($('eid').value,false)};
function setArtFocus(val){if($('artFocus'))$('artFocus').value=val;sset('artFocus',val);if(last&&RES)show(last,RES)}
['slots','run','shipTarget','artFocus'].forEach(function(id){$(id).onchange=function(){sset(id,$(id).value);if(last&&RES)show(last,RES)}});
['ev-prestige','ev-epic','ev-common','ev-cap','ev-drones','ev-craft'].forEach(function(id){$(id).onchange=function(){manualEventOverrides[id]=true;if(last&&RES)show(last,RES)}});

['slots','run','shipTarget','artFocus'].forEach(function(id){var v=sget(id);if(v)$(id).value=v});
applyDefaultEventsIfUnset();
var saved=sget('eid');if(saved){$('eid').value=saved;run(saved,false)}
setInterval(function(){var e=sget('eid');if(e&&!document.hidden)run(e,true)},20000);
</script></body></html>
