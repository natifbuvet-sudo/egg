*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Arial,sans-serif;line-height:1.45;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);font-size:15px}

button.hero-btn{margin-top:9px;background:var(--y);color:#12151d;padding:6px 14px;font-size:.84rem;border-radius:8px}
button.sm-btn{margin-top:6px;background:transparent;color:var(--acc);border:1px solid var(--acc);padding:3px 10px;font-size:.78rem;border-radius:6px}
button.copy-btn{background:var(--acc);color:var(--accink);width:100%;padding:8px;margin-top:8px;border-radius:8px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.nav{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}

.phase-bar{background:var(--s);border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8rem}

.hud{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:10px}
.hud-box{background:var(--s);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.hud-box small{display:block;font-size:.7rem;color:var(--mut)}
.hud-box b{font-size:.86rem;display:block;margin-top:1px}

.hero{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 15px;margin:10px 0;border-inline-start:6px solid var(--y)}

.hero h2{margin:0 0 5px;font-size:1.15rem;line-height:1.25}
.hero p{margin:0;opacity:.92;font-size:.87rem}

ol{list-style:none;margin:0 0 12px;padding:0}

.err{color:var(--bad);margin:6px 0;font-weight:600;font-size:.9rem}
.warn{background:var(--s);border:1px solid var(--y);border-radius:8px;padding:7px 10px;margin:6px 0;font-size:.8rem}

.card{background:var(--s);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:.88rem}

.card .l:first-of-type{border-top:0;padding-top:2px}
.card small{color:var(--mut)}
.card p{margin:5px 0;font-size:.85rem}

.prog-fill.ok{background:var(--ok)}
.prog-fill.bad{background:var(--bad)}

function getGussetMult(level,rarity){
 if(level==='GREATER'){
  if(rarity==='EPIC'||rarity==='LEGENDARY')return 1.25;
  if(rarity==='RARE')return 1.22;
  return 1.20;
 }
 if(level==='NORMAL'){
  if(rarity==='RARE')return 1.16;
  return 1.15;
 }
 if(level==='LESSER'){
  if(rarity==='EPIC')return 1.12;
  return 1.10;
 }
 return 1.05;
}
function getMetronomeMult(level,rarity){
 if(level==='GREATER'){
  if(rarity==='LEGENDARY')return 1.30;
  if(rarity==='EPIC')return 1.25;
  if(rarity==='RARE')return 1.22;
  return 1.20;
 }

function epicPlan(R,lv,avail,peCount,epicDisc){
 var discMult=1-(epicDisc||0);
 var ep=R.filter(function(r){return r.type==='epic'}).filter(function(r){return (lv[r.id]||0)<r.levels});
 var rows=ep.map(function(r){
  var L=lv[r.id]||0;
  var price=Math.ceil((r.prices[L]||1)*discMult);
  var left=0;
  for(var i=L;i<r.levels;i++)left+=Math.ceil(r.prices[i]*discMult);
  var roi=getEpicWeight(r.id,peCount)/Math.max(1,price);
  return {r:r,L:L,price:price,left:left,roi:roi};
 });
 rows.sort(function(a,b){return b.roi-a.roi});

 var simLv=Object.assign({},lv);
 var rem=Math.max(0,Number(avail)||0);
 var buyMap={};
 var buyList=[];
 var totalSum=0;
 var totalLevels=0;

 for(var step=0;step<250;step++){
  var best=null;
  for(var i=0;i<ep.length;i++){
   var r=ep[i],L=simLv[r.id]||0;
   if(L>=r.levels)continue;
   var p=Math.ceil((r.prices[L]||0)*discMult);
   if(!p || p>rem)continue;
   var sc=getEpicWeight(r.id,peCount)/p;
   if(!best || sc>best.sc)best={r:r,L:L,p:p,sc:sc};
  }
  if(!best)break;
  rem-=best.p;
  totalSum+=best.p;
  totalLevels++;
  simLv[best.r.id]=best.L+1;
  if(!buyMap[best.r.id]){
   buyMap[best.r.id]={r:best.r,from:best.L,to:best.L+1,n:1,sum:best.p};
   buyList.push(buyMap[best.r.id]);
  }else{
   buyMap[best.r.id].to=best.L+1;
   buyMap[best.r.id].n++;
   buyMap[best.r.id].sum+=best.p;
  }
 }

 var buy=null;
 if(rows.length){
  buy={row:rows[0],n:buyList.length?buyList[0].n:0,sum:buyList.length?buyList[0].sum:0,list:buyList,totalSum:totalSum,totalLevels:totalLevels,remGE:rem};
 }
 return {rows:rows,buy:buy};
}

function cgain(r,L,ctx,price){
 var p=r.per_level,g;
 if(r.effect_type==='multiplicative'){g=r.levels_compound==='multiplicative'?Math.log(1+p):Math.log((1+p*(L+1))/(1+p*L))}
 else{g=p/(1+p*L+(p<1?1:10))}
 var cat=r.categories;
 var w=W[cat];
 if(w===undefined)w=0.1;

 if(cat==='egg_value' && p>=1.0){
  w=2.4;
 }

 if(ctx){
  if(cat==='shipping_capacity' || cat==='fleet_size'){
   if(ctx.shipBottleneck)w=(cat==='shipping_capacity')?2.5:1.8;
   else if(ctx.shipUtilPct>=75)w=(cat==='shipping_capacity')?1.1:0.5;
   else if(ctx.shipUtilPct>=55)w=(cat==='shipping_capacity')?0.45:0.2;
   else w=0.12;
  }else if(cat==='internal_hatchery_rate'){
   var cheapIHR=(ctx.cash>0 && price < ctx.cash*0.01);
   w=(ctx.habPct<85)?(cheapIHR?1.55:0.95):0.2;
  }else if(cat==='hab_capacity'){
   if(ctx.habPct>=85){
    w=ctx.keepOneWD?0.35:1.6;
   }else{
    w=0.55;
   }
  }
 }
 return g*w;
}

function commonPlan(R,lv,virt,cash,elv,ctx,commonDisc){
 var simLv=Object.assign({},lv);
 var cm=R.filter(function(r){return r.type==='common'});
 var labDisc=(1-0.05*(elv['cheaper_research']||0))*(1-(commonDisc||0));
 if(labDisc<0.05)labDisc=0.05;
 function bought(t){var n=0;cm.forEach(function(r){if(r.tier<=t)n+=simLv[r.id]||0});return n}

 var remCash=(cash!==undefined && cash!==null)?Number(cash):0;
 var startCash=remCash;
 var buyById={};
 var buyOrder=[];
 var totalLevelsBought=0;
 var totalSpent=0;
 var nextOutOfBudget=[];

 for(var step=0;step<2500;step++){
  var best=null;
  for(var i=0;i<cm.length;i++){
   var r=cm[i],L=simLv[r.id]||0;
   if(L>=r.levels)continue;
   if(r.tier>1&&(r.tier-1>=TH.length||bought(r.tier-1)<TH[r.tier-1]))continue;
   if(ctx && ctx.keepOneWD && r.id==='wormhole_dampening' && L>=r.levels-1)continue;
   var pr=(virt?r.virtue_prices:r.prices)||r.prices;
   var p=(pr[L]||0)*labDisc;
   if(!p)continue;
   var sc=cgain(r,L,ctx,p)/p;
   if(!best||sc>best.score)best={r:r,L:L,price:p,score:sc};
  }
  if(!best)break;

  if(remCash>=best.price){
   remCash-=best.price;
   totalSpent+=best.price;
   totalLevelsBought++;
   simLv[best.r.id]=best.L+1;
   if(!buyById[best.r.id]){
    buyById[best.r.id]={r:best.r,from:(lv[best.r.id]||0),to:best.L+1,count:1,cost:best.price,canBuy:true,firstScore:best.score};
    buyOrder.push(buyById[best.r.id]);
   }else{
    buyById[best.r.id].to=best.L+1;
    buyById[best.r.id].count++;
    buyById[best.r.id].cost+=best.price;
   }
  }else{
   simLv[best.r.id]=best.L+1;
   var lastNext=nextOutOfBudget[nextOutOfBudget.length-1];
   if(lastNext && lastNext.r.id===best.r.id){
    lastNext.to=best.L+1;
    lastNext.count++;
    lastNext.cost+=best.price;
   }else{
    if(nextOutOfBudget.length>=5)break;
    nextOutOfBudget.push({r:best.r,from:best.L,to:best.L+1,count:1,cost:best.price,canBuy:false,firstScore:best.score});
   }
  }
 }

 buyOrder.sort(function(a,b){
  if(a.r.tier!==b.r.tier)return a.r.tier-b.r.tier;
  return b.firstScore-a.firstScore;
 });

 return {
  affordableList:buyOrder,
  nextList:nextOutOfBudget,
  totalLevelsBought:totalLevelsBought,
  totalSpent:totalSpent,
  remCash:remCash,
  startCash:startCash
 };
}

function calcFarmLogistics(b,sim,clv,elv,artInfo,R){
 var g=b.game||{};
 var isVirt=!!VIRT[sim.eggType];
 var isEnl=(sim.eggType==='ENLIGHTENMENT');

 var eovArr=(b.virtue && Array.isArray(b.virtue.eovEarned))?b.virtue.eovEarned:[];
 var eotCount=eovArr.reduce(function(x,y){return x+(Number(y)||0)},0);
 var bonusPerEoT=isVirt?1.10:1.01;
 var eotMult=Math.pow(bonusPerEoT,eotCount);

 var pop=(sim.habPopulation||[]).reduce(function(x,y){return x+(y||0)},0);
 var habs=sim.habs||[];
 var emptyHabSlots=0;
 var baseCap=0;
 for(var i=0;i<habs.length;i++){
  var h=habs[i];
  if(h<0 || h===19)emptyHabSlots++;
  else if(h>=0 && h<HAB_BASE.length)baseCap+=HAB_BASE[h];
 }
 if(baseCap===0)baseCap=1000;

 var habMult=1, layMult=1, shipMult=1, valMult=1, extraFleet=0, ihrAddPerHab=0;
 if(R && R.length){
  for(var k=0;k<R.length;k++){
   var r=R[k];
   var L=(r.type==='epic'?(elv[r.id]||0):(clv[r.id]||0));
   if(L<=0)continue;
   var cats=String(r.categories||'').split(',');
   var mult=(r.levels_compound==='multiplicative')?Math.pow(1+r.per_level,L):(1+r.per_level*L);
   if(cats.indexOf('hab_capacity')>=0)habMult*=mult;
   if(cats.indexOf('egg_laying_rate')>=0)layMult*=mult;
   if(cats.indexOf('shipping_capacity')>=0)shipMult*=mult;
   if(cats.indexOf('egg_value')>=0)valMult*=mult;
   if(r.type==='common' && cats.indexOf('internal_hatchery_rate')>=0)ihrAddPerHab+=r.per_level*L;
   if(cats.indexOf('fleet_size')>=0)extraFleet+=Math.round(r.per_level*L);
  }
 }

 if(artInfo && artInfo.gussetMult>1)habMult*=artInfo.gussetMult;
 var maxCap=Math.floor(baseCap*habMult);
 var habPct=maxCap>0?Math.min(100,(pop/maxCap)*100):0;

 if(artInfo && artInfo.metronomeMult>1)layMult*=artInfo.metronomeMult;
 if(artInfo && artInfo.tachyonStoneMult>1)layMult*=artInfo.tachyonStoneMult;
 var totalLayRate=pop*2*layMult;

 var vehs=sim.vehicles||[];
 var trainLens=sim.trainLength||[];
 var baseShip=0;
 var hlIdx=0;
 for(var j=0;j<vehs.length;j++){
  var v=vehs[j];
  if(v===11){
   var cars=trainLens[hlIdx]||5;
   hlIdx++;
   baseShip+=VEH_BASE[11]*cars;
  }else if(v>=0 && v<VEH_BASE.length){
   baseShip+=VEH_BASE[v];
  }
 }
 var maxVehSlots=Math.min(17, 4 + extraFleet);
 var unusedVehSlots=Math.max(0,maxVehSlots - vehs.filter(function(x){return x>=0}).length);

 if(artInfo && artInfo.compassMult>1)shipMult*=artInfo.compassMult;
 if(artInfo && artInfo.quantumStoneMult>1)shipMult*=artInfo.quantumStoneMult;
 var totalShipCap=baseShip*shipMult;

 var rawPct=totalShipCap>0?(totalLayRate/totalShipCap)*100:0;
 var shipUtilPct=Math.min(100,rawPct);
 var shipBottleneck=(pop>1000 && totalShipCap>0 && rawPct>=90);

 var curSE=Number(g.soulEggsD||g.soulEggs||0);
 var peCount=Number(g.eggsOfProphecy||0);
 var bonusPerSE=10 + (elv['soul_eggs']||0) + (artInfo?artInfo.soulStonePts:0);
 var bonusPerPE=1 + (5 + (elv['prophecy_bonus']||0) + (artInfo?artInfo.bookBonus:0) + (artInfo?artInfo.prophStonePts:0))/100;
 var artEarnMult=(artInfo?artInfo.artifactEarningsMult:1);
 var ebPercent=curSE * bonusPerSE * Math.pow(bonusPerPE,peCount) * eotMult * artEarnMult;
 var ebIncomeMult=1 + ebPercent/100;

 var baseEggVal=EGG_BASE_VAL[sim.eggType]||0.25;
 var effectiveShippedPerMin=Math.min(totalLayRate,totalShipCap);

 var baseMaxRCB=calcBaseMaxRCB(clv,elv,R);
 var maxRCB=Math.max(3,baseMaxRCB + (artInfo?artInfo.vialAdd:0) + (artInfo?artInfo.terraAdd:0));
 var lunarMult=2 * (artInfo?artInfo.lunarTotemMult:1) * (artInfo?artInfo.lunarStoneMult:1);

 var baseIncomePerMin=effectiveShippedPerMin * baseEggVal * valMult * ebIncomeMult;
 var idleIncomePerMin=baseIncomePerMin * lunarMult;
 var activeIncomePerMin=baseIncomePerMin * maxRCB;
 var lunarBeatsActive=(lunarMult > maxRCB && !isEnl);

 var activeHabs=Math.max(1,4-emptyHabSlots);
 var ihrOnlinePerMin=ihrAddPerHab * activeHabs * (1 + 0.05*(elv['epic_internal_incubators']||0)) * (artInfo?artInfo.chaliceMult:1) * (artInfo?artInfo.lifeStoneMult:1) * eotMult;
 var ihrOfflinePerMin=ihrOnlinePerMin * (1 + 0.10*(elv['int_hatch_calm']||0));
 var remPop=Math.max(0,maxCap-pop);
 var minsToFullHabs=(remPop>0 && ihrOfflinePerMin>0)?(remPop/ihrOfflinePerMin):0;

 var silosOwned=Math.max(1,Number(sim.silosOwned)||1);
 var siloCapLv=elv['silo_capacity']||0;
 var maxSiloMins=silosOwned * (60 + 6*siloCapLv);
 var siloBottleneck=(minsToFullHabs > maxSiloMins && habPct < 97 && pop > 1000);

 return {
  pop:pop,maxCap:maxCap,habPct:habPct,nearFull:habPct>=85,isFull:habPct>=97,
  emptyHabSlots:emptyHabSlots,unusedVehSlots:unusedVehSlots,
  totalLayRate:totalLayRate,totalShipCap:totalShipCap,shipUtilPct:shipUtilPct,rawPct:rawPct,shipBottleneck:shipBottleneck,
  ebPercent:ebPercent,farmerRole:getFarmerRole(ebPercent),eotCount:eotCount,

  idleIncomePerMin:idleIncomePerMin,activeIncomePerMin:activeIncomePerMin,baseMaxRCB:baseMaxRCB,maxRCB:maxRCB,lunarMult:lunarMult,lunarBeatsActive:lunarBeatsActive,
  ihrOnlinePerMin:ihrOnlinePerMin,ihrOfflinePerMin:ihrOfflinePerMin,minsToFullHabs:minsToFullHabs,

 };
}

   });

 }

   bestOwned[sp.name]={

   };

 });

 clarityPowers.sort(function(a,b){return b-a});
 var gussetSlots=bestGusset?bestGusset.slotCap:0;
 var maxClarityEff=0;
 for(var cIdx=0;cIdx<Math.min(gussetSlots,clarityPowers.length);cIdx++)maxClarityEff+=clarityPowers[cIdx];

 dilithiumHolders.sort(function(a,b){return b.mult-a.mult});

 });
 prestigeCandidates.sort(function(a,b){return b.effMult-a.effMult});

function optimizeStones(art,logi){
 var bSE=logi.bonusPerSE||150;
 var bPE=logi.bonusPerPE||1.10;
 var pe=logi.peCount||0;
 var soulGainMult=(bSE + art.bestSoulPts)/bSE;
 var prophGainMult=Math.pow((bPE + art.bestProphPts/100)/bPE, pe);
 var useProphecy=(prophGainMult >= soulGainMult);
 var prestigeStoneAdvice=useProphecy
  ?('שבץ Prophecy Stones (+'+((prophGainMult-1)*100).toFixed(2)+'% לאבן מול +'+((soulGainMult-1)*100).toFixed(2)+'% ב-Soul Stone עם '+pe+' PE)')
  :('שבץ Soul Stones (+'+((soulGainMult-1)*100).toFixed(2)+'% לאבן מול +'+((prophGainMult-1)*100).toFixed(2)+'% ב-Prophecy Stone עם '+pe+' PE)');

 var slots=art.totalContractSlots||0;
 var contractStoneAdvice='';
 if(slots<=0){
  contractStoneAdvice='אין סלוטים פנויים בסט החוזים הנוכחי (נדרשים ארטיפקטים Rare/Epic/Legendary).';
 }else{
  var rawLay=(logi.totalLayRate / (Math.max(1,art.metronomeMult)*Math.max(1,art.tachyonStoneMult))) * (art.contractMetronomeMult||1);
  var rawShip=(logi.totalShipCap / (Math.max(1,art.compassMult)*Math.max(1,art.quantumStoneMult))) * (art.contractCompassMult||1);
  if(rawLay<=0 || rawShip<=0){
   contractStoneAdvice='שבץ '+slots+' אבני Tachyon (להאצת הטלה) ואז אזן עם Quantum כשהמשלוחים מתקרבים ל-90%.';
  }else{
   var bestK=0, bestThroughput=-1;
   for(var k=0;k<=slots;k++){
    var q=slots-k;
    var lay=rawLay * Math.pow(art.bestTachyonMult,k);
    var ship=rawShip * Math.pow(art.bestQuantumMult,q);
    var thr=Math.min(lay,ship);
    if(thr>bestThroughput){bestThroughput=thr;bestK=k;}
   }
   var bestQ=slots-bestK;
   contractStoneAdvice='חלוקה אופטימלית ל-'+slots+' סלוטים (עם סט החוזים): '+bestK+'× Tachyon + '+bestQ+'× Quantum';
  }
 }
 return {useProphecy:useProphecy,prestigeStoneAdvice:prestigeStoneAdvice,contractStoneAdvice:contractStoneAdvice};
}

 });

 var owned=[];
 (g.boosts||[]).forEach(function(bo){

 var bestFeed=bestByCat('feed',1);

 var dilNote=(art && art.potentialDilithiumMult>1.01)

 if(macro.isEnl){

 }else if(active.length>0){

   :'החזק את כפתור התרנגולות הרצות (רמת WD 24/25 פתוחה) ובצע Prestige ב-4.2B תרנגולות!';
 }else if(eggProg && eggProg.nextEgg && !eggProg.canUpgradeEgg && eggProg.pct>=75 && !hasAffordableResearch && bestFeed && (bestFeed.count>1 || bestFeed.power>=10)){

function formatRewardItem(g){

function getContractGoals(c,b){
 var k=c.contract||{};
 var grade=c.grade || (b.contracts && b.contracts.lastGraded) || '';
 if(Array.isArray(k.gradeSpecs) && k.gradeSpecs.length){
  var matched=null;
  if(grade){
   for(var i=0;i<k.gradeSpecs.length;i++){
    if(k.gradeSpecs[i].grade===grade){matched=k.gradeSpecs[i];break}
   }
  }
  var spec=matched || k.gradeSpecs[0];
  if(spec && Array.isArray(spec.goals))return spec.goals;
 }
 if(Array.isArray(k.goalSets) && k.goalSets.length){
  var gs=k.goalSets[c.league||0] || k.goalSets[0];
  if(gs && Array.isArray(gs.goals))return gs.goals;
 }
 return Array.isArray(k.goals)?k.goals:[];
}

function analyzeContractRewards(c,b){

  items.push(formatRewardItem(g));
 });
 return {hasPE:hasPE,peCount:peCount,rewardsText:items.join(' • ')};
}

function detectBestShip(b,isVirt,events){

 var vafx=(b.virtue&&b.virtue.afx)||{};
 var bestIdx=0;
 var launchCounts={};
 function recordShip(s){
  var i=SHIP_ORDER.indexOf(s);
  if(i>bestIdx)bestIdx=i;
  if(s)launchCounts[s]=(launchCounts[s]||0)+1;
 }
 (db.missionInfos||[]).forEach(function(m){recordShip(m.ship)});
 (db.missionArchive||[]).forEach(function(m){recordShip(m.ship)});
 if(vafx.lastFueledShip){var idx1=SHIP_ORDER.indexOf(vafx.lastFueledShip);if(idx1>bestIdx)bestIdx=idx1;}
 if(db.lastFueledShip){var idx2=SHIP_ORDER.indexOf(db.lastFueledShip);if(idx2>bestIdx)bestIdx=idx2;}

 var defaultIdx=bestIdx;
 while(defaultIdx<SHIP_ORDER.length-1){
  var curS=SHIP_ORDER[defaultIdx];
  var reqS=SHIP_UNLOCK_REQ[curS]||0;
  if(reqS>0 && (launchCounts[curS]||0)>=reqS){
   defaultIdx++;
  }else{
   break;
  }
 }

 var defaultTarget=SHIP_ORDER[defaultIdx]||'CHICKEN_ONE';
 if(isVirt && defaultTarget==='ATREGGIES')defaultTarget='HENERPRISE';
 var target=(sel && sel!=='auto')?sel:defaultTarget;
 var tIdx=SHIP_ORDER.indexOf(target);
 var launched=launchCounts[target]||0;
 var req=SHIP_UNLOCK_REQ[target]||0;
 var nextShip=(tIdx>=0 && tIdx<SHIP_ORDER.length-1)?SHIP_ORDER[tIdx+1]:null;
 var preferExtended=(target==='HENERPRISE' || target==='ATREGGIES');
 var missionDur=preferExtended?'Extended':'Short';
 if(events && events.missionCapacityMultiplier>1 && !preferExtended)missionDur='Short (2x Capacity!)';
 return {target:target,launched:launched,req:req,nextShip:nextShip,preferExtended:preferExtended,missionDur:missionDur};
}
