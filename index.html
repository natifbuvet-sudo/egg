<!DOCTYPE html>
<html lang="he" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Egg Inc - הצעד הבא</title>

<style>
:root{--bg:#f3f0e6;--s:#fffdf7;--ink:#1d2330;--mut:#5d6577;--line:#d9d3c0;--acc:#2d5be3;--accink:#fff;--y:#f5b82e;--bad:#b3261e;--ok:#1b7a3d}
@media(prefers-color-scheme:dark){:root{--bg:#12151d;--s:#1b2030;--ink:#eceef5;--mut:#9aa3b8;--line:#2c3348;--acc:#7b9bff;--accink:#0f1320;--bad:#ff8a80;--ok:#6dd58c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Arial,sans-serif;line-height:1.4;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);font-size:15px}
main{max-width:540px;margin:0 auto;padding:10px 10px 32px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:6px}
h1{font-size:1.05rem;margin:0;display:flex;align-items:center;gap:6px}
.ver{font-size:.72rem;background:var(--s);border:1px solid var(--line);padding:1px 6px;border-radius:6px;color:var(--mut);font-weight:600}
.icon-btn{background:var(--s);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:.82rem;cursor:pointer}
.row{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
input,select{font:inherit;color:var(--ink);background:var(--s);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;font-size:.88rem}
button{font:inherit;background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:.88rem}
button.hero-btn{margin-top:8px;background:var(--y);color:#12151d;padding:5px 12px;font-size:.84rem;border-radius:7px}
button.sm-btn{margin-top:5px;background:transparent;color:var(--acc);border:1px solid var(--acc);padding:3px 9px;font-size:.8rem;border-radius:6px}
button.copy-btn{background:var(--acc);color:var(--accink);width:100%;padding:8px;margin-top:6px;border-radius:8px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.hud-box{background:var(--s);border:1px solid var(--line);border-radius:9px;padding:6px 8px;text-align:center}
.hud-box small{display:block;font-size:.72rem;color:var(--mut)}
.hud-box b{font-size:.9rem}
.hero{background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;margin:8px 0;border-inline-start:6px solid var(--y)}
.hero small{display:block;color:var(--y);font-weight:700;font-size:.78rem;margin-bottom:2px}
.hero h2{margin:0 0 4px;font-size:1.15rem;line-height:1.25}
.hero p{margin:0;opacity:.92;font-size:.88rem}
ol{list-style:none;margin:0 0 10px;padding:0}
li.it{background:var(--s);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;position:relative}
li.it b{display:block;font-size:.92rem}li.it span{color:var(--mut);font-size:.83rem;display:block}
.step-num{display:inline-block;background:var(--line);color:var(--ink);font-size:.72rem;font-weight:700;padding:0 5px;border-radius:4px;margin-inline-end:5px}
.err{color:var(--bad);margin:6px 0;font-weight:600;font-size:.9rem}
.warn{background:var(--s);border:1px solid var(--y);border-radius:8px;padding:6px 10px;margin:6px 0;font-size:.82rem}
.card{background:var(--s);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:.88rem}
.card h3{margin:0 0 6px;font-size:.94rem;display:flex;justify-content:space-between;align-items:center}
.card .l{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-top:1px solid var(--line)}
.card .l:first-of-type{border-top:0}
.card small{color:var(--mut)}
.card p{margin:4px 0;font-size:.85rem}
.c-box{border-top:1px solid var(--line);padding:7px 0}
.c-box:first-of-type{border-top:0;padding-top:2px}
.c-head{font-weight:700;font-size:.92rem;margin-bottom:3px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.badge{font-size:.72rem;padding:2px 6px;border-radius:5px;font-weight:600}
.b-rew{background:var(--acc);color:var(--accink)}
.b-pts{background:var(--line);color:var(--ink)}
.b-wait{background:var(--ok);color:#fff}
.note{color:var(--mut);font-size:.78rem;margin-top:8px}
details{margin-top:8px}
</style>
<script>
(function(){
 var m={name:"Egg Inc - הצעד הבא",short_name:"Egg Next",start_url:".",display:"standalone",background_color:"#12151d",theme_color:"#12151d",dir:"rtl",lang:"he"};
 var l=document.createElement('link');l.rel='manifest';
 l.href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(m));
 document.head.appendChild(l);

</head><body><main>
<header>
<h1><span>Egg Inc - הצעד הבא</span><span class="ver">גרסה 7</span></h1>
<div>
<button class="icon-btn" id="btn-ref" title="רענן עכשיו">↻</button>
<button class="icon-btn" id="btn-eid" title="החלף EID">EID</button>
</div>
</header>
<div class="row" id="eid-bar"><input id="eid" placeholder="ה-EID שלך (מתחיל ב-EI)" autocomplete="off" aria-label="EID"><button id="go">טען</button></div>
<div id="out"></div><p class="note" id="sync"></p>
<details><summary style="font-size:.86rem;cursor:pointer">הגדרות</summary>
<div class="row" style="margin-top:6px">
<label style="flex:1;font-size:.82rem">מקומות לספינות<select id="slots"><option value="auto">אוטומטי (לפי רישיון)</option><option value="1">1 (רגיל)</option><option value="3">3 (Pro Permit)</option></select></label>
<label style="flex:2;font-size:.82rem">מצב הריצה הנוכחית<select id="run"><option value="mid">באמצע הריצה</option><option value="start">התחלתי עכשיו</option><option value="ready">מוכן ל-Prestige</option></select></label>
</div>

<label style="flex:1;font-size:.82rem">ספינת יעד לשיגור<select id="shipTarget">
<option value="ATREGGIES">Atreggies Henliner (הכי מתקדמת)</option>
<option value="HENERPRISE">Henerprise</option>
<option value="VOYEGGER">Voyegger</option>
<option value="DEFIHENT">Defihent</option>
<option value="GALENGG">Galeggtica</option>
</select></label>
</div>
</details>
<p class="note">רענון אוטומטי כל 20 שניות. טיפ לסנכרון מיידי מהמשחק: פתח לרגע חוות חוזה וחזור לחווה הראשית.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/protobufjs@7.2.6/dist/protobuf.min.js"></script>
<script>
var PROTO='https://raw.githubusercontent.com/carpetsage/egg/main/protobuf/ei.proto';
var RES_URL='https://raw.githubusercontent.com/carpetsage/egg/main/lib/researches.json';
var PRI=['soul_eggs','prophecy_bonus','prestige_bonus','epic_egg_laying','epic_multiplier','afx_mission_time','afx_mission_capacity','transportation_lobbyist','accounting_tricks','int_hatch_calm','epic_internal_incubators','epic_hatchery','drone_rewards','epic_clucking'];
var W={egg_value:1,egg_laying_rate:1,'egg_laying_rate,egg_value':1,running_chicken_bonus:.8,shipping_capacity:.7,hab_capacity:.7,internal_hatchery_rate:.5,fleet_size:.2,hatchery_capacity:.1,hatchery_refill_rate:.05};
var VIRT={CURIOSITY:1,INTEGRITY:1,HUMILITY:1,RESILIENCE:1,KINDNESS:1};
var EGG_HE={EDIBLE:'Edible',SUPERFOOD:'Superfood',MEDICAL:'Medical',ROCKET_FUEL:'Rocket Fuel',SUPER_MATERIAL:'Super Material',FUSION:'Fusion',QUANTUM:'Quantum',IMMORTALITY:'Immortality',TACHYON:'Tachyon',GRAVITON:'Graviton',DILITHIUM:'Dilithium',PRODIGY:'Prodigy',TERRAFORM:'Terraform',ANTIMATTER:'Antimatter',DARK_MATTER:'Dark Matter',AI:'AI',NEBULA:'Nebula',UNIVERSE:'Universe',ENLIGHTENMENT:'Enlightenment'};
// ביצי דלק נדרשות לספינות המתקדמות (Extended)
var SHIP_FUELS={
 ATREGGIES:['TACHYON','DILITHIUM','ANTIMATTER','DARK_MATTER'],
 HENERPRISE:['DILITHIUM','ANTIMATTER','DARK_MATTER'],
 VOYEGGER:['FUSION','GRAVITON','DILITHIUM'],
 DEFIHENT:['FUSION','GRAVITON','DILITHIUM'],
 GALENGG:['FUSION','GRAVITON']
};
var SUF=['','K','M','B','T','q','Q','s','S','o','N','d','U','D'];
function fmt(n){n=Number(n)||0;var i=0;while(n>=1000&&i<SUF.length-1){n/=1000;i++}return (i?n.toFixed(2):Math.round(n))+SUF[i]}
function esc(s){return String(s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split('"').join('&quot;')}
function $(id){return document.getElementById(id)}
function sget(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sset(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var root=null,RES=null,last=null,busy=false;
async function getRoot(){if(root)return root;var t=await (await fetch(PROTO)).text();root=protobuf.parse(t,{keepCase:false}).root;return root}
async function getRes(){if(RES)return RES;RES=await (await fetch(RES_URL)).json();return RES}
async function post(b64,enc){return fetch('/proxy',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+(enc?encodeURIComponent(b64):b64)})}
async function load(eid){
 var R=await getRoot();var Req=R.lookupType('ei.EggIncFirstContactRequest');var Res=R.lookupType('ei.EggIncFirstContactResponse');
 var msg=Req.create({rinfo:{eiUserId:'',clientVersion:72,version:'1.35.7',build:'111343',platform:'IOS'},eiUserId:eid.indexOf('mk2!')===0?eid.slice(4):eid,deviceId:'wasmegg',clientVersion:72,platform:1});
 var bytes=Req.encode(msg).finish();var bin='';for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);var b64=btoa(bin);
 var r=await post(b64,false);if(!r.ok)r=await post(b64,true);
 var txt=await r.text();if(!r.ok)throw new Error('השרת של המשחק החזיר שגיאה ('+r.status+')');
 var raw=atob(txt.trim());var u=new Uint8Array(raw.length);for(var j=0;j<raw.length;j++)u[j]=raw.charCodeAt(j);
 var o=Res.toObject(Res.decode(u),{longs:Number,enums:String,defaults:false});
 if(!o.backup)throw new Error('לא נמצא חשבון עם ה-EID הזה');
 return o.backup;
}
var TH=[0,30,80,160,280,400,520,650,800,980,1185,1390,1655];
function homeFarm(b){var f=b.farms||[];for(var i=0;i<f.length;i++){if(f[i].farmType==='HOME')return f[i]}return f[0]||b.sim||{}}
function lvMap(arr){var m={};(arr||[]).forEach(function(r){m[r.id]=r.level||0});return m}
function epicPlan(R,lv,avail){
 var ep=R.filter(function(r){return r.type==='epic'}).filter(function(r){return (lv[r.id]||0)<r.levels});
 ep.sort(function(a,b){var x=PRI.indexOf(a.id),y=PRI.indexOf(b.id);if(x<0)x=999;if(y<0)y=999;if(x!==y)return x-y;return a.prices[lv[a.id]||0]-b.prices[lv[b.id]||0]});
 var rows=ep.map(function(r){var L=lv[r.id]||0;var left=0;for(var i=L;i<r.levels;i++)left+=r.prices[i];return {r:r,L:L,price:r.prices[L],left:left}});
 var buy=null;if(rows.length){var f=rows[0],n=0,sum=0,L=f.L;while(L<f.r.levels&&sum+f.r.prices[L]<=avail){sum+=f.r.prices[L];L++;n++}buy={row:f,n:n,sum:sum}}
 return {rows:rows,buy:buy};
}
function cgain(r,L){var p=r.per_level,g;if(r.effect_type==='multiplicative'){g=r.levels_compound==='multiplicative'?Math.log(1+p):Math.log((1+p*(L+1))/(1+p*L))}else{g=p/(1+p*L+(p<1?1:10))}var w=W[r.categories];return g*(w===undefined?0.1:w)}
function commonPlan(R,lv,virt){
 var rows=[],cm=R.filter(function(r){return r.type==='common'});
 function bought(t){var n=0;cm.forEach(function(r){if(r.tier<=t)n+=lv[r.id]||0});return n}
 cm.forEach(function(r){var L=lv[r.id]||0;if(L>=r.levels)return;if(r.tier>1&&(r.tier-1>=TH.length||bought(r.tier-1)<TH[r.tier-1]))return;var pr=(virt?r.virtue_prices:r.prices)||r.prices;var p=pr[L];if(!p)return;rows.push({r:r,L:L,score:cgain(r,L)/p})});
 rows.sort(function(a,b){return b.score-a.score});return rows;
}
function shipName(s){return String(s||'').split('_').map(function(w){return w.charAt(0)+w.slice(1).toLowerCase()}).join(' ')}
function cleanContractName(id){return String(id||'חוזה').split('-').map(function(w){return w.charAt(0).toUpperCase()+w.slice(1)}).join(' ')}
function hrs(sec){if(sec<=0)return '0 דקות';var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);return h>=48?Math.round(h/24)+' ימים':h+' שעות ו-'+m+' דקות'}

function contractInfo(c,b,R,now){
 var k=c.contract||{},id=c.contractIdentifier||k.identifier||'';
 var name=k.name||cleanContractName(id);
 var urgent=[];
 var achieved=c.numGoalsAchieved||0;
 var isReplay=!!c.pointsReplay;
 var ownAmt=c.coopLastUploadedContribution||0;
 var lastRewAmt=c.lastAmountWhenRewardGiven||0;
 var simEnd=c.coopSimulationEndTime||0;
 var graceEnd=c.coopGracePeriodEndTime||0;
 var sharedEnd=c.coopSharedEndTime||0;

 var waitingCoop=(simEnd>0);
 var pointsOnly=(isReplay || achieved>=3);

 var statusType='rewards';
 var badgeText='פרסים זמינים';
 var badgeClass='b-rew';

 if(waitingCoop){
  statusType='waiting';
  badgeText='ממתין לסגירת הקבוצה';
  badgeClass='b-wait';
 }else if(pointsOnly){
  statusType='points';
  badgeText=isReplay?'חוזה חוזר (נקודות)':'כל היעדים הושגו (נקודות)';
  badgeClass='b-pts';
 }

 var actionText='';
 if(!c.coopIdentifier){
  actionText='עדיין לא הצטרפת לקו-אופ. היכנס ללשונית Contracts והצטרף לקבוצה.';
  if(!pointsOnly)urgent.push([28,'הצטרף לקו-אופ בחוזה '+name,'החוזה פעיל ויש בו פרסים, אבל אינך בקו-אופ.','contracts']);
 }else if(waitingCoop){
  var graceLeft=graceEnd>now?(graceEnd-now):0;
  actionText='סיימת את חלקך ואספת את הפרסים! ממתינים שחברי הקבוצה יתחברו ויסגרו אצלם'+(graceLeft>0?' (ייסגר אוטומטית בעוד '+hrs(graceLeft)+')':'.')+'. אין צורך לעשות כלום.';
 }else if(pointsOnly){
  var timeLeft=sharedEnd>now?(sharedEnd-now):0;
  actionText='כל 3 היעדים בחוזה הושגו ('+achieved+'/3). החוזה רץ כעת לנקודות דירוג בלבד'+(timeLeft>0?' (מסתייים בעוד '+hrs(timeLeft)+')':'')+'. אם הנקודות לא חשובות לך, אין צורך להשקיע בוסטים.';
 }else{
  var timeLeft2=sharedEnd>now?(sharedEnd-now):0;
  actionText='החוזה פעיל לפרסים! הושגו '+achieved+' מתוך 3 יעדים'+(timeLeft2>0?' (נשארו '+hrs(timeLeft2)+')':'')+'. שדרג מחקר ומשלוחים בחוות החוזה ושלח/נצל טוקנים.';
  urgent.push([31,'קדם חוזה פרסים: '+name,'הושגו '+achieved+'/3 יעדים. לחץ לפירוט החוזה.','contracts']);
 }

 var cf=(b.farms||[]).filter(function(f){return f.farmType==='CONTRACT'&&f.contractId===id})[0];
 var researchHint='';
 if(cf && !waitingCoop){
  var cp=commonPlan(R,lvMap(cf.commonResearch),false);
  if(cp.length)researchHint=cp.slice(0,3).map(function(x){return x.r.name+' (רמה '+x.L+')'}).join(', ');
 }

 return {
  id:id,name:name,grade:String(c.grade||'').replace('GRADE_',''),coop:c.coopIdentifier||'',
  statusType:statusType,badgeText:badgeText,badgeClass:badgeClass,
  waitingCoop:waitingCoop,pointsOnly:pointsOnly,achieved:achieved,
  ownAmt:ownAmt,lastRewAmt:lastRewAmt,
  actionText:actionText,researchHint:researchHint,urgent:urgent
 };
}

function getSlotCount(b){
 var sel=$('slots').value;
 if(sel==='1')return 1;
 if(sel==='3')return 3;
 var g=b.game||{};
 return (g.permitLevel===1)?3:1;
}

// בדיקת התאמת ביצה ודלק לפני המלצה על שיגור ספינה
function checkShipFuel(b,sim){
 var target=$('shipTarget').value||'ATREGGIES';
 var reqFuels=SHIP_FUELS[target]||[];
 var curEgg=sim.eggType||'';
 var db=b.artifactsDb||{};
 var tank=db.tankFuels||[]; // מערך כמויות דלק במיכל אם קיים
 var onFuelEgg=(reqFuels.indexOf(curEgg)>=0);
 var reqNames=reqFuels.map(function(e){return EGG_HE[e]||e}).join(', ');
 return {target:target,reqFuels:reqFuels,reqNames:reqNames,onFuelEgg:onFuelEgg,curEggName:EGG_HE[curEgg]||curEgg,hasTankData:tank.length>0};
}

function plan(b,R){
 var now=Date.now()/1000,g=b.game||{},sim=homeFarm(b),db=b.artifactsDb||{},slots=getSlotCount(b),run=$('run').value,a=[];
 var virt=!!VIRT[sim.eggType];
 var ships=[],ready=0,busy2=0;
 (db.missionInfos||[]).forEach(function(m){var s=m.status,end=(m.startTimeDerived||0)+(m.durationSeconds||0),left=end-now,txt;
  if(s==='RETURNED'||s==='ANALYZING'){ready++;busy2++;txt='חזרה - לאסוף'}
  else if(s==='EXPLORING'){busy2++;if(left<=0){ready++;txt='חזרה - לאסוף'}else{var h=Math.floor(left/3600),mi=Math.floor((left%3600)/60);txt='חוזרת בעוד '+h+' שעות ו-'+mi+' דקות'}}
  else if(s==='FUELING'||s==='PREPARE_TO_LAUNCH'){busy2++;txt=s==='FUELING'?'בתדלוק':'מוכנה לשיגור'}else return;
  ships.push([shipName(m.ship)+' ('+String(m.durationType||'').toLowerCase()+')',txt])});
 var free=Math.max(0,slots-busy2);

 if((g.unclaimedEggsOfProphecy||0)>0||(g.uncliamedGoldenEggs||0)>0)a.push([5,'אסוף ביצים שממתינות לך','יש Prophecy או Golden Eggs שלא נאספו. פתח את המשחק ואסוף אותן.']);
 if(ready>0)a.push([18,'אסוף '+ready+' ספינות שחזרו','ספינה שחזרה תופסת מקום ומעכבת משימה חדשה. אסוף אותה כדי לפנות מקום.']);

 var fuelInfo=checkShipFuel(b,sim);
 if(free>0){
  if(fuelInfo.onFuelEgg){
   a.push([22,'תדלק ושגר '+shipName(fuelInfo.target)+' (Extended)','אתה נמצא כרגע על ביצת '+fuelInfo.curEggName+' שמתאימה לתדלוק! מלא את הספינה ושגר למשימה ארוכה.']);
  }else{
   a.push([42,'מקום פנוי לספינה ('+shipName(fuelInfo.target)+'), אך חסרה ביצת דלק','אתה כרגע על ביצת '+fuelInfo.curEggName+'. אם אין לך מספיק דלק במיכל ('+fuelInfo.reqNames+'), תוכל לשגר רק אחרי שתעשה Prestige ותעבור דרך ביצי הדלק.']);
  }
 }

 var cs=(b.contracts&&b.contracts.contracts)||[];
 var act=cs.filter(function(c){return c.accepted&&!c.cancelled&&!c.coopContributionFinalized});
 var CD=act.map(function(c){return contractInfo(c,b,R,now)});
 var activeRunning=CD.filter(function(d){return !d.waitingCoop});
 var rewardContracts=activeRunning.filter(function(d){return !d.pointsOnly});
 var pointsContracts=activeRunning.filter(function(d){return d.pointsOnly});
 var waitingContracts=CD.filter(function(d){return d.waitingCoop});

 if(activeRunning.length===0){
  a.push([30,'בדוק חוזים חדשים להצטרפות','אין לך כרגע חוזה פעיל שרץ (יש '+waitingContracts.length+' שממתינים לסגירת הקבוצה). היכנס ללשונית Contracts לבדוק אם נפתח חוזה חדש.','contracts']);
 }
 CD.forEach(function(d){d.urgent.forEach(function(u){a.push(u)})});

 if(rewardContracts.length>0){
  a.push([32,'טפל ב-'+rewardContracts.length+' חוזי פרסים פעילים','יש לך חוזים שטרם הושלמו בהם כל הפרסים. לחץ לפירוט מלא.','contracts']);
 }else if(pointsContracts.length>0){
  a.push([58,'חוזים פעילים לנקודות בלבד ('+pointsContracts.length+')','כל הפרסים בחוזים הפעילים כבר הושגו. לחץ לפירוט החוזים.','contracts']);
 }else if(waitingContracts.length>0){
  a.push([75,'חוזים ממתינים לסגירת חברי הקבוצה ('+waitingContracts.length+')','סיימת ואספת הכל. ממתינים שחברי הקבוצה יסגרו אצלם. לחץ לפירוט.','contracts']);
 }

 var avail=(g.goldenEggsEarned||0)-(g.goldenEggsSpent||0),elv=lvMap(g.epicResearch);
 var E=epicPlan(R,elv,avail);
 if(E.buy){var f=E.buy.row;if(E.buy.n>0)a.push([28,'מחקר אפיק: שדרג את '+f.r.name+' ב-'+E.buy.n+' רמות','עכשיו רמה '+f.L+' מתוך '+f.r.levels+'. עלות '+fmt(E.buy.sum)+' GE מתוך '+fmt(avail)+' פנויות.']);else a.push([66,'מחקר אפיק: חסוך ל-'+f.r.name,'הרמה הבאה עולה '+fmt(f.price)+' GE ויש לך '+fmt(avail)+' (חסרות '+fmt(f.price-avail)+').'])}

 var C=commonPlan(R,lvMap(sim.commonResearch),virt);
 if(C.length){
  a.push([26,'מחקר רגיל #1: שדרג '+C[0].r.name+' (רמה '+(C[0].L+1)+')','השדרוג הכי משתלם כרגע בחווה הראשית ('+EGG_HE[sim.eggType]+').']);
  if(C.length>1)a.push([36,'מחקר רגיל #2: שדרג '+C[1].r.name+' (רמה '+(C[1].L+1)+')','שדרוג המשך מומלץ מיד אחרי הקודם.']);
 }

 var gift=g.nextDailyGiftTime||0;if(gift>1e12)gift/=1000;if(gift>0&&gift<now)a.push([24,'אסוף את המתנה היומית','הזמן של המתנה היומית עבר — לחץ על אייקון המתנה בצד.']);
 if((sim.unclaimedBoostTokens||0)>0)a.push([34,'אסוף '+sim.unclaimedBoostTokens+' טוקני בוסט שממתינים','יש טוקנים מוכנים לאיסוף בחווה הראשית.']);
 var ownedB=(g.boosts||[]).reduce(function(x,y){return x+(y.count||0)},0);
 if(run==='mid'&&(sim.activeBoosts||[]).length===0&&ownedB>0)a.push([48,'אין בוסט פעיל בחווה הראשית (יש לך '+ownedB+' במלאי)','אם אתה באמצע ריצה, הפעלת בוסט שכבר ברשותך תאיץ את ההתקדמות.']);
 if(run==='ready')a.push([10,'בצע Prestige עכשיו','החלף לסט Soul Eggs, הפעל בוסטים מתאימים ובצע Prestige.']);
 if(run==='start')a.push([15,'תחילת ריצה: התקן סט ארטפיקטים ושדרג מחקר ראשוני','התחל מהמחקרים הזולים ושגר ספינות אם יש דלק במיכל.']);
 var v=b.virtue||{};if((v.eovEarned||[]).length)a.push([70,'המשך עבודה על ביצי Virtue','Truth Eggs שנצברו עד כה: '+(v.eovEarned||[]).reduce(function(x,y){return x+y},0)+'.']);
 a.sort(function(x,y){return x[0]-y[0]});
 if(!a.length)a.push([99,'אין פעולה דחופה','הכל מסודר. חזור לבדוק בעוד כמה דקות.']);
 return {CD:CD,a:a,avail:avail,ships:ships,E:E,C:C,virt:virt,act:act.length,activeRunning:activeRunning.length,ownedB:ownedB,slots:slots,busy:busy2,g:g,sim:sim,db:db,fuelInfo:fuelInfo};
}

function jumpTo(id){
 var el=$(id);
 if(el){
  el.open=true;
  el.scrollIntoView({behavior:'smooth',block:'start'});
 }
}

function copyDiag(){
 if(!last)return;
 var sim=homeFarm(last);
 var diag={
  eggType:sim.eggType,
  habs:sim.habs,
  habPopulation:sim.habPopulation,
  vehicles:sim.vehicles,
  silos:sim.silos,
  permitLevel:(last.game||{}).permitLevel,
  artifactsDbKeys:Object.keys(last.artifactsDb||{}),
  tankFuels:(last.artifactsDb||{}).tankFuels,
  tankLimits:(last.artifactsDb||{}).tankLimits,
  missionInfos:(last.artifactsDb||{}).missionInfos,
  virtue:last.virtue
 };
 var txt=JSON.stringify(diag,null,2);
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(txt).then(function(){alert('נתוני האבחון (ללא EID) הועתקו! הדבק אותם בצ\'אט.')});
 }else{
  prompt('העתק את הטקסט הבא:',txt);
 }
}

function row(l,r){return '<div class="l"><span>'+l+'</span><span>'+r+'</span></div>'}
function show(b,R){
 var P=plan(b,R),a=P.a,h='';
 var age=Math.round((Date.now()/1000-(b.approxTime||0))/60);
 if(age>3)h+='<div class="warn">גיבוי בן '+age+' דקות. לעדכון מיידי במשחק: פתח לרגע חוזה וחזור.</div>';

 h+='<div class="hud">';
 h+='<div class="hud-box"><small>ביצה / ספינות</small><b>'+esc(P.fuelInfo.curEggName)+' | '+P.busy+'/'+P.slots+'</b></div>';
 h+='<div class="hud-box"><small>חוזים פעילים</small><b>'+P.activeRunning+' <small style="display:inline">('+(P.act-P.activeRunning)+' בהמתנה)</small></b></div>';
 h+='<div class="hud-box"><small>GE פנויות</small><b>'+fmt(P.avail)+'</b></div>';
 h+='</div>';

 var top=a[0];
 h+='<div class="hero"><small>הצעד הבא עכשיו (עדיפות 1)</small><h2>'+esc(top[1])+'</h2><p>'+esc(top[2])+'</p>';
 if(top[3]==='contracts')h+='<button class="hero-btn" onclick="jumpTo(\'sec-contracts\')">פירוט חוזים מלא ↓</button>';
 h+='</div><ol>';

 a.slice(1,6).forEach(function(x,idx){
  h+='<li class="it"><b><span class="step-num">'+(idx+2)+'</span>'+esc(x[1])+'</b><span>'+esc(x[2])+'</span>';
  if(x[3]==='contracts')h+='<button class="sm-btn" onclick="jumpTo(\'sec-contracts\')">הצג פירוט חוזים</button>';
  h+='</li>';
 });
 h+='</ol>';

 h+='<details id="sec-contracts" class="card" '+(P.CD.length?'open':'')+'><summary style="font-weight:700;font-size:.96rem;cursor:pointer">חוזים ('+P.CD.length+')</summary>';
 if(P.CD.length){
  P.CD.forEach(function(d){
   h+='<div class="c-box"><div class="c-head"><span>'+esc(d.name)+(d.grade?' <small>(דרגה '+esc(d.grade)+')</small>':'')+'</span><span class="badge '+d.badgeClass+'">'+esc(d.badgeText)+'</span></div>';
   h+='<p><b>קו-אופ:</b> '+esc(d.coop||'ללא')+' | <b>יעדים שהושגו:</b> '+d.achieved+'/3</p>';
   if(d.ownAmt>0)h+='<p><b>התרומה שלך:</b> '+fmt(d.ownAmt)+' ביצים'+(d.lastRewAmt>0?' | <b>יעד פרס אחרון:</b> '+fmt(d.lastRewAmt):'')+'</p>';
   h+='<p><b>מצב ופעולה:</b> '+esc(d.actionText)+'</p>';
   if(d.researchHint)h+='<p><small><b>מחקר מומלץ בחווה:</b> '+esc(d.researchHint)+'</small></p>';
   h+='</div>';
  });
 }else{
  h+='<p><small>אין חוזים פתוחים בגיבוי כרגע.</small></p>';
 }
 h+='</details>';

 h+='<div class="card"><h3>מחקר רגיל מומלץ (חווה ראשית)</h3>';
 P.C.slice(0,5).forEach(function(x,i){h+=row((i+1)+'. '+esc(x.r.name)+' <small>רמה '+x.L+'/'+x.r.levels+'</small>',esc(String(x.r.categories).split('_').join(' ')))});
 h+='</div>';

 h+='<div class="card"><h3>מחקר אפיק (לפי סדר עדיפויות)</h3>';
 P.E.rows.slice(0,5).forEach(function(x){h+=row(esc(x.r.name)+' <small>רמה '+x.L+'/'+x.r.levels+'</small>',fmt(x.price)+' GE')});
 h+='</div>';

 h+='<div class="card"><h3>ספינות ('+P.busy+'/'+P.slots+')</h3>';
 if(P.ships.length)P.ships.forEach(function(s){h+=row(esc(s[0]),esc(s[1]))});else h+='<small>אין ספינות פעילות בגיבוי. דלק נדרש ל-'+esc(shipName(P.fuelInfo.target))+': '+esc(P.fuelInfo.reqNames)+'.</small>';
 h+='</div>';

 h+='<details><summary style="font-size:.84rem;cursor:pointer">נתוני חשבון ואבחון (לשדרוג המערכת)</summary><div class="card">';
 h+=row('Soul Eggs',fmt(P.g.soulEggsD||P.g.soulEggs))+row('Prophecy Eggs',fmt(P.g.eggsOfProphecy))+row('רישיון Pro Permit',(P.g.permitLevel===1?'כן':'לא'))+row('בוסטים במלאי',P.ownedB);
 h+='<button class="copy-btn" onclick="copyDiag()">העתק נתוני ספינות, דלק וחווה (ללא EID)</button>';
 h+='</div></details>';
 $('out').innerHTML=h;
}
async function run(silent){
 if(busy)return;var eid=$('eid').value.trim();if(!eid){$('out').innerHTML='<p class="err">הכנס EID</p>';return}
 sset('eid',eid);$('eid-bar').style.display='none';
 busy=true;if(!silent||!last)$('out').innerHTML='<p>טוען...</p>';
 try{var R=await getRes();last=await load(eid);show(last,R);$('sync').textContent='עודכן: '+new Date().toLocaleTimeString('he-IL')+' | גיל גיבוי: '+Math.round((Date.now()/1000-(last.approxTime||0))/60)+' דק\''}
 catch(e){$('eid-bar').style.display='flex';if(!last||!silent){$('out').innerHTML='<p class="err">'+esc(e.message||e)+'</p>'}else{$('sync').textContent='הרענון נכשל: '+(e.message||e)}}
 busy=false;
}
$('go').addEventListener('click',function(){run(false)});
$('btn-ref').addEventListener('click',function(){run(false)});
$('btn-eid').addEventListener('click',function(){var b=$('eid-bar');b.style.display=(b.style.display==='none'?'flex':'none')});
['slots','run','shipTarget'].forEach(function(id){var v=sget(id);if(v)$(id).value=v;$(id).addEventListener('change',function(){sset(id,$(id).value);if(last&&RES)show(last,RES)})});
var s=sget('eid');if(s){$('eid').value=s;run(false)}
setInterval(function(){if(!document.hidden&&$('eid').value.trim())run(true)},20000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&$('eid').value.trim())run(true)});
</script></body></html>
