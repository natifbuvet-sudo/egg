<html lang="he" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<title>Egg Inc - הצעד הבא</title>

<style>
:root{--bg:#f3f0e6;--s:#fffdf7;--ink:#1d2330;--mut:#5d6577;--line:#d9d3c0;--acc:#2d5be3;--accink:#fff;--y:#f5b82e;--bad:#b3261e;--ok:#1b7a3d}
@media(prefers-color-scheme:dark){:root{--bg:#12151d;--s:#1b2030;--ink:#eceef5;--mut:#9aa3b8;--line:#2c3348;--acc:#7b9bff;--accink:#0f1320;--bad:#ff8a80;--ok:#6dd58c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Arial,sans-serif;line-height:1.5;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:14px 12px 40px}
h1{font-size:1.2rem;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.ver{font-size:.78rem;color:var(--mut);font-weight:400}
.row{display:flex;gap:8px;margin-bottom:10px}
input,select{font:inherit;color:var(--ink);background:var(--s);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
button{font:inherit;background:var(--acc);color:var(--accink);border:0;border-radius:10px;padding:9px 14px;cursor:pointer;white-space:nowrap;font-weight:600}
button.g{background:var(--s);color:var(--ink);border:1px solid var(--line)}
button.hero-btn{margin-top:10px;background:var(--y);color:#12151d;padding:7px 14px;font-size:.9rem;border-radius:8px}
button.sm-btn{margin-top:6px;background:transparent;color:var(--acc);border:1px solid var(--acc);padding:4px 10px;font-size:.82rem;border-radius:7px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hero{background:var(--ink);color:var(--bg);border-radius:16px;padding:16px;margin:10px 0;border-inline-start:8px solid var(--y)}
.hero small{display:block;color:var(--y);font-weight:600;margin-bottom:4px}
.hero h2{margin:0 0 6px;font-size:1.35rem;line-height:1.25}
.hero p{margin:0;opacity:.9;font-size:.95rem}
ol{list-style:none;margin:0 0 14px;padding:0}
li.it{background:var(--s);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
li.it b{display:block}li.it span{color:var(--mut);font-size:.9rem;display:block}
.st{background:var(--s);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.92rem}
.err{color:var(--bad);margin:8px 0;font-weight:600}
.warn{background:var(--s);border:1px solid var(--y);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.88rem}
.card{background:var(--s);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:.92rem}
.card h3{margin:0 0 8px;font-size:1rem;display:flex;justify-content:space-between;align-items:center}
.card .l{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px solid var(--line)}
.card .l:first-of-type{border-top:0}
.card small{color:var(--mut)}
.card p{margin:5px 0;font-size:.9rem}
.c-box{border-top:1px solid var(--line);padding:8px 0}
.c-box:first-of-type{border-top:0;padding-top:2px}
.c-head{font-weight:700;font-size:.98rem;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.badge{font-size:.75rem;padding:2px 7px;border-radius:6px;font-weight:600}
.b-rew{background:var(--acc);color:var(--accink)}
.b-pts{background:var(--line);color:var(--ink)}
.b-ok{background:var(--ok);color:#fff}
.goal-row{padding:4px 8px;margin:4px 0;border-radius:6px;background:var(--bg);font-size:.86rem}
.goal-done{border-inline-start:4px solid var(--ok)}
.goal-open{border-inline-start:4px solid var(--y)}
.note{color:var(--mut);font-size:.82rem;margin-top:12px}
details{margin-top:10px}
pre{background:var(--bg);padding:8px;border-radius:8px;overflow-x:auto;font-size:.75rem;direction:ltr;text-align:left;max-height:220px}
</style>
<script>

(function(){
 var m={name:"Egg Inc - הצעד הבא",short_name:"Egg Next",start_url:".",display:"standalone",background_color:"#12151d",theme_color:"#12151d",dir:"rtl",lang:"he"};
 var l=document.createElement('link');l.rel='manifest';
 l.href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(m));
 document.head.appendChild(l);

</head><body><main>
<h1><span>Egg Inc - הצעד הבא</span><span class="ver">גרסה 5</span></h1>
<div class="row"><input id="eid" placeholder="ה-EID שלך (מתחיל ב-EI)" autocomplete="off" aria-label="EID"><button id="go">טען</button></div>
<div id="out"></div><p class="note" id="sync"></p>
<details><summary>הגדרות</summary>
<div class="row" style="margin-top:8px">
<label style="flex:1">מקומות לספינות<select id="slots"><option value="auto">אוטומטי (לפי רישיון)</option><option value="1">1 (רגיל)</option><option value="3">3 (Pro Permit)</option></select></label>
<label style="flex:2">מצב הריצה הנוכחית<select id="run"><option value="mid">באמצע הריצה</option><option value="start">התחלתי עכשיו</option><option value="ready">מוכן ל-Prestige</option></select></label>
</div>
</details>
<p class="note">ההמלצות מתבססות על הגיבוי האחרון של החשבון בענן של המשחק, ולכן יתכן עיכוב של כמה דקות. מומלץ להתקין את הדף למסך הבית (בתפריט הדפדפן: "הוסף למסך הבית") ולפתוח אותו במסך מפוצל לצד המשחק.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/protobufjs@7.2.6/dist/protobuf.min.js"></script>
<script>
var PROTO='https://raw.githubusercontent.com/carpetsage/egg/main/protobuf/ei.proto';
var RES_URL='https://raw.githubusercontent.com/carpetsage/egg/main/lib/researches.json';
var PRI=['soul_eggs','prophecy_bonus','prestige_bonus','epic_egg_laying','epic_multiplier','afx_mission_time','afx_mission_capacity','transportation_lobbyist','accounting_tricks','int_hatch_calm','epic_internal_incubators','epic_hatchery','drone_rewards','epic_clucking'];
var W={egg_value:1,egg_laying_rate:1,'egg_laying_rate,egg_value':1,running_chicken_bonus:.8,shipping_capacity:.7,hab_capacity:.7,internal_hatchery_rate:.5,fleet_size:.2,hatchery_capacity:.1,hatchery_refill_rate:.05};
var VIRT={CURIOSITY:1,INTEGRITY:1,HUMILITY:1,RESILIENCE:1,KINDNESS:1};
var SUF=['','K','M','B','T','q','Q','s','S','o','N','d','U','D'];
function fmt(n){n=Number(n)||0;var i=0;while(n>=1000&&i<SUF.length-1){n/=1000;i++}return (i?n.toFixed(2):Math.round(n))+SUF[i]}
function esc(s){return String(s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split('"').join('&quot;')}
function $(id){return document.getElementById(id)}
function sget(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sset(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var root=null,RES=null,last=null,busy=false;
async function getRoot(){if(root)return root;var t=await (await fetch(PROTO)).text();root=protobuf.parse(t,{keepCase:false}).root;return root}
async function getRes(){if(RES)return RES;RES=await (await fetch(RES_URL)).json();return RES}
async function post(b64,enc){return fetch('/proxy',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+(enc?encodeURIComponent(b64):b64)})}
async function load(eid){
 var R=await getRoot();var Req=R.lookupType('ei.EggIncFirstContactRequest');var Res=R.lookupType('ei.EggIncFirstContactResponse');
 var msg=Req.create({rinfo:{eiUserId:'',clientVersion:72,version:'1.35.7',build:'111343',platform:'IOS'},eiUserId:eid.indexOf('mk2!')===0?eid.slice(4):eid,deviceId:'wasmegg',clientVersion:72,platform:1});
 var bytes=Req.encode(msg).finish();var bin='';for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);var b64=btoa(bin);
 var r=await post(b64,false);if(!r.ok)r=await post(b64,true);
 var txt=await r.text();if(!r.ok)throw new Error('השרת של המשחק החזיר שגיאה ('+r.status+')');
 var raw=atob(txt.trim());var u=new Uint8Array(raw.length);for(var j=0;j<raw.length;j++)u[j]=raw.charCodeAt(j);
 var o=Res.toObject(Res.decode(u),{longs:Number,enums:String,defaults:false});
 if(!o.backup)throw new Error('לא נמצא חשבון עם ה-EID הזה');
 return o.backup;
}
var TH=[0,30,80,160,280,400,520,650,800,980,1185,1390,1655];
function homeFarm(b){var f=b.farms||[];for(var i=0;i<f.length;i++){if(f[i].farmType==='HOME')return f[i]}return f[0]||b.sim||{}}
function lvMap(arr){var m={};(arr||[]).forEach(function(r){m[r.id]=r.level||0});return m}
function epicPlan(R,lv,avail){
 var ep=R.filter(function(r){return r.type==='epic'}).filter(function(r){return (lv[r.id]||0)<r.levels});
 ep.sort(function(a,b){var x=PRI.indexOf(a.id),y=PRI.indexOf(b.id);if(x<0)x=999;if(y<0)y=999;if(x!==y)return x-y;return a.prices[lv[a.id]||0]-b.prices[lv[b.id]||0]});
 var rows=ep.map(function(r){var L=lv[r.id]||0;var left=0;for(var i=L;i<r.levels;i++)left+=r.prices[i];return {r:r,L:L,price:r.prices[L],left:left}});
 var buy=null;if(rows.length){var f=rows[0],n=0,sum=0,L=f.L;while(L<f.r.levels&&sum+f.r.prices[L]<=avail){sum+=f.r.prices[L];L++;n++}buy={row:f,n:n,sum:sum}}
 return {rows:rows,buy:buy};
}
function cgain(r,L){var p=r.per_level,g;if(r.effect_type==='multiplicative'){g=r.levels_compound==='multiplicative'?Math.log(1+p):Math.log((1+p*(L+1))/(1+p*L))}else{g=p/(1+p*L+(p<1?1:10))}var w=W[r.categories];return g*(w===undefined?0.1:w)}
function commonPlan(R,lv,virt){
 var rows=[],cm=R.filter(function(r){return r.type==='common'});
 function bought(t){var n=0;cm.forEach(function(r){if(r.tier<=t)n+=lv[r.id]||0});return n}
 cm.forEach(function(r){var L=lv[r.id]||0;if(L>=r.levels)return;if(r.tier>1&&(r.tier-1>=TH.length||bought(r.tier-1)<TH[r.tier-1]))return;var pr=(virt?r.virtue_prices:r.prices)||r.prices;var p=pr[L];if(!p)return;rows.push({r:r,L:L,score:cgain(r,L)/p})});
 rows.sort(function(a,b){return b.score-a.score});return rows;
}
function shipName(s){return String(s||'').split('_').map(function(w){return w.charAt(0)+w.slice(1).toLowerCase()}).join(' ')}
var RW={CASH:'מזומן',GOLD:'Golden Eggs',SOUL_EGGS:'Soul Eggs',EGGS_OF_PROPHECY:'Prophecy Eggs',EPIC_RESEARCH_ITEM:'Epic Research',PIGGY_FILL:'מילוי Piggy (תשלום)',BOOST:'בוסט',BOOST_TOKEN:'טוקנים',ARTIFACT:'ארטיפקט',ARTIFACT_CASE:'ארגז ארטיפקטים',CHICKEN:'תרנגולות',SHELL_SCRIPT:'Shell',VIRTUE_GEM:'Virtue Gem'};
function hrs(sec){if(sec<=0)return '0 דקות';var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);return h>=48?Math.round(h/24)+' ימים':h+' שעות ו-'+m+' דקות'}
function goalsOf(c){var k=c.contract||{},gs=null;(k.gradeSpecs||[]).forEach(function(g){if(g.grade===c.grade)gs=g.goals});return gs||(k.goalSets&&k.goalSets[0]&&k.goalSets[0].goals)||k.goals||[]}

function contractInfo(c,b,R,now){
 var k=c.contract||{},id=c.contractIdentifier||k.identifier||'',name=k.name||id||'חוזה',lines=[],urgent=[];
 var cs=((b.contracts&&b.contracts.currentCoopStatuses)||[]).filter(function(x){return x.coopIdentifier&&x.coopIdentifier===c.coopIdentifier&&(!x.contractIdentifier||x.contractIdentifier===id)})[0];
 var goals=goalsOf(c);
 var achieved=c.numGoalsAchieved||0;
 var isReplay=!!c.pointsReplay;
 var allGoalsAlreadyClaimed=(goals.length>0 && achieved>=goals.length);
 var pointsOnly=isReplay || allGoalsAlreadyClaimed;

 var statusType='rewards'; // rewards | points | done
 var badgeText='פרסים זמינים';
 if(pointsOnly){
  statusType='points';
  badgeText=isReplay?'חוזה חוזר (נקודות בלבד)':'כל הפרסים הושגו (נקודות בלבד)';
 }

 var total=cs?(cs.totalAmount||0):0;
 var cons=cs?(cs.contributors||[]):[];
 var rate=cons.reduce(function(x,y){return x+(y.contributionRate||0)},0);
 var own=cons.filter(function(x){return c.coopUserId&&x.userId===c.coopUserId})[0];
 var ownAmt=own?(own.contributionAmount||0):0;
 var ownRate=own?(own.contributionRate||0):0;

 // חישוב יעדים
 var goalItems=goals.map(function(g,i){
  var target=g.targetAmount||0;
  var rName=RW[g.rewardType]||String(g.rewardType||'').toLowerCase();
  var rStr=rName+(g.rewardAmount>1?' x'+fmt(g.rewardAmount):'')+(g.rewardSubType?' ('+g.rewardSubType+')':'');
  var reached=(cs && total>=target) || (i<achieved);
  var claimed=(i<achieved);
  return {idx:i+1,target:target,reward:rStr,reached:reached,claimed:claimed,rawType:g.rewardType};
 });

 var metCount=goalItems.filter(function(g){return g.reached}).length;
 var nextGoal=goalItems.filter(function(g){return !g.reached})[0];

 // המלצה קונקרטית לחוזה זה
 var actionText='';
 if(!c.coopIdentifier){
  actionText='הצטרף מיד לקו-אופ בלשונית Contracts כדי להתקדם ליעדים.';
  if(!pointsOnly)urgent.push([28,'הצטרף לקו-אופ בחוזה '+name,'החוזה פעיל ויש בו פרסים, אבל אינך בקו-אופ.','contracts']);
 }else if(metCount>achieved){
  actionText='יש '+(metCount-achieved)+' פרסים שהושגו ועדיין לא נאספו! היכנס לחוזה במשחק כדי לאסוף.';
  urgent.push([26,'אסוף פרסים בחוזה '+name,'הקו-אופ עבר את היעד אבל הפרס עדיין לא נאסף בחשבון שלך.','contracts']);
 }else if(!cs){
  actionText='בקו-אופ '+c.coopIdentifier+'. נתוני ההתקדמות של הקבוצה טרם הסתנכרנו בגיבוי – פתח את החוזה במשחק.';
 }else if(!nextGoal){
  actionText='כל היעדים הושגו! המתן לסיום הרשמי של הקו-אופ או בדוק אם ניתן לצאת.';
 }else{
  var need=nextGoal.target-total;
  var left=(c.coopSharedEndTime||0)>1e9?(c.coopSharedEndTime-now):0;
  if(rate>0){
   var eta=need/rate;
   if(left>0 && eta>left){
    actionText='בקצב הנוכחי ('+fmt(rate*3600)+'/שעה) הקבוצה לא תספיק ליעד הבא (חסרות '+fmt(need)+' ביצים, נשארו '+hrs(left)+'). הפעל בוסטים של ייצור/תרנגולות ושלח טוקנים לחברים.';
    if(!pointsOnly)urgent.push([29,'דחיפה נדרשת בחוזה '+name,'בקצב הנוכחי הקו-אופ לא יגיע ליעד הבא בזמן. לחץ לפירוט מה לעשות.','contracts']);
   }else{
    actionText='הקצב תקין! היעד הבא יושג בעוד כ-'+hrs(eta)+(left>0?' (נשארו '+hrs(left)+' לסיום).':'.')+' המשך לשדרג מחקר ומשלוחים בחוות החוזה.';
   }
  }else{
   actionText='חסרות '+fmt(need)+' ביצים ליעד הבא. פתח את חוות החוזה ושדרג תפוקה.';
  }
 }

 // מחקר בחוות החוזה
 var cf=(b.farms||[]).filter(function(f){return f.farmType==='CONTRACT'&&f.contractId===id})[0];
 var researchHint='';
 if(cf){
  var cp=commonPlan(R,lvMap(cf.commonResearch),false);
  if(cp.length)researchHint=cp.slice(0,3).map(function(x){return x.r.name+' (רמה '+x.L+')'}).join(', ');
 }

 return {
  id:id,name:name,grade:c.grade||'',coop:c.coopIdentifier||'',
  statusType:statusType,badgeText:badgeText,pointsOnly:pointsOnly,
  total:total,rate:rate,ownAmt:ownAmt,ownRate:ownRate,members:cons.length,
  goalItems:goalItems,actionText:actionText,researchHint:researchHint,
  boostsUsed:c.boostsUsed||0,maxBoosts:k.maxBoosts||0,urgent:urgent
 };
}

function getSlotCount(b){
 var sel=$('slots').value;
 if(sel==='1')return 1;
 if(sel==='3')return 3;
 // אוטומטי: permitLevel === 1 אומר Pro Permit (3 מקומות), אחרת 1
 var g=b.game||{};
 return (g.permitLevel===1)?3:1;
}

function plan(b,R){
 var now=Date.now()/1000,g=b.game||{},sim=homeFarm(b),db=b.artifactsDb||{},slots=getSlotCount(b),run=$('run').value,a=[];
 var virt=!!VIRT[sim.eggType];
 var ships=[],ready=0,busy2=0;
 (db.missionInfos||[]).forEach(function(m){var s=m.status,end=(m.startTimeDerived||0)+(m.durationSeconds||0),left=end-now,txt;
  if(s==='RETURNED'||s==='ANALYZING'){ready++;busy2++;txt='חזרה - לאסוף'}
  else if(s==='EXPLORING'){busy2++;if(left<=0){ready++;txt='חזרה - לאסוף'}else{var h=Math.floor(left/3600),mi=Math.floor((left%3600)/60);txt='חוזרת בעוד '+h+' שעות ו-'+mi+' דקות'}}
  else if(s==='FUELING'||s==='PREPARE_TO_LAUNCH'){busy2++;txt=s==='FUELING'?'בתדלוק':'מוכנה לשיגור'}else return;
  ships.push([shipName(m.ship)+' ('+String(m.durationType||'').toLowerCase()+')',txt])});
 var free=Math.max(0,slots-busy2);

 if((g.unclaimedEggsOfProphecy||0)>0||(g.uncliamedGoldenEggs||0)>0)a.push([5,'אסוף ביצים שממתינות לך','יש Prophecy או Golden Eggs שלא נאספו. פתח את המשחק ואסוף אותן.']);
 if(ready>0)a.push([20,'אסוף '+ready+' ספינות שחזרו','ספינה שחזרה תופסת מקום ומעכבת משימה חדשה. אסוף ושגר מחדש.']);
 var bage=Math.round((now-(b.approxTime||0))/60);
 if(free>0){
  if(bage>3)a.push([52,'ייתכן שיש '+free+' מקומות פנויים לספינות','הגיבוי של המשחק בן '+bage+' דקות (מזוהה '+slots+' מקומות סה"כ). אם שיגרת מאז, התעלם.']);
  else a.push([25,'שגר '+free+' ספינות למשימה','יש לך מקום פנוי לספינה. משימה שרצה ברקע היא התקדמות חינם.']);
 }

 var cs=(b.contracts&&b.contracts.contracts)||[];
 var act=cs.filter(function(c){return c.accepted&&!c.cancelled&&!c.coopContributionFinalized});
 var CD=act.map(function(c){return contractInfo(c,b,R,now)});
 var rewardContracts=CD.filter(function(d){return !d.pointsOnly});
 var pointsContracts=CD.filter(function(d){return d.pointsOnly});

 if(act.length===0){
  a.push([30,'הצטרף לחוזה ולקו-אופ','אין לך חוזה פעיל כרגע. חוזים הם המקור העיקרי ל-Prophecy Eggs. היכנס ללשונית Contracts.']);
 }
 CD.forEach(function(d){d.urgent.forEach(function(u){a.push(u)})});

 if(rewardContracts.length>0){
  a.push([32,'טפל ב-'+rewardContracts.length+' חוזים עם פרסים זמינים','יש לך חוזים פעילים שעדיין נותנים פרסים. לחץ לפירוט היעדים, התרומה שלך ומה לשדרג.','contracts']);
 }else if(pointsContracts.length>0){
  a.push([58,'חוזים פעילים (נקודות בלבד): '+pointsContracts.length,'כל הפרסים בחוזים הפעילים כבר הושגו בעבר (Replay). לחץ לפירוט אם חשוב לך לשפר ציון.','contracts']);
 }

 var avail=(g.goldenEggsEarned||0)-(g.goldenEggsSpent||0),elv=lvMap(g.epicResearch);
 var E=epicPlan(R,elv,avail);
 if(E.buy){var f=E.buy.row;if(E.buy.n>0)a.push([35,'מחקר אפיק: שדרג את '+f.r.name+' ב-'+E.buy.n+' רמות','עכשיו רמה '+f.L+' מתוך '+f.r.levels+'. עלות '+fmt(E.buy.sum)+' Golden Eggs מתוך '+fmt(avail)+' שצברת.']);else a.push([66,'מחקר אפיק: חסוך ל-'+f.r.name,'הרמה הבאה עולה '+fmt(f.price)+' ויש לך '+fmt(avail)+'. חסרות '+fmt(f.price-avail)+' Golden Eggs.'])}
 var C=commonPlan(R,lvMap(sim.commonResearch),virt);
 if(C.length)a.push([38,'מחקר רגיל: '+C[0].r.name+' לרמה '+(C[0].L+1),'לפי הערכת רווח ביחס לעלות זה המחקר הכי משתלם בחווה הראשית.']);
 var gift=g.nextDailyGiftTime||0;if(gift>1e12)gift/=1000;if(gift>0&&gift<now)a.push([40,'אסוף את המתנה היומית','הזמן של המתנה היומית עבר.']);
 if((sim.unclaimedBoostTokens||0)>0)a.push([45,'השתמש ב-'+sim.unclaimedBoostTokens+' טוקנים שממתינים','הטוקנים כבר שלך ולא עולים כסף. טוקנים שלא נוצלו לא תורמים כלום.']);
 var ownedB=(g.boosts||[]).reduce(function(x,y){return x+(y.count||0)},0);
 if(run==='mid'&&(sim.activeBoosts||[]).length===0&&ownedB>0)a.push([48,'אין בוסט פעיל, ויש לך '+ownedB+' בוסטים','אם אתה באמצע ריצה, הפעלת בוסט שכבר יש לך תקצר אותה.']);
 if(run==='ready')a.push([10,'בצע Prestige','סימנת שהחווה מוכנה. החלף לסט Soul Eggs, השתמש בבוסטים ובצע Prestige.']);
 if(run==='start')a.push([15,'התקן את סט הארטיפקטים והשתמש בבוסטים שכבר יש לך','תחילת ריצה היא הזמן להשתמש במה שכבר צברת. אין צורך לקנות כלום.']);
 var v=b.virtue||{};if((v.eovEarned||[]).length)a.push([70,'המשך עבודה על ביצי Virtue','Truth Eggs שנצברו עד כה: '+(v.eovEarned||[]).reduce(function(x,y){return x+y},0)+'.']);
 a.sort(function(x,y){return x[0]-y[0]});
 if(!a.length)a.push([99,'אין פעולה דחופה','הכל מסודר. חזור לבדוק בעוד כמה שעות.']);
 return {CD:CD,a:a,avail:avail,ships:ships,E:E,C:C,virt:virt,act:act.length,ownedB:ownedB,slots:slots,busy:busy2,g:g,sim:sim,rawContracts:cs};
}

function jumpTo(id){
 var el=$(id);
 if(el){
  el.open=true;
  el.scrollIntoView({behavior:'smooth',block:'start'});
 }
}

function row(l,r){return '<div class="l"><span>'+l+'</span><span>'+r+'</span></div>'}
function show(b,R){
 var P=plan(b,R),a=P.a,h='';
 var age=Math.round((Date.now()/1000-(b.approxTime||0))/60);
 if(age>3)h+='<div class="warn">נתוני המשחק בגיבוי בני '+age+' דקות. פעולות שעשית מאז לא מופיעות כאן.</div>';

 // המלצה ראשית (Hero)
 var top=a[0];
 h+='<div class="hero"><small>עכשיו</small><h2>'+esc(top[1])+'</h2><p>'+esc(top[2])+'</p>';
 if(top[3]==='contracts')h+='<button class="hero-btn" onclick="jumpTo(\'sec-contracts\')">פירוט חוזים מלא ↓</button>';
 h+='</div><ol>';

 // תור המלצות נוספות
 a.slice(1).forEach(function(x){
  h+='<li class="it"><b>'+esc(x[1])+'</b><span>'+esc(x[2])+'</span>';
  if(x[3]==='contracts')h+='<button class="sm-btn" onclick="jumpTo(\'sec-contracts\')">הצג פירוט חוזים</button>';
  h+='</li>';
 });
 h+='</ol>';

 // כרטיס חוזים מפורט
 h+='<details id="sec-contracts" class="card" '+(P.CD.length?'open':'')+'><summary style="font-weight:700;font-size:1rem;cursor:pointer">חוזים פעילים ('+P.CD.length+')</summary>';
 if(P.CD.length){
  P.CD.forEach(function(d){
   var bClass=d.pointsOnly?'b-pts':'b-rew';
   h+='<div class="c-box"><div class="c-head"><span>'+esc(d.name)+(d.grade?' <small>(דרגה '+esc(d.grade)+')</small>':'')+'</span><span class="badge '+bClass+'">'+esc(d.badgeText)+'</span></div>';
   if(d.coop){
    var pct=d.total>0?Math.round((d.ownAmt/d.total)*100):0;
    h+='<p><b>קו-אופ:</b> '+esc(d.coop)+' ('+d.members+' משתתפים) | <b>הושג יחד:</b> '+fmt(d.total)+' ביצים</p>';
    h+='<p><b>התרומה שלך:</b> '+fmt(d.ownAmt)+' ביצים ('+pct+'%) | <b>קצב אישי:</b> '+fmt(d.ownRate*3600)+'/שעה</p>';
   }else{
    h+='<p style="color:var(--bad)"><b>סטטוס:</b> עדיין לא הצטרפת לקו-אופ בחוזה זה.</p>';
   }
   if(d.goalItems.length){
    d.goalItems.forEach(function(g){
     var cls=g.reached?'goal-done':'goal-open';
     var stTxt=g.claimed?'הושג ונאסף ✓':(g.reached?'הושג - לאסוף במשחק!':'חסרות '+fmt(Math.max(0,g.target-d.total)));
     h+='<div class="goal-row '+cls+'"><b>יעד '+g.idx+':</b> '+fmt(g.target)+' — פרס: '+esc(g.reward)+' <small>('+stTxt+')</small></div>';
    });
   }
   h+='<p style="margin-top:6px"><b>מה לעשות עכשיו:</b> '+esc(d.actionText)+'</p>';
   if(d.researchHint)h+='<p><small><b>מחקר מומלץ בחוות החוזה:</b> '+esc(d.researchHint)+'</small></p>';
   if(d.maxBoosts)h+='<p><small><b>טוקני בוסט שנוצלו בחוזה:</b> '+d.boostsUsed+' מתוך '+d.maxBoosts+'</small></p>';
   h+='</div>';
  });
 }else{
  h+='<p><small>אין חוזים פעילים בגיבוי כרגע.</small></p>';
 }
 h+='</details>';

 h+='<div class="card"><h3>מחקר אפיק (לפי סדר עדיפויות)</h3>';
 P.E.rows.slice(0,6).forEach(function(x){h+=row(esc(x.r.name)+' <small>רמה '+x.L+' מתוך '+x.r.levels+'</small>',fmt(x.price)+' GE')});
 h+='<small>יש לך '+fmt(P.avail)+' Golden Eggs פנויות. המחירים מדויקים.</small></div>';

 h+='<div class="card"><h3>מחקר רגיל (הערכת רווח ביחס לעלות)</h3>';
 P.C.slice(0,6).forEach(function(x,i){h+=row((i+1)+'. '+esc(x.r.name)+' <small>רמה '+x.L+' מתוך '+x.r.levels+'</small>',esc(String(x.r.categories).split('_').join(' ')))});
 h+='<small>זו הערכה ולא סימולציה. חווה: '+(P.virt?'Virtue':'רגילה או Enlightenment')+'.</small></div>';

 h+='<div class="card"><h3>ספינות ('+P.busy+' מתוך '+P.slots+' מקומות בשימוש)</h3>';
 if(P.ships.length)P.ships.forEach(function(s){h+=row(esc(s[0]),esc(s[1]))});else h+='<small>אין ספינות פעילות בגיבוי.</small>';
 h+='</div>';

 h+='<div class="card"><h3>מצב החשבון</h3>'+row('שם',esc(b.userName||''))+row('Soul Eggs',fmt(P.g.soulEggsD||P.g.soulEggs))+row('Prophecy Eggs',fmt(P.g.eggsOfProphecy))+row('רישיון Pro Permit',(P.g.permitLevel===1?'כן (3 ספינות)':'לא (ספינה 1)'))+row('חוזים פעילים',P.act)+row('בוסטים שברשותך',P.ownedB)+row('גיל הגיבוי',age+' דקות')+'</div>';

 h+='<details><summary>מידע טכני (לבדיקת נתוני הגיבוי)</summary><div class="card">'+row('סוג ביצה',esc(P.sim.eggType||''))+row('סוג חווה',esc(P.sim.farmType||''))+row('permitLevel',P.g.permitLevel||0)+row('סך חוזים בהיסטוריה',P.rawContracts.length)+'<p><small>נתוני חוזים פעילים גולמיים מהגיבוי:</small></p><pre>'+esc(JSON.stringify(P.rawContracts.filter(function(c){return c.accepted&&!c.cancelled&&!c.coopContributionFinalized}),null,2))+'</pre></div></details>';
 $('out').innerHTML=h;
}
async function run(silent){
 if(busy)return;var eid=$('eid').value.trim();if(!eid){$('out').innerHTML='<p class="err">הכנס EID</p>';return}
 sset('eid',eid);busy=true;if(!silent||!last)$('out').innerHTML='<p>טוען...</p>';
 try{var R=await getRes();last=await load(eid);show(last,R);$('sync').textContent='הדף התרענן ב-'+new Date().toLocaleTimeString('he-IL')+'. נתוני המשחק בגיבוי בני '+Math.round((Date.now()/1000-(last.approxTime||0))/60)+' דקות.'}
 catch(e){if(!last||!silent){$('out').innerHTML='<p class="err">'+esc(e.message||e)+'</p>'}else{$('sync').textContent='הרענון נכשל: '+(e.message||e)}}
 busy=false;
}
$('go').addEventListener('click',function(){run(false)});
['slots','run'].forEach(function(id){var v=sget(id);if(v)$(id).value=v;$(id).addEventListener('change',function(){sset(id,$(id).value);if(last&&RES)show(last,RES)})});
var s=sget('eid');if(s){$('eid').value=s;run(false)}
setInterval(function(){if(!document.hidden&&$('eid').value.trim())run(true)},60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&$('eid').value.trim())run(true)});
</script></body></html>
