<title>Egg Inc - הצעד הבא</title>

<style>
:root{--bg:#f3f0e6;--s:#fffdf7;--ink:#1d2330;--mut:#5d6577;--line:#d9d3c0;--acc:#2d5be3;--accink:#fff;--y:#f5b82e;--bad:#b3261e;--ok:#1b7a3d;--purp:#6b3fa0}
@media(prefers-color-scheme:dark){:root{--bg:#12151d;--s:#1b2030;--ink:#eceef5;--mut:#9aa3b8;--line:#2c3348;--acc:#7b9bff;--accink:#0f1320;--bad:#ff8a80;--ok:#6dd58c;--purp:#c79eff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Arial,sans-serif;line-height:1.45;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);font-size:15px}
main{max-width:540px;margin:0 auto;padding:10px 12px 36px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:6px}
h1{font-size:1.05rem;margin:0;display:flex;align-items:center;gap:6px}
.ver{font-size:.72rem;background:var(--s);border:1px solid var(--line);padding:2px 7px;border-radius:6px;color:var(--mut);font-weight:600}
.icon-btn{background:var(--s);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:.82rem;cursor:pointer;font-weight:600}
.row{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
input,select{font:inherit;color:var(--ink);background:var(--s);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;font-size:.88rem}
button{font:inherit;background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:.86rem}
button.hero-btn{margin-top:9px;background:var(--y);color:#12151d;padding:6px 14px;font-size:.84rem;border-radius:8px}
button.sm-btn{margin-top:6px;background:transparent;color:var(--acc);border:1px solid var(--acc);padding:3px 10px;font-size:.78rem;border-radius:6px}
button.copy-btn{background:var(--acc);color:var(--accink);width:100%;padding:8px;margin-top:8px;border-radius:8px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.nav{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:var(--s);color:var(--ink);border:1px solid var(--line);padding:5px 10px;font-size:.78rem;border-radius:20px;flex-shrink:0}
.nav button.active{background:var(--acc);color:var(--accink);border-color:var(--acc)}

.phase-bar{background:var(--s);border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8rem}
.phase-tag{background:var(--acc);color:var(--accink);padding:2px 8px;border-radius:6px;font-weight:700;font-size:.74rem}
.event-pill{background:rgba(245,184,46,.22);color:var(--ink);border:1px solid var(--y);padding:2px 7px;border-radius:6px;font-size:.73rem;font-weight:700}

.hud{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:10px}
.hud-box{background:var(--s);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.hud-box small{display:block;font-size:.7rem;color:var(--mut)}
.hud-box b{font-size:.86rem;display:block;margin-top:1px}

.hero{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 15px;margin:10px 0;border-inline-start:6px solid var(--y)}
.hero small{display:block;color:var(--y);font-weight:700;font-size:.76rem;margin-bottom:3px;letter-spacing:.2px}
.hero h2{margin:0 0 5px;font-size:1.15rem;line-height:1.25}
.hero p{margin:0;opacity:.92;font-size:.87rem}

ol{list-style:none;margin:0 0 12px;padding:0}
li.it{background:var(--s);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:7px}
li.it b{display:block;font-size:.9rem}
li.it span{color:var(--mut);font-size:.82rem;display:block;margin-top:2px}
.step-num{display:inline-block;background:var(--line);color:var(--ink);font-size:.72rem;font-weight:700;padding:0 6px;border-radius:5px;margin-inline-end:6px}

.tag-ok{display:inline-block;background:var(--ok);color:#fff;font-size:.72rem;padding:2px 7px;border-radius:5px;font-weight:700}
.tag-wait{display:inline-block;background:var(--line);color:var(--ink);font-size:.72rem;padding:2px 7px;border-radius:5px;font-weight:600}
.tag-warn{display:inline-block;background:var(--bad);color:#fff;font-size:.72rem;padding:2px 7px;border-radius:5px;font-weight:700}
.tier-pill{display:inline-block;background:var(--line);color:var(--ink);font-size:.68rem;padding:1px 5px;border-radius:4px;margin-inline-end:5px;font-weight:700}
.stone-pill{display:inline-block;background:rgba(45,91,227,.14);color:var(--acc);font-size:.7rem;padding:1px 6px;border-radius:4px;margin-inline-start:4px;font-weight:600}
.err{color:var(--bad);margin:6px 0;font-weight:600;font-size:.9rem}
.warn{background:var(--s);border:1px solid var(--y);border-radius:8px;padding:7px 10px;margin:6px 0;font-size:.8rem}

.card{background:var(--s);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:.88rem}
.card h3{margin:0 0 8px;font-size:.95rem;display:flex;justify-content:space-between;align-items:center}
.card .l{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);align-items:center}
.card .l:first-of-type{border-top:0;padding-top:2px}
.card small{color:var(--mut)}
.card p{margin:5px 0;font-size:.85rem}

.prog-bar{background:var(--line);border-radius:6px;height:7px;overflow:hidden;margin:5px 0}
.prog-fill{background:var(--acc);height:100%;transition:width .3s}
.prog-fill.ok{background:var(--ok)}
.prog-fill.bad{background:var(--bad)}

.status-banner{border-radius:9px;padding:9px 11px;margin-bottom:8px;border:1px solid var(--line);background:var(--bg)}
.status-banner.do{border-color:var(--ok);background:rgba(27,122,61,.12)}
.status-banner.alert{border-color:var(--bad);background:rgba(179,38,30,.12)}
.status-banner.hold{border-color:var(--line)}
.status-banner b{display:block;font-size:.92rem;margin-bottom:2px}

.c-box{border-top:1px solid var(--line);padding:8px 0}
.c-box:first-of-type{border-top:0;padding-top:2px}
.c-head{font-weight:700;font-size:.92rem;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.sec-sub{font-size:.78rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;margin:8px 0 4px;padding-bottom:3px;border-bottom:1px dashed var(--line)}
.badge{font-size:.72rem;padding:2px 7px;border-radius:5px;font-weight:700}
.b-pe{background:var(--y);color:#12151d}
.b-col{background:var(--purp);color:#fff}
.b-rew{background:var(--acc);color:var(--accink)}
.b-pts{background:var(--line);color:var(--ink)}
.b-wait{background:var(--ok);color:#fff}
.note{color:var(--mut);font-size:.76rem;margin-top:10px}
details summary{list-style:none}
details summary::-webkit-details-marker{display:none}
.sum-head{font-weight:700;font-size:.95rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.chk-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:6px;font-size:.8rem}
.chk-item{display:flex;align-items:center;gap:6px;background:var(--bg);padding:5px 8px;border-radius:7px;border:1px solid var(--line);cursor:pointer}
.chk-item input{width:auto;margin:0}
</style>

async function load(eid){

 var cleanEid=eid.indexOf('mk2!')===0?eid.slice(4):eid;

 var bytes=Req.encode(msg).finish();var bin='';for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);var b64=btoa(bin);
 var r=await post(b64,false);if(!r.ok)r=await post(b64,true);
 var txt=await r.text();if(!r.ok)throw new Error('השרת של המשחק החזיר שגיאה ('+r.status+')');
 var raw=atob(txt.trim());var u=new Uint8Array(raw.length);for(var j=0;j<raw.length;j++)u[j]=raw.charCodeAt(j);
 var o=Res.toObject(Res.decode(u),{longs:Number,enums:String,defaults:false});
 if(!o.backup)throw new Error('לא נמצא חשבון עם ה-EID הזה');
 return o.backup;
}

async function fetchPeriodicals(eid,b){
 try{
  var R=await getRoot();
  var Req=R.lookupType('ei.GetPeriodicalsRequest');
  var Res=R.lookupType('ei.PeriodicalsResponse');
  var cleanEid=eid.indexOf('mk2!')===0?eid.slice(4):eid;
  var g=(b&&b.game)||{};
  var msg=Req.create({
   rinfo:{eiUserId:cleanEid,clientVersion:72,version:'1.35.7',build:'111343',platform:'IOS'},
   userId:cleanEid,
   soulEggs:Number(g.soulEggsD||g.soulEggs||0),
   mysticalEggs:Number(g.eggsOfProphecy||0),
   clientVersion:72,
   platform:1
  });
  var bytes=Req.encode(msg).finish();
  var bin='';for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  var b64=btoa(bin);
  var endpoints=['/proxy?endpoint=ei/get_periodicals','/proxy/ei/get_periodicals'];
  var resObj=null;
  for(var k=0;k<endpoints.length;k++){
   try{
    var r=await postTo(endpoints[k],b64,false);
    if(!r.ok)continue;
    var txt=(await r.text()).trim();
    if(!txt || txt.indexOf('<')===0)continue;
    var raw=atob(txt);
    var u=new Uint8Array(raw.length);for(var j=0;j<raw.length;j++)u[j]=raw.charCodeAt(j);
    var decoded=Res.toObject(Res.decode(u),{longs:Number,enums:String,defaults:false});
    if(decoded && decoded.events){resObj=decoded;break}
   }catch(inner){}
  }
  if(!resObj || !resObj.events || !Array.isArray(resObj.events.events))return null;
  var now=Date.now()/1000;
  var parsed={prestigeMultiplier:1,commonResearchDiscount:0,epicResearchDiscount:0,craftingDiscount:0,droneMultiplier:1,missionCapacityMultiplier:1,extraLabels:[]};
  resObj.events.events.forEach(function(ev){
   var st=Number(ev.startTime||0);if(st>1e12)st/=1000;

function epicPlan(R,lv,avail,peCount,epicDisc){
 var discMult=1-(epicDisc||0);
 var ep=R.filter(function(r){return r.type==='epic'}).filter(function(r){return (lv[r.id]||0)<r.levels});
 var rows=ep.map(function(r){
  var L=lv[r.id]||0;
  var price=Math.ceil((r.prices[L]||1)*discMult);
  var left=0;
  for(var i=L;i<r.levels;i++)left+=Math.ceil(r.prices[i]*discMult);
  var roi=getEpicWeight(r.id,peCount)/Math.max(1,price);
  return {r:r,L:L,price:price,left:left,roi:roi};
 });
 rows.sort(function(a,b){return b.roi-a.roi});

 var simLv=Object.assign({},lv);
 var rem=Math.max(0,Number(avail)||0);
 var buyMap={};
 var buyList=[];
 var totalSum=0;
 var totalLevels=0;

 for(var step=0;step<250;step++){
  var best=null;
  for(var i=0;i<ep.length;i++){
   var r=ep[i],L=simLv[r.id]||0;
   if(L>=r.levels)continue;
   var p=Math.ceil((r.prices[L]||0)*discMult);
   if(!p || p>rem)continue;
   var sc=getEpicWeight(r.id,peCount)/p;
   if(!best || sc>best.sc)best={r:r,L:L,p:p,sc:sc};
  }
  if(!best)break;
  rem-=best.p;
  totalSum+=best.p;
  totalLevels++;
  simLv[best.r.id]=best.L+1;
  if(!buyMap[best.r.id]){
   buyMap[best.r.id]={r:best.r,from:best.L,to:best.L+1,n:1,sum:best.p};
   buyList.push(buyMap[best.r.id]);
  }else{
   buyMap[best.r.id].to=best.L+1;
   buyMap[best.r.id].n++;
   buyMap[best.r.id].sum+=best.p;
  }
 }

 var buy=null;
 if(rows.length){
  buy={row:rows[0],n:buyList.length?buyList[0].n:0,sum:buyList.length?buyList[0].sum:0,list:buyList,totalSum:totalSum,totalLevels:totalLevels,remGE:rem};
 }
 return {rows:rows,buy:buy};
}

function cgain(r,L,ctx,price){
 var p=r.per_level,g;
 if(r.effect_type==='multiplicative'){g=r.levels_compound==='multiplicative'?Math.log(1+p):Math.log((1+p*(L+1))/(1+p*L))}
 else{g=p/(1+p*L+(p<1?1:10))}
 var cat=r.categories;
 var w=W[cat];
 if(w===undefined)w=0.1;

 if(cat==='egg_value' && p>=1.0){
  w=2.4;
 }

 if(ctx){
  if(cat==='shipping_capacity' || cat==='fleet_size'){
   if(ctx.shipBottleneck)w=(cat==='shipping_capacity')?2.5:1.8;
   else if(ctx.shipUtilPct>=75)w=(cat==='shipping_capacity')?1.1:0.5;
   else if(ctx.shipUtilPct>=55)w=(cat==='shipping_capacity')?0.45:0.2;
   else w=0.12;
  }else if(cat==='internal_hatchery_rate'){
   var cheapIHR=(ctx.cash>0 && price < ctx.cash*0.01);
   w=(ctx.habPct<85)?(cheapIHR?1.55:0.95):0.2;
  }else if(cat==='hab_capacity'){
   if(ctx.habPct>=85){
    w=ctx.keepOneWD?0.35:1.6;
   }else{
    w=0.55;
   }
  }
 }
 return g*w;
}

function commonPlan(R,lv,virt,cash,elv,ctx,commonDisc,puzzleCubeMult,colleggDiscMult){
 var simLv=Object.assign({},lv);
 var cm=R.filter(function(r){return r.type==='common'});
 var labDisc=(1-0.05*(elv['cheaper_research']||0))*(puzzleCubeMult||1)*(1-(commonDisc||0))*(colleggDiscMult||1);
 if(labDisc<0.05)labDisc=0.05;
 function bought(t){var n=0;cm.forEach(function(r){if(r.tier<=t)n+=simLv[r.id]||0});return n}

 var remCash=(cash!==undefined && cash!==null)?Number(cash):0;
 var startCash=remCash;
 var buyById={};
 var buyOrder=[];
 var totalLevelsBought=0;
 var totalSpent=0;
 var nextOutOfBudget=[];

 for(var step=0;step<2500;step++){
  var best=null;
  for(var i=0;i<cm.length;i++){
   var r=cm[i],L=simLv[r.id]||0;
   if(L>=r.levels)continue;
   if(r.tier>1&&(r.tier-1>=TH.length||bought(r.tier-1)<TH[r.tier-1]))continue;
   if(ctx && ctx.keepOneWD && r.id==='wormhole_dampening' && L>=r.levels-1)continue;
   var pr=(virt?r.virtue_prices:r.prices)||r.prices;
   var p=(pr[L]||0)*labDisc;
   if(!p)continue;
   var sc=cgain(r,L,ctx,p)/p;
   if(!best||sc>best.score)best={r:r,L:L,price:p,score:sc};
  }
  if(!best)break;

  if(remCash>=best.price){
   remCash-=best.price;
   totalSpent+=best.price;
   totalLevelsBought++;
   simLv[best.r.id]=best.L+1;
   if(!buyById[best.r.id]){
    buyById[best.r.id]={r:best.r,from:(lv[best.r.id]||0),to:best.L+1,count:1,cost:best.price,canBuy:true,firstScore:best.score};
    buyOrder.push(buyById[best.r.id]);
   }else{
    buyById[best.r.id].to=best.L+1;
    buyById[best.r.id].count++;
    buyById[best.r.id].cost+=best.price;
   }
  }else{
   simLv[best.r.id]=best.L+1;
   var lastNext=nextOutOfBudget[nextOutOfBudget.length-1];
   if(lastNext && lastNext.r.id===best.r.id){
    lastNext.to=best.L+1;
    lastNext.count++;
    lastNext.cost+=best.price;
   }else{
    if(nextOutOfBudget.length>=5)break;
    nextOutOfBudget.push({r:best.r,from:best.L,to:best.L+1,count:1,cost:best.price,canBuy:false,firstScore:best.score});
   }
  }
 }

 buyOrder.sort(function(a,b){
  if(a.r.tier!==b.r.tier)return a.r.tier-b.r.tier;
  return b.firstScore-a.firstScore;
 });

 return {
  affordableList:buyOrder,
  nextList:nextOutOfBudget,
  totalLevelsBought:totalLevelsBought,
  totalSpent:totalSpent,
  remCash:remCash,
  startCash:startCash
 };
}

function calcBaseMaxRCB(clv,elv,R){

   var cats=String(r.categories||'').split(',');

 }
 return Math.max(3,(3 + rcbAdd + ((elv&&elv['epic_multiplier'])||0)) * rcbMult);
}

function calcFarmLogistics(b,sim,clv,elv,artInfo,R,collegg){
 var g=b.game||{};
 var isVirt=!!VIRT[sim.eggType];

 var eovArr=(b.virtue && Array.isArray(b.virtue.eovEarned))?b.virtue.eovEarned:[];
 var eotCount=eovArr.reduce(function(x,y){return x+(Number(y)||0)},0);
 var bonusPerEoT=isVirt?1.10:1.01;
 var eotMult=Math.pow(bonusPerEoT,eotCount);

 var pop=(sim.habPopulation||[]).reduce(function(x,y){return x+(y||0)},0);
 var habs=sim.habs||[];
 var emptyHabSlots=0;
 var baseCap=0;
 for(var i=0;i<habs.length;i++){
  var h=habs[i];
  if(h<0 || h===19)emptyHabSlots++;
  else if(h>=0 && h<HAB_BASE.length)baseCap+=HAB_BASE[h];
 }
 if(baseCap===0)baseCap=1000;

 var habMult=cm.habCap, layMult=cm.layRate, shipMult=cm.shipCap, valMult=cm.eggVal, extraFleet=0, ihrAddPerHab=0;
 if(R && R.length){
  for(var k=0;k<R.length;k++){
   var r=R[k];
   var L=(r.type==='epic'?(elv[r.id]||0):(clv[r.id]||0));
   if(L<=0)continue;
   var cats=String(r.categories||'').split(',');
   var mult=(r.levels_compound==='multiplicative')?Math.pow(1+r.per_level,L):(1+r.per_level*L);
   if(cats.indexOf('hab_capacity')>=0)habMult*=mult;
   if(cats.indexOf('egg_laying_rate')>=0)layMult*=mult;
   if(cats.indexOf('shipping_capacity')>=0)shipMult*=mult;
   if(cats.indexOf('egg_value')>=0)valMult*=mult;
   if(r.type==='common' && cats.indexOf('internal_hatchery_rate')>=0)ihrAddPerHab+=r.per_level*L;
   if(cats.indexOf('fleet_size')>=0)extraFleet+=Math.round(r.per_level*L);

 }

 if(artInfo && artInfo.gussetMult>1)habMult*=artInfo.gussetMult;
 var maxCap=Math.floor(baseCap*habMult);
 var habPct=maxCap>0?Math.min(100,(pop/maxCap)*100):0;

 if(artInfo && artInfo.metronomeMult>1)layMult*=artInfo.metronomeMult;
 if(artInfo && artInfo.tachyonStoneMult>1)layMult*=artInfo.tachyonStoneMult;
 var layRatePerChicken=2*layMult;
 var totalLayRate=pop*layRatePerChicken;

 var vehs=sim.vehicles||[];
 var trainLens=sim.trainLength||[];
 var baseShip=0;
 var hlIdx=0;
 for(var j=0;j<vehs.length;j++){
  var v=vehs[j];
  if(v===11){
   var cars=trainLens[hlIdx]||5;
   hlIdx++;
   baseShip+=VEH_BASE[11]*cars;
  }else if(v>=0 && v<VEH_BASE.length){
   baseShip+=VEH_BASE[v];
  }
 }
 var maxVehSlots=Math.min(17, 4 + extraFleet);
 var unusedVehSlots=Math.max(0,maxVehSlots - vehs.filter(function(x){return x>=0}).length);

 if(artInfo && artInfo.compassMult>1)shipMult*=artInfo.compassMult;
 if(artInfo && artInfo.quantumStoneMult>1)shipMult*=artInfo.quantumStoneMult;
 var totalShipCap=baseShip*shipMult;

 var rawPct=totalShipCap>0?(totalLayRate/totalShipCap)*100:0;
 var shipUtilPct=Math.min(100,rawPct);
 var shipBottleneck=(pop>1000 && totalShipCap>0 && rawPct>=90);

 var curSE=Number(g.soulEggsD||g.soulEggs||0);
 var peCount=Number(g.eggsOfProphecy||0);
 var bonusPerSE=10 + (elv['soul_eggs']||0) + (artInfo?artInfo.soulStonePts:0);
 var bonusPerPE=1 + (5 + (elv['prophecy_bonus']||0) + (artInfo?artInfo.bookBonus:0) + (artInfo?artInfo.prophStonePts:0))/100;
 var artEarnMult=(artInfo?artInfo.artifactEarningsMult:1);
 var ebPercent=curSE * bonusPerSE * Math.pow(bonusPerPE,peCount) * eotMult * artEarnMult;
 var ebIncomeMult=1 + ebPercent/100;

 var baseEggVal=EGG_BASE_VAL[sim.eggType]||0.25;
 var effectiveShippedPerMin=Math.min(totalLayRate,totalShipCap);

 var layPerChickenPerSec=layRatePerChicken/60;
 var maxSupportedPop=(layPerChickenPerSec>0 && totalShipCap>0)?((totalShipCap/60)/layPerChickenPerSec):maxCap;
 var curSupportedPop=Math.min(pop,maxSupportedPop);
 var unfilledSupportedPop=Math.max(0,Math.min(maxCap,maxSupportedPop)-pop);
 var effPop=curSupportedPop + 0.2*unfilledSupportedPop;
 var effIncPerSec=effPop * layPerChickenPerSec * baseEggVal * valMult * ebIncomeMult;
 var accTricksMult=1 + 0.05*(elv['accounting_tricks']||0);
 var lensMult=(artInfo && artInfo.mercurysLensMult)?artInfo.mercurysLensMult:1;
 var estFarmValue=(effIncPerSec>0)?(60000 * Math.pow(effIncPerSec,0.75) * accTricksMult * lensMult):0;
 var farmValue=Math.max(Number(sim.farmValue||0),estFarmValue);

 var baseMaxRCB=calcBaseMaxRCB(clv,elv,R);
 var maxRCB=Math.max(3,baseMaxRCB + (artInfo?artInfo.vialAdd:0) + (artInfo?artInfo.terraAdd:0));
 var lunarMult=2 * cm.away * (artInfo?artInfo.lunarTotemMult:1) * (artInfo?artInfo.lunarStoneMult:1);

 var baseIncomePerMin=effectiveShippedPerMin * baseEggVal * valMult * ebIncomeMult;
 var idleIncomePerMin=baseIncomePerMin * lunarMult;
 var activeIncomePerMin=baseIncomePerMin * maxRCB;
 var lunarBeatsActive=(lunarMult > maxRCB && !isEnl);

 var activeHabs=Math.max(1,4-emptyHabSlots);
 var ihrOnlinePerMin=ihrAddPerHab * activeHabs * cm.ihr * (1 + 0.05*(elv['epic_internal_incubators']||0)) * (artInfo?artInfo.chaliceMult:1) * (artInfo?artInfo.lifeStoneMult:1) * eotMult;
 var ihrOfflinePerMin=ihrOnlinePerMin * (1 + 0.10*(elv['int_hatch_calm']||0));
 var remPop=Math.max(0,maxCap-pop);
 var minsToFullHabs=(remPop>0 && ihrOfflinePerMin>0)?(remPop/ihrOfflinePerMin):0;

 var silosOwned=Math.max(1,Number(sim.silosOwned)||1);
 var siloCapLv=elv['silo_capacity']||0;
 var maxSiloMins=silosOwned * (60 + 6*siloCapLv);
 var siloBottleneck=(minsToFullHabs > maxSiloMins && habPct < 97 && pop > 1000);

 return {
  pop:pop,maxCap:maxCap,habPct:habPct,nearFull:habPct>=85,isFull:habPct>=97,
  emptyHabSlots:emptyHabSlots,unusedVehSlots:unusedVehSlots,
  totalLayRate:totalLayRate,totalShipCap:totalShipCap,shipUtilPct:shipUtilPct,rawPct:rawPct,shipBottleneck:shipBottleneck,
  ebPercent:ebPercent,farmerRole:getFarmerRole(ebPercent),eotCount:eotCount,farmValue:farmValue,
  bonusPerSE:bonusPerSE,bonusPerPE:bonusPerPE,peCount:peCount,
  idleIncomePerMin:idleIncomePerMin,activeIncomePerMin:activeIncomePerMin,baseMaxRCB:baseMaxRCB,maxRCB:maxRCB,lunarMult:lunarMult,lunarBeatsActive:lunarBeatsActive,
  ihrOnlinePerMin:ihrOnlinePerMin,ihrOfflinePerMin:ihrOfflinePerMin,minsToFullHabs:minsToFullHabs,

 };
}

function analyzeMacroAndEndgame(b,sim,logi,art,clv){

 var curSE=Number(g.soulEggsD||g.soulEggs||0);

 var maxClarityEff=art.maxClarityEff;
 var enlGussetMult=bestGusset?(1 + (bestGusset.mult-1)*maxClarityEff):1;
 var preWDCap=7.56e9 * enlGussetMult;
 var reqWD=26;
 for(var wd=0;wd<=25;wd++){
  if(preWDCap * (1 + 0.02*wd) >= 1e10){reqWD=wd;break}
 }
 var enlPossible=(reqWD<=25);

 var eovArr=(b.virtue && Array.isArray(b.virtue.eovEarned))?b.virtue.eovEarned:[];
 var vIdx=VIRT_KEYS.indexOf(curEgg);
 var curEggEoT=(vIdx>=0 && eovArr[vIdx]!==undefined)?Number(eovArr[vIdx]):0;
 var nextEoTN=curEggEoT+1;
 var earlyEoT=[0,5e7,1e9,1e10,7e10,5e11,2e12,7e12,2e13,6e13,1.5e14,3.5e14,7.5e14,1.5e15,3e15,6e15,1.2e16];
 var nextEoTEggs=(nextEoTN<17)?(earlyEoT[nextEoTN]||1e17):(1e17 + 5e15*(nextEoTN-17)*(nextEoTN-8));

 var nextShiftSECost=calcVirtueShiftSECost(shifts,curSE);
 var next3ShiftsSECost=calcVirtueShiftSECost(shifts,curSE)+calcVirtueShiftSECost(shifts+1,Math.max(0,curSE-nextShiftSECost))+calcVirtueShiftSECost(shifts+2,Math.max(0,curSE-nextShiftSECost*2));
 var minRecommendedEoTGain=(shifts<15)?3:((shifts<35)?2:1);
 var virtPerEgg=VIRT_KEYS.map(function(k,idx){
  return {egg:k,name:shipName(k),eot:Number(eovArr[idx]||0),facility:VIRT_FACILITY[k]};
 });

 var skipPath='';
 if(eb>7.736e33)skipPath='Edible ← Prodigy (מינימום מחקר) ← Universe';
 else if(eb>1.8e29)skipPath='Edible ← Graviton (מינימום מחקר) ← Universe';
 else if(eb>4.738e23)skipPath='Edible ← Graviton ← Universe';
 else if(eb>2.321e21)skipPath='Edible ← Tachyon ← Dilithium ← Universe';
 else if(eb>4.545e19)skipPath='Edible ← CRISPR / Tachyon ← Dark Matter ← Universe';

 var phase='EARLY_GAME';
 var phaseTitle='שלב 1: Early Game — פתיחת ביצים וספינות';
 var phaseTip='שדרג ביצה מיד כששווי החווה עובר את הסף. פתח ספינות עד Henerprise; אל תבזבז GE על Crafting.';

 if(isEnl || isVirt){
  phase='ENDGAME_ENLIGHTENMENT_VIRTUE';
  phaseTitle=isEnl?'שלב 4: Endgame — ביצת Enlightenment (יעד 10B)':'שלב 4: Endgame — Path of Virtue ('+shipName(curEgg)+')';
  phaseTip=isEnl
   ?(enlPossible?'נדרשת רמת Wormhole Dampening '+reqWD+' מתוך 25 (עם '+bestGusset.name+' ו-Clarity).':'נדרש Gusset נדיר יותר או אבני Clarity גבוהות יותר כדי להגיע ל-10B.')
   :('מתקן פעיל בביצה זו: '+(VIRT_FACILITY[curEgg]||'')+'. עלות Shift הבא: ~'+fmt(nextShiftSECost)+' SE (בוצעו '+shifts+' החלפות) — צבור לפחות +'+minRecommendedEoTGain+' EoT לפני מעבר.');
 }else if(eb>=1e18){
  phase='LATE_GAME_MULTISTIGE';
  phaseTitle=logi.lunarBeatsActive?'שלב 3: Late Game — Multi-Lunarstige (מטה נוכחית)':'שלב 3: Late Game — Multi-Prestige (Multistige)';
  phaseTip=logi.lunarBeatsActive
   ?'סט ה-Lunar Totem שלך עוקף תרנגולות רצות! הפעל 5 בוסטים, סגור ל-65+ שניות, ובצע Prestige ב-4.2B אוכלוסייה.'
   :'תפוקת SE פוחתת (^0.21) — בצע Prestige מהיר ב-4.2B תרנגולות וקפוץ חזרה ל-Universe על הבוסט הפעיל.';
 }else if(eb>=1e13){
  phase='MID_GAME';
  phaseTitle='שלב 2: Mid Game — קידום ספינות, Epic ו-Diamond Trophies';
  phaseTip='שגר Short לפתיחת ספינות, ו-Extended ב-Henliner. השלם Diamond Trophies (10B) בסדר יורד מ-Universe ל-Edible.';
 }

 return {
  phase:phase,phaseTitle:phaseTitle,phaseTip:phaseTip,skipPath:skipPath,
  isEnl:isEnl,isVirt:isVirt,shifts:shifts,curEggEoT:curEggEoT,nextEoTN:nextEoTN,nextEoTEggs:nextEoTEggs,
  nextShiftSECost:nextShiftSECost,next3ShiftsSECost:next3ShiftsSECost,minRecommendedEoTGain:minRecommendedEoTGain,virtPerEgg:virtPerEgg,
  bestGusset:bestGusset,maxClarityEff:maxClarityEff,reqWD:reqWD,enlPossible:enlPossible
 };
}

function calcEggProgress(b,sim,logi,fuelInfo){
 var g=b.game||{};
 var curEgg=sim.eggType||'EDIBLE';
 var idx=EGG_ORDER.indexOf(curEgg);
 var nextEgg=(idx>=0 && idx<EGG_ORDER.length-1)?EGG_ORDER[idx+1]:null;
 var reqDiscoverFV=(idx>=0 && idx+1<EGG_DISCOVER_FV.length)?EGG_DISCOVER_FV[idx+1]:0;
 var reqUpgradeFV=(idx>=0 && idx+1<EGG_UPGRADE_FV.length)?EGG_UPGRADE_FV[idx+1]:0;
 var curFV=logi.farmValue;
 var pct=reqUpgradeFV>0?Math.min(100,(curFV/reqUpgradeFV)*100):100;
 var canUpgradeEgg=(nextEgg && curFV>=reqUpgradeFV && reqUpgradeFV>0);
 var maxReachedIdx=EGG_ORDER.indexOf(g.maxEggReached||'');
 var alreadyDiscovered=(maxReachedIdx>idx) || (reqDiscoverFV>0 && curFV>=reqDiscoverFV);

 var isFuelEggForShip=(fuelInfo.reqFuels.indexOf(curEgg)>=0);
 var shouldFillTankFirst=(isFuelEggForShip && !fuelInfo.hasFuelInTank && fuelInfo.tankFreeSpace>=1e9);

 return {
  curEgg:curEgg,curName:EGG_HE[curEgg]||curEgg,
  nextEgg:nextEgg,nextName:nextEgg?(EGG_HE[nextEgg]||nextEgg):null,
  curFV:curFV,reqFV:reqUpgradeFV,reqDiscoverFV:reqDiscoverFV,pct:pct,
  canUpgradeEgg:canUpgradeEgg,alreadyDiscovered:alreadyDiscovered,
  shouldFillTankFirst:shouldFillTankFirst
 };
}

function calcPrestigeInfo(b,sim,hab,C,cash,eggProg,macro,events,hasActiveBoost,elv,art){
 var g=b.game||{};
 var curSE=Number(g.soulEggsD||g.soulEggs||0);
 var rawUnclaimedSE=Number(sim.unclaimedSoulEggsD||sim.unclaimedSoulEggs||g.unclaimedSoulEggsD||g.unclaimedSoulEggs||0);

 var prestigeCash=Math.max(Number(g.prestigeCashEarned||0),Number(sim.cashEarned||0));
 var prestigeBonusMult=1 + 0.10*((elv&&elv['prestige_bonus'])||0);
 var featherMult=(art&&art.featherMult)?art.featherMult:1;
 var estUnclaimedSE=0;
 if(!macro.isEnl && !macro.isVirt && prestigeCash>1e6){
  estUnclaimedSE=Math.floor(Math.pow(prestigeCash/1e6,0.21) * prestigeBonusMult * featherMult * (events.prestigeMultiplier||1));
 }
 var unclaimedSE=(macro.isEnl || macro.isVirt)?0:Math.max(rawUnclaimedSE,estUnclaimedSE);
 var gainPct=(curSE>0 && unclaimedSE>0)?((unclaimedSE/curSE)*100):0;

 var isLate=(macro.phase==='LATE_GAME_MULTISTIGE');
 var minWallGainPct=isLate?8:((curSE<1000)?50:((curSE<1e6)?20:12));
 var autoReadyGainPct=isLate?14:((curSE<1000)?100:((curSE<1e6)?35:22));

 var isWeekend=(events.prestigeMultiplier>1);
 var hasAffordableResearch=(C.affordableList.length>0);
 var hasPrestigeBoosts=(g.boosts||[]).some(function(bo){
  var info=getBoostInfo(bo.boostId||bo.id||'');
  return (bo.count||0)>0 && (info.cat==='feed' || info.cat==='soul');
 });

 var nextRes=C.nextList[0]||null;
 var neededCash=nextRes?Math.max(0,nextRes.cost-(hasAffordableResearch?C.remCash:cash)):0;
 var bestRate=Math.max(hab.activeIncomePerMin,hab.idleIncomePerMin);
 var activeMinsToNext=(nextRes && bestRate>0)?(neededCash/bestRate):0;
 var idleMinsToNext=(nextRes && hab.idleIncomePerMin>0)?(neededCash/hab.idleIncomePerMin):0;

 var hasPop=(hab.pop>=100);
 var hitTimeWall=(hasPop && !hasAffordableResearch && nextRes && eggProg.pct<75 && (activeMinsToNext>=15 || idleMinsToNext>=90));

 var status='push';
 var title='המשך בריצה הנוכחית';
 var reason='';

 if(macro.isEnl || macro.isVirt){
  status='push';
  title=macro.isEnl?'דחיפת Enlightenment 10B (ללא Prestige)':'עבודת Path of Virtue';
  reason=macro.phaseTip;
 }else if(eggProg.canUpgradeEgg && !eggProg.shouldFillTankFirst){
  status='upgrade_egg';
  title='שדרג לביצה הבאה: '+eggProg.nextName+'!';
  reason='שווי החווה הגיע ליעד הפתיחה! שדרוג לביצת '+eggProg.nextName+' יקפיץ משמעותית את ההכנסות וה-Soul Eggs.';
 }else if(isLate && hasActiveBoost && hab.pop>=4.2e9){
  status='ready';
  title='בצע Prestige עכשיו (רגל Multistige ב-'+fmt(hab.pop)+' תרנגולות)';
  reason=hab.lunarBeatsActive
   ?'האוכלוסייה עברה 4.2B על הבוסט הפעיל! בצע Prestige מיד, קפוץ ל-Universe וסגור את המשחק ל-65+ שניות לסבב הבא.'
   :'האוכלוסייה עברה 4.2B על הבוסט הפעיל! בצע Prestige מיד וקפוץ חזרה ל-Universe כדי למקסם רגליים על הבוסט הפעיל.';
 }else if(hab.isFull && !hasAffordableResearch){
  if(isWeekend && gainPct<autoReadyGainPct && hasPrestigeBoosts){
   status='boost_then_prestige';
   title='אירוע '+events.prestigeMultiplier+'x Prestige: הפעל בוסט לפני Prestige';
   reason=hab.lunarBeatsActive
    ?'הלולים מלאים ופעיל '+events.prestigeMultiplier+'x Prestige! הפעל סט Lunarstige וסגור את המשחק ל-65+ שניות לפני Prestige.'
    :'הלולים מלאים ופעיל '+events.prestigeMultiplier+'x Prestige! הפעל Bird Feed + Soul Beacon ל-10 דק\' עם תרנגולות רצות לפני Prestige.';
  }else{
   status='ready';
   title='בצע Prestige עכשיו (+'+fmt(unclaimedSE)+' SE)';
   reason='הלולים מלאים ('+hab.habPct.toFixed(0)+'%) ואין מחקרים זולים. תקבל +'+gainPct.toFixed(0)+'% תוספת ל-Soul Eggs (בלי לבזבז בוסטים).';
  }
 }else if(hitTimeWall && (gainPct>=minWallGainPct || (curSE<5000 && unclaimedSE>=50))){
  status='ready';
  title='הגעת לקיר — בצע Prestige עכשיו (+'+fmt(unclaimedSE)+' SE)';
  reason='השדרוג הבא ('+nextRes.r.name+') דורש ~'+fmtWait(activeMinsToNext)+', וכבר צברת +'+gainPct.toFixed(0)+'% SE.'+(isWeekend?' (אירוע '+events.prestigeMultiplier+'x Prestige פעיל!)':'');
 }else if(hitTimeWall && isWeekend && gainPct>=5 && hasPrestigeBoosts){
  status='boost_then_prestige';
  title='אירוע '+events.prestigeMultiplier+'x Prestige: דחיפה קצרה ואז Prestige';
  reason='הגעת לקיר עם +'+gainPct.toFixed(1)+'% SE. בגלל אירוע ה-Prestige משתלם להריץ סבב בוסטים קצר ולבצע Prestige.';
 }else if(gainPct>=autoReadyGainPct && !hasAffordableResearch){
  status='ready';
  title='בצע Prestige עכשיו (+'+gainPct.toFixed(0)+'% Soul Eggs)';
  reason='צברת '+fmt(unclaimedSE)+' Soul Eggs חדשים ואין מחקרים זולים. בגלל התפוקה הפוחתת (^0.21), איפוס הריצה משתלם יותר.';
 }else{
  var waitHint=(!hasAffordableResearch && nextRes && isFinite(activeMinsToNext))?(' • השדרוג הבא בעוד ~'+fmtWait(activeMinsToNext)+'.'):'';
  reason=(unclaimedSE>0?('נצבר בריצה: +'+fmt(unclaimedSE)+' SE'+(gainPct>0?' (+'+gainPct.toFixed(1)+'%)':'')):'המשך לשדרג מחקרים ולמלא לולים כדי לצבור Soul Eggs')+waitHint;
 }
 return {
  curSE:curSE,unclaimedSE:unclaimedSE,prestigeCash:prestigeCash,gainPct:gainPct,
  status:status,title:title,reason:reason,isWeekend:isWeekend,
  hitTimeWall:hitTimeWall,activeMinsToNext:activeMinsToNext,idleMinsToNext:idleMinsToNext,nextRes:nextRes
 };
}

function analyzeArtifacts(b,slots,curEgg,peCount,elv,clv,R){
 var isVirt=!!VIRT[curEgg];
 var db=isVirt?((b.virtue&&b.virtue.afx)||{}):(b.artifactsDb||{});
 var inv=db.inventoryItems||[];
 var byId={};
 inv.forEach(function(it){byId[it.itemId]=it});

 var isEnlightenment=(curEgg==='ENLIGHTENMENT');
 var sets=db.activeArtifactSets||[];
 var homeSet=(sets[0]&&sets[0].slots)||[];
 var maxArtSlots=(slots===3)?4:2;

 var baseMaxRCB=calcBaseMaxRCB(clv||{},elv||{},R||[]);
 var basePE=1 + (5 + ((elv&&elv['prophecy_bonus'])||0))/100;
 var baseSE=10 + ((elv&&elv['soul_eggs'])||0);

 function normLevel(l){return l||'INFERIOR'}
 function normRarity(r){return r||'COMMON'}

 function formatArtLabel(sp){
  var info=ART_INFO[sp.name]||{name:shipName(sp.name),role:'other',desc:''};
  var lvl=normLevel(sp.level);
  var rar=normRarity(sp.rarity);
  var tLabel=TIER_MAP[lvl]||lvl;
  var rLabel=RARITY_MAP[rar]||'';
  return info.name+' ('+tLabel+rLabel+')';
 }

 function formatStoneList(stones){
  return (stones||[]).filter(function(st){return st&&st.name}).map(function(st){
   var sInfo=STONE_INFO[st.name]||{name:shipName(st.name)};
   var sTier=STONE_TIER_MAP[normLevel(st.level)]||'';
   return sInfo.name+(sTier?' '+sTier:'');
  });
 }

 function evalItemPrestigeSE(sp,stones,lunarMode){
  var lvl=normLevel(sp.level);
  var rar=normRarity(sp.rarity);
  var stList=(stones||[]).filter(function(st){return st&&st.name});
  var dCount=stList.filter(function(st){return st.name==='DILITHIUM_STONE'}).length;

  var earnMult=1, featherMult=1, vialAdd=0, terraAdd=0, lunarMult=1, bookAdd=0, prophPts=0, soulPts=0;
  if(sp.name==='PHOENIX_FEATHER')featherMult=getFeatherMult(lvl,rar);
  else if(sp.name==='DEMETERS_NECKLACE')earnMult=getNecklaceMult(lvl,rar);
  else if(sp.name==='TUNGSTEN_ANKH')earnMult=getAnkhMult(lvl,rar);
  else if(sp.name==='BOOK_OF_BASAN')bookAdd=getBookBonus(lvl,rar);
  else if(sp.name==='VIAL_MARTIAN_DUST')vialAdd=getVialAdd(lvl,rar);
  else if(sp.name==='LUNAR_TOTEM')lunarMult=getTotemMult(lvl,rar);
  else if(sp.name==='LIGHT_OF_EGGENDIL' && isEnlightenment)earnMult=getEnlightenmentMult(lvl,rar);

  stList.forEach(function(st){
   var sl=normLevel(st.level);
   if(st.name==='PROPHECY_STONE')prophPts+=(PROPHECY_STONE_PTS[sl]||0);
   else if(st.name==='SOUL_STONE')soulPts+=(SOUL_STONE_PTS[sl]||0);
   else if(st.name==='SHELL_STONE')earnMult*=(SHELL_STONE_MULT[sl]||1);
   else if(st.name==='TERRA_STONE')terraAdd+=(TERRA_STONE_ADD[sl]||0);
   else if(st.name==='LUNAR_STONE')lunarMult*=(LUNAR_STONE_MULT[sl]||1);
  });

  var seStatMult=(baseSE + soulPts)/baseSE;
  var peStatMult=Math.pow((basePE + (bookAdd + prophPts)/100)/basePE, peCount||0);
  var rcbMult=lunarMode?1:((baseMaxRCB + vialAdd + terraAdd)/Math.max(3,baseMaxRCB));
  var awayMult=lunarMode?lunarMult:1;
  var totalEarnMult=earnMult * seStatMult * peStatMult * rcbMult * awayMult;
  return {
   seGainMult:featherMult * Math.pow(Math.max(1,totalEarnMult),0.21),
   dCount:dCount,
   isPureDilithium:(dCount>0 && dCount===stList.length)
  };
 }

 var equipped=[];
 var gussetMult=1, metronomeMult=1, compassMult=1, chaliceMult=1, featherMult=1;
 var tachyonStoneMult=1, quantumStoneMult=1, dilithiumMult=1, lifeStoneMult=1;
 var lunarTotemMult=1, lunarStoneMult=1;
 var artifactEarningsMult=1, puzzleCubeMult=1, mercurysLensMult=1;
 var bookBonus=0, soulStonePts=0, prophStonePts=0, vialAdd=0, terraAdd=0;
 var enlightenmentWarnings=[];
 var equippedActiveSEMult=1, equippedLunarSEMult=1;

 for(var i=0;i<maxArtSlots;i++){
  var sl=homeSet[i];
  if(sl && sl.occupied && byId[sl.itemId]){
   var it=byId[sl.itemId];
   var comp=it.artifact||{};
   var sp=comp.spec||{};
   var lvl=normLevel(sp.level);
   var rar=normRarity(sp.rarity);
   var stones=comp.stones||[];
   var info=ART_INFO[sp.name]||{name:shipName(sp.name),role:'other',desc:''};

   var clarityPower=0;
   var stoneLabels=formatStoneList(stones);
   stones.forEach(function(st){
    if(!st || !st.name)return;
    if(st.name==='CLARITY_STONE')clarityPower+=(CLARITY_STONE_VAL[normLevel(st.level)]||0);
   });

   var effMult=1;
   if(isEnlightenment && sp.name!=='LIGHT_OF_EGGENDIL'){
    effMult=clarityPower;
    if(clarityPower<=0)enlightenmentWarnings.push(formatArtLabel(sp));
   }

   if(effMult>0){
    stones.forEach(function(st){
     if(!st || !st.name)return;
     var slvl=normLevel(st.level);
     if(st.name==='TACHYON_STONE')tachyonStoneMult*=1+((TACHYON_STONE_MULT[slvl]||1)-1)*effMult;
     if(st.name==='QUANTUM_STONE')quantumStoneMult*=1+((QUANTUM_STONE_MULT[slvl]||1)-1)*effMult;
     if(st.name==='DILITHIUM_STONE')dilithiumMult*=(DILITHIUM_STONE_MULT[slvl]||1);
     if(st.name==='LIFE_STONE')lifeStoneMult*=1+((LIFE_STONE_MULT[slvl]||1)-1)*effMult;
     if(st.name==='LUNAR_STONE')lunarStoneMult*=1+((LUNAR_STONE_MULT[slvl]||1)-1)*effMult;
     if(st.name==='SHELL_STONE')artifactEarningsMult*=1+((SHELL_STONE_MULT[slvl]||1)-1)*effMult;
     if(st.name==='SOUL_STONE')soulStonePts+=(SOUL_STONE_PTS[slvl]||0)*effMult;
     if(st.name==='PROPHECY_STONE')prophStonePts+=(PROPHECY_STONE_PTS[slvl]||0)*effMult;
     if(st.name==='TERRA_STONE')terraAdd+=(TERRA_STONE_ADD[slvl]||0)*effMult;
    });

    if(sp.name==='ORNATE_GUSSET')gussetMult=Math.max(gussetMult,1+(getGussetMult(lvl,rar)-1)*effMult);
    if(sp.name==='QUANTUM_METRONOME')metronomeMult=Math.max(metronomeMult,1+(getMetronomeMult(lvl,rar)-1)*effMult);
    if(sp.name==='INTERSTELLAR_COMPASS')compassMult=Math.max(compassMult,1+(getCompassMult(lvl,rar)-1)*effMult);
    if(sp.name==='THE_CHALICE')chaliceMult=Math.max(chaliceMult,1+(getChaliceMult(lvl,rar)-1)*effMult);
    if(sp.name==='PHOENIX_FEATHER')featherMult=Math.max(featherMult,1+(getFeatherMult(lvl,rar)-1)*effMult);
    if(sp.name==='DEMETERS_NECKLACE')artifactEarningsMult*=1+(getNecklaceMult(lvl,rar)-1)*effMult;
    if(sp.name==='TUNGSTEN_ANKH')artifactEarningsMult*=1+(getAnkhMult(lvl,rar)-1)*effMult;
    if(sp.name==='LIGHT_OF_EGGENDIL' && isEnlightenment)artifactEarningsMult*=getEnlightenmentMult(lvl,rar);
    if(sp.name==='LUNAR_TOTEM')lunarTotemMult=Math.max(lunarTotemMult,1+(getTotemMult(lvl,rar)-1)*effMult);
    if(sp.name==='BOOK_OF_BASAN')bookBonus=Math.max(bookBonus,getBookBonus(lvl,rar)*effMult);
    if(sp.name==='VIAL_MARTIAN_DUST')vialAdd=Math.max(vialAdd,getVialAdd(lvl,rar)*effMult);
    if(sp.name==='PUZZLE_CUBE')puzzleCubeMult=Math.min(puzzleCubeMult,1-(1-getPuzzleCubeMult(lvl,rar))*effMult);
    if(sp.name==='MERCURYS_LENS')mercurysLensMult=Math.max(mercurysLensMult,1+(getMercurysLensMult(lvl,rar)-1)*effMult);
   }

   equippedActiveSEMult*=evalItemPrestigeSE(sp,stones,false).seGainMult;
   equippedLunarSEMult*=evalItemPrestigeSE(sp,stones,true).seGainMult;

   equipped.push({
    itemId:it.itemId,rawName:sp.name,
    name:formatArtLabel(sp)+(stoneLabels.length?' ['+stoneLabels.join(', ')+']':''),
    baseName:formatArtLabel(sp),
    stones:stoneLabels,
    role:info.role,desc:info.desc,
    clarityPower:clarityPower
   });
  }
 }

 var bestOwned={};
 var bestActiveByType={};
 var bestLunarByType={};
 var dilithiumHolders=[];
 var looseStones=[];
 var clarityPowers=[];
 var demoteList=[];
 var bestGusset=null;
 var commonCraftCounts={};

 var bestTachyonMult=1.05, bestQuantumMult=1.05;
 var bestProphPts=0.15, bestSoulPts=5;
 var foundTachyon=false, foundQuantum=false, foundProph=false, foundSoul=false;

 function recordStoneTier(stName,stLevel){
  var sl=normLevel(stLevel);
  if(stName==='TACHYON_STONE'){
   var m=TACHYON_STONE_MULT[sl]||1.02;
   if(!foundTachyon || m>bestTachyonMult){bestTachyonMult=m;foundTachyon=true;}
  }else if(stName==='QUANTUM_STONE'){
   var qm=QUANTUM_STONE_MULT[sl]||1.02;
   if(!foundQuantum || qm>bestQuantumMult){bestQuantumMult=qm;foundQuantum=true;}
  }else if(stName==='PROPHECY_STONE'){
   var pp=PROPHECY_STONE_PTS[sl]||0.05;
   if(!foundProph || pp>bestProphPts){bestProphPts=pp;foundProph=true;}
  }else if(stName==='SOUL_STONE'){
   var sp=SOUL_STONE_PTS[sl]||2;
   if(!foundSoul || sp>bestSoulPts){bestSoulPts=sp;foundSoul=true;}
  }
 }

 inv.forEach(function(it){
  if((it.quantity||0)<=0)return;
  var comp=it.artifact||{};
  var sp=comp.spec||{};
  var lvl=normLevel(sp.level);
  var rar=normRarity(sp.rarity);
  var stones=comp.stones||[];

  if(STONE_INFO[sp.name]){
   var sInfo=STONE_INFO[sp.name];
   var sTier=STONE_TIER_MAP[lvl]||'';

   recordStoneTier(sp.name,lvl);
   if(sp.name==='CLARITY_STONE'){
    for(var q=0;q<it.quantity;q++)clarityPowers.push(CLARITY_STONE_VAL[lvl]||0);
   }
   return;
  }

  if(rar==='COMMON' && stones.length===0){
   var cKey=sp.name+':'+lvl;
   commonCraftCounts[cKey]=(commonCraftCounts[cKey]||0)+(it.quantity||0);
  }

  stones.forEach(function(st){
   if(!st || !st.name)return;
   recordStoneTier(st.name,st.level);
   if(st.name==='CLARITY_STONE')clarityPowers.push(CLARITY_STONE_VAL[normLevel(st.level)]||0);
  });

  var slotCap=getSlotCapacity({rarity:rar});
  var dCount=stones.filter(function(st){return st && st.name==='DILITHIUM_STONE'}).length;
  if(dCount>0 && ART_INFO[sp.name]){
   var dMult=1;
   stones.forEach(function(st){if(st && st.name==='DILITHIUM_STONE')dMult*=(DILITHIUM_STONE_MULT[normLevel(st.level)]||1)});
   dilithiumHolders.push({name:formatArtLabel(sp),dCount:dCount,mult:dMult});
  }

  if((rar==='RARE' || rar==='EPIC') && stones.length===0 && (it.quantity||0)>1 && ART_INFO[sp.name]){
   demoteList.push({name:formatArtLabel(sp),excess:(it.quantity-1)});
  }

  var score=(TIER_RANK[lvl]||0)*10 + (RARITY_RANK[rar]||0);
  if(sp.name==='ORNATE_GUSSET'){
   var gMult=getGussetMult(lvl,rar);
   if(!bestGusset || gMult>bestGusset.mult || (gMult===bestGusset.mult && slotCap>bestGusset.slotCap)){
    bestGusset={name:formatArtLabel(sp),mult:gMult,slotCap:slotCap};
   }
  }

  var stoneLabels=formatStoneList(stones);
  var displayLabel=formatArtLabel(sp)+(stoneLabels.length?' ['+stoneLabels.join(', ')+']':'');

  if(ART_INFO[sp.name]){
   var evA=evalItemPrestigeSE(sp,stones,false);
   if(!bestActiveByType[sp.name] || evA.seGainMult>bestActiveByType[sp.name].seGainMult || (evA.seGainMult===bestActiveByType[sp.name].seGainMult && !evA.isPureDilithium && bestActiveByType[sp.name].isPureDilithium)){
    bestActiveByType[sp.name]={rawName:sp.name,name:displayLabel,baseName:formatArtLabel(sp),seGainMult:evA.seGainMult,isPureDilithium:evA.isPureDilithium};
   }

    bestLunarByType[sp.name]={rawName:sp.name,name:displayLabel,baseName:formatArtLabel(sp),seGainMult:evL.seGainMult,isPureDilithium:evL.isPureDilithium};
   }
  }

  if(!bestOwned[sp.name] || score>bestOwned[sp.name].score){
   var info=ART_INFO[sp.name]||{name:shipName(sp.name),role:'other',desc:''};
   var itemMult=1;

   bestOwned[sp.name]={
    rawName:sp.name,name:displayLabel,baseName:formatArtLabel(sp),score:score,qty:it.quantity,desc:info.desc,
    slotCap:slotCap,mult:itemMult
   };
  }
 });

 clarityPowers.sort(function(a,b){return b-a});
 var gussetSlots=bestGusset?bestGusset.slotCap:0;
 var maxClarityEff=0;
 for(var cIdx=0;cIdx<Math.min(gussetSlots,clarityPowers.length);cIdx++)maxClarityEff+=clarityPowers[cIdx];

 dilithiumHolders.sort(function(a,b){return b.mult-a.mult});
 var setDilithium=dilithiumHolders.slice(0,maxArtSlots);

 setDilithium.forEach(function(x){potentialDilithiumMult*=x.mult});

 function pickSet(priorityList,sourceMap){

 var activeKeys=['PHOENIX_FEATHER','BOOK_OF_BASAN','DEMETERS_NECKLACE','TUNGSTEN_ANKH','VIAL_MARTIAN_DUST']

 var setMain=isEnlightenment

 var optimalActiveSEMult=setMain.reduce(function(acc,x){return acc*(x.seGainMult||1)},1);

 var lunarKeys=['LUNAR_TOTEM','PHOENIX_FEATHER','BOOK_OF_BASAN','DEMETERS_NECKLACE','TUNGSTEN_ANKH']

 var setLunar=pickSet(lunarKeys,bestLunarByType);
 var optimalLunarSEMult=setLunar.reduce(function(acc,x){return acc*(x.seGainMult||1)},1);

 var setIHR=pickSet(['THE_CHALICE','DILITHIUM_MONOCLE','ORNATE_GUSSET','DEMETERS_NECKLACE','TUNGSTEN_ANKH'],bestOwned);

 var setResearch=pickSet(['PUZZLE_CUBE','DEMETERS_NECKLACE','TUNGSTEN_ANKH'],bestOwned);
 var setDrones=pickSet(['AURELIAN_BROOCH','NEODYMIUM_MEDALLION','BEAK_OF_MIDAS','PUZZLE_CUBE','DEMETERS_NECKLACE'],bestOwned);

 var contractMetronomeMult=1, contractCompassMult=1;
 setContract.forEach(function(item){

 var totalContractSlots=setContract.reduce(function(sum,item){return sum+(item.slotCap||0)},0);

 };
}

function optimizeStones(art,logi){
 var bSE=logi.bonusPerSE||150;
 var bPE=logi.bonusPerPE||1.10;
 var pe=logi.peCount||0;
 var soulGainMult=(bSE + art.bestSoulPts)/bSE;
 var prophGainMult=Math.pow((bPE + art.bestProphPts/100)/bPE, pe);
 var useProphecy=(prophGainMult >= soulGainMult);
 var prestigeStoneAdvice=useProphecy
  ?('שבץ Prophecy Stones (+'+((prophGainMult-1)*100).toFixed(2)+'% לאבן מול +'+((soulGainMult-1)*100).toFixed(2)+'% ב-Soul Stone עם '+pe+' PE)')
  :('שבץ Soul Stones (+'+((soulGainMult-1)*100).toFixed(2)+'% לאבן מול +'+((prophGainMult-1)*100).toFixed(2)+'% ב-Prophecy Stone עם '+pe+' PE)');

 var slots=art.totalContractSlots||0;
 var contractStoneAdvice='';
 if(slots<=0){
  contractStoneAdvice='אין סלוטים פנויים בסט החוזים הנוכחי (נדרשים ארטיפקטים Rare/Epic/Legendary).';
 }else{
  var rawLay=(logi.totalLayRate / (Math.max(1,art.metronomeMult)*Math.max(1,art.tachyonStoneMult))) * (art.contractMetronomeMult||1);
  var rawShip=(logi.totalShipCap / (Math.max(1,art.compassMult)*Math.max(1,art.quantumStoneMult))) * (art.contractCompassMult||1);
  if(rawLay<=0 || rawShip<=0){
   contractStoneAdvice='שבץ '+slots+' אבני Tachyon (להאצת הטלה) ואז אזן עם Quantum כשהמשלוחים מתקרבים ל-90%.';
  }else{
   var bestK=0, bestThroughput=-1;
   for(var k=0;k<=slots;k++){
    var q=slots-k;
    var lay=rawLay * Math.pow(art.bestTachyonMult,k);
    var ship=rawShip * Math.pow(art.bestQuantumMult,q);
    var thr=Math.min(lay,ship);
    if(thr>bestThroughput){bestThroughput=thr;bestK=k;}
   }
   var bestQ=slots-bestK;
   contractStoneAdvice='חלוקה אופטימלית ל-'+slots+' סלוטים (עם סט החוזים): '+bestK+'× Tachyon + '+bestQ+'× Quantum';
  }
 }
 return {useProphecy:useProphecy,prestigeStoneAdvice:prestigeStoneAdvice,contractStoneAdvice:contractStoneAdvice};
}

function analyzeBoosts(b,sim,slots,hab,prestigeInfo,hasAffordableResearch,art,eggProg,hasPEContract,macro){
 var g=b.game||{};
 var maxBoostSlots=(slots===3)?5:2;
 var isWeekend=prestigeInfo.isWeekend;

 var active=(sim.activeBoosts||[]).filter(function(ab){

 }).map(function(ab){
  var bid=ab.boostId||ab.id;

  return {id:bid,name:info.name,timeRemaining:ab.timeRemaining};
 });

 var owned=[];
 (g.boosts||[]).forEach(function(bo){
  var bid=bo.boostId||bo.id||'';
  if(bid && (bo.count||0)>0){
   var info=getBoostInfo(bid);
   owned.push({id:bid,count:bo.count,name:info.name,cat:info.cat,power:info.power});

 });

 function bestByCat(cat,minReserve){
  var list=owned.filter(function(x){return x.cat===cat && x.count>(minReserve||0)});
  if(!list.length)list=owned.filter(function(x){return x.cat===cat});
  list.sort(function(a,b){return b.power-a.power});
  return list[0]||null;
 }

 var bestFeed=bestByCat('feed',1);
 var bestTachyon=bestByCat('tachyon',2);
 var bestSoul=bestByCat('soul',0);
 var bestBeacon=bestByCat('beacon',0);

 var dilNote=(art && art.potentialDilithiumMult>1.01)
  ?(' טיפ חובה: הרכב קודם סט Dilithium (+'+Math.round((art.potentialDilithiumMult-1)*100)+'% זמן) לפני ההפעלה ומיד החלף לסט Prestige!')
  :'';

 var contractNote=hasPEContract
  ?' (בחוזי Prophecy Egg/Colleggtible פעילים משתלם להריץ 1000x Tachyon + 10x Boost Beacon).'
  :'';

 var recCombo=[];
 var shouldUseNow=false;
 var recTitle='שמור בוסטים (ריצת חול רגילה — 0 בוסטים)';
 var recReason='בריצות Prestige שגרתיות מתקדמים בלי בוסטים עד הקיר ומאפסים. שמור בוסטים לאירוע Prestige בסופ"ש או לפריצה מעל 75% לביצה הבאה. קנה בוסטים רק בחבילות 5 (20% הנחה) במבצע.'+contractNote;

 if(macro.isEnl){
  recTitle='בוסטים חסומים בביצת Enlightenment';
  recReason='ב-Enlightenment לא ניתן להפעיל בוסטים. השתמש ב-The Chalice + Life Stones + Clarity Stones להאצת גדילת האוכלוסייה.';
 }else if(active.length>0){
  shouldUseNow=false;
  recTitle='בוסט פעיל כרגע ('+active.length+'/'+maxBoostSlots+')';
  recReason=hab.lunarBeatsActive
   ?'סט Lunar פעיל: סגור/מזער את המשחק ל-65+ שניות כדי להפעיל מכפיל אופליין מקסימלי ובצע Prestige ב-4.2B!'
   :'החזק את כפתור התרנגולות הרצות (רמת WD 24/25 פתוחה) ובצע Prestige ב-4.2B תרנגולות!';
 }else if(eggProg && eggProg.nextEgg && !eggProg.canUpgradeEgg && eggProg.pct>=75 && !hasAffordableResearch && bestFeed && (bestFeed.count>1 || bestFeed.power>=10)){
  shouldUseNow=true;
  recCombo.push({name:bestFeed.name,count:bestFeed.count,useQty:1});
  recTitle='הפעל בוסט הכנסות לפריצה לביצת '+eggProg.nextName;
  recReason='אתה ב-'+eggProg.pct.toFixed(0)+'% בדרך לביצה הבאה! הפעלת '+bestFeed.name+' תעביר אותך ביצה ותשבור את הקיר.'+dilNote;
 }else if(isWeekend && !hasAffordableResearch && hab.pop>=10000){
  if(macro.phase!=='LATE_GAME_MULTISTIGE' && hab.habPct<45 && bestTachyon && (bestTachyon.power>=100 || bestTachyon.count>=4)){
   shouldUseNow=true;
   recCombo.push({name:bestTachyon.name,count:bestTachyon.count,useQty:1});
   recTitle='דחיפת Prestige (שלב 1): מלא לולים עם Tachyon';
   recReason='אירוע Prestige פעיל! מלא לולים ל-~90% עם '+bestTachyon.name+' (שמור רמת WD פתוחה) ואז הפעל Bird Feed + Soul Beacon.'+dilNote;
  }else if((macro.phase==='LATE_GAME_MULTISTIGE' || hab.habPct>=45 || prestigeInfo.status==='boost_then_prestige' || prestigeInfo.hitTimeWall) && (bestFeed || bestSoul)){
   shouldUseNow=true;
   var usedSlots=0;
   if(bestTachyon && macro.phase==='LATE_GAME_MULTISTIGE' && maxBoostSlots===5){
    recCombo.push({name:bestTachyon.name,count:bestTachyon.count,useQty:1});

   }
   if(bestFeed && usedSlots<maxBoostSlots){
    recCombo.push({name:bestFeed.name,count:bestFeed.count,useQty:1});
    usedSlots++;
   }
   if(bestSoul && usedSlots<maxBoostSlots){
    recCombo.push({name:bestSoul.name,count:bestSoul.count,useQty:1});
    usedSlots++;
   }
   if(bestBeacon && usedSlots<maxBoostSlots){

     recCombo.push({name:bestBeacon.name,count:bestBeacon.count,useQty:actualBeaconQty});
     usedSlots+=actualBeaconQty;

   }
   recTitle=hab.lunarBeatsActive?'הפעל סבב Multi-Lunarstige (5 בוסטים)':'הפעל שילוב Prestige';

    :'אירוע Prestige פעיל! הפעל, הרכב ארטיפקטי Prestige והרץ תרנגולות'+(macro.phase==='LATE_GAME_MULTISTIGE'?' (בצע Prestige ב-4.2B בכל רגל)':' 10 דקות לפני Prestige')+'.'+dilNote;
  }
 }

 return {maxBoostSlots:maxBoostSlots,active:active,owned:owned,shouldUseNow:shouldUseNow,recCombo:recCombo,recTitle:recTitle,recReason:recReason};
}

function shipName(s){return String(s||'').split('_').map(function(w){return w.charAt(0)+w.slice(1).toLowerCase()}).join(' ')}
function cleanContractName(id){return String(id||'חוזה').split('-').map(function(w){return w.charAt(0).toUpperCase()+w.slice(1)}).join(' ')}
function hrs(sec){if(sec<=0)return '0 דקות';var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);return h>=48?Math.round(h/24)+' ימים':h+' שעות ו-'+m+' דקות'}

function formatRewardItem(g){
 var rt=g.rewardType||'';
 var amt=Number(g.rewardAmount)||0;
 if(rt==='EGGS_OF_PROPHECY')return (amt>1?Math.round(amt)+' ':'')+'Prophecy Egg';
 if(rt==='GOLDEN_EGGS')return fmt(amt)+' GE';
 if(rt==='SOUL_EGGS')return fmt(amt)+' SE';
 if(rt==='ARTIFACT_CASE')return 'תיבת ארטיפקטים';
 if(rt==='EPIC_RESEARCH_ITEM')return 'שדרוג Epic';
 if(rt==='BOOST')return (amt>1?Math.round(amt)+'× ':'')+(g.rewardSubType?getBoostInfo(g.rewardSubType).name:'בוסט');
 if(rt==='PIGGY_FILL')return '+'+fmt(amt)+' Piggy';
 if(rt==='PIGGY_LEVEL_BUMP')return 'רמת Piggy +'+Math.max(1,Math.round(amt));
 if(rt==='SHELL_SCRIPT')return fmt(amt)+' תלושי עיצוב';
 if(rt==='CASH')return 'מזומן';
 return shipName(rt||'פרס');
}

function getContractGoals(c,b){
 var k=c.contract||{};
 var grade=c.grade || (b.contracts && b.contracts.lastGraded) || '';
 if(Array.isArray(k.gradeSpecs) && k.gradeSpecs.length){
  var matched=null;
  if(grade){
   for(var i=0;i<k.gradeSpecs.length;i++){
    if(k.gradeSpecs[i].grade===grade){matched=k.gradeSpecs[i];break}
   }
  }
  var spec=matched || k.gradeSpecs[0];
  if(spec && Array.isArray(spec.goals))return spec.goals;
 }
 if(Array.isArray(k.goalSets) && k.goalSets.length){
  var gs=k.goalSets[c.league||0] || k.goalSets[0];
  if(gs && Array.isArray(gs.goals))return gs.goals;
 }
 return Array.isArray(k.goals)?k.goals:[];
}

function analyzeContractRewards(c,b){
 var goals=getContractGoals(c,b);
 var hasPE=false;
 var peCount=0;
 var items=[];
 goals.forEach(function(g){
  if(g.rewardType==='EGGS_OF_PROPHECY'){
   hasPE=true;
   peCount+=Math.max(1,Math.round(Number(g.rewardAmount)||1));
  }
  items.push(formatRewardItem(g));
 });
 return {hasPE:hasPE,peCount:peCount,rewardsText:items.join(' • ')};
}

function checkColleggtibleStatus(k,b){

 if(!customId && k.egg && EGG_ORDER.indexOf(k.egg)<0 && !VIRT[k.egg])customId=k.egg;
 if(!customId)return {isColleggtible:false,needs10B:false,customId:''};
 var infoList=(b.contracts && b.contracts.customEggInfo)||[];
 var bestPop=0;
 infoList.forEach(function(ce){
  if(ce && (ce.identifier===customId || ce.id===customId)){
   bestPop=Math.max(bestPop,Number(ce.maxPopulation||ce.population||0));
  }
 });
 return {isColleggtible:true,needs10B:(bestPop<1e10),bestPop:bestPop,customId:customId};
}

function availableContractInfo(c,b,archivedMap,now){
 var k=c.contract||{},id=c.contractIdentifier||k.identifier||'';
 var name=k.name||cleanContractName(id);
 var arch=archivedMap[id];
 var alreadyCompletedAll=(arch && (arch.numGoalsAchieved||0)>=3);
 var isReplay=!!c.pointsReplay || !!alreadyCompletedAll;
 var rew=analyzeContractRewards(c,b);
 var coll=checkColleggtibleStatus(k,b);

 var exp=Number(k.expirationTime||0);
 if(exp>1e12)exp/=1000;
 var joinLeft=(exp>now)?(exp-now):0;

 var dur=Number(k.lengthSeconds||0);
 if(dur>1e12)dur/=1000;
 var eggName=coll.isColleggtible?('Colleggtible: '+shipName(coll.customId)):(k.egg?(EGG_HE[k.egg]||shipName(k.egg)):'');
 var maxCoop=k.maxCoopSize||0;

function detectBestShip(b,isVirt,events){
 var sel=$('shipTarget').value;
 var db=b.artifactsDb||{};
 var vafx=(b.virtue&&b.virtue.afx)||{};
 var bestIdx=0;
 var launchCounts={};
 function recordShip(s){
  var i=SHIP_ORDER.indexOf(s);
  if(i>bestIdx)bestIdx=i;
  if(s)launchCounts[s]=(launchCounts[s]||0)+1;
 }
 (db.missionInfos||[]).forEach(function(m){recordShip(m.ship)});
 (db.missionArchive||[]).forEach(function(m){recordShip(m.ship)});
 if(vafx.lastFueledShip){var idx1=SHIP_ORDER.indexOf(vafx.lastFueledShip);if(idx1>bestIdx)bestIdx=idx1;}
 if(db.lastFueledShip){var idx2=SHIP_ORDER.indexOf(db.lastFueledShip);if(idx2>bestIdx)bestIdx=idx2;}

 var defaultIdx=bestIdx;
 while(defaultIdx<SHIP_ORDER.length-1){
  var curS=SHIP_ORDER[defaultIdx];
  var reqS=SHIP_UNLOCK_REQ[curS]||0;
  if(reqS>0 && (launchCounts[curS]||0)>=reqS){
   defaultIdx++;
  }else{
   break;
  }
 }

 var defaultTarget=SHIP_ORDER[defaultIdx]||'CHICKEN_ONE';
 if(isVirt && defaultTarget==='ATREGGIES')defaultTarget='HENERPRISE';
 var target=(sel && sel!=='auto')?sel:defaultTarget;
 var tIdx=SHIP_ORDER.indexOf(target);
 var launched=launchCounts[target]||0;
 var req=SHIP_UNLOCK_REQ[target]||0;
 var nextShip=(tIdx>=0 && tIdx<SHIP_ORDER.length-1)?SHIP_ORDER[tIdx+1]:null;
 var preferExtended=(target==='HENERPRISE' || target==='ATREGGIES');
 var durKey=preferExtended?'EXTENDED':'SHORT';
 var missionDur=preferExtended?'Extended':'Short';
 if(events && events.missionCapacityMultiplier>1 && !preferExtended)missionDur='Short (2x Capacity!)';
 return {target:target,launched:launched,req:req,nextShip:nextShip,preferExtended:preferExtended,durKey:durKey,missionDur:missionDur};
}

function checkShipFuel(b,sim,isVirt,events){
 var shipProg=detectBestShip(b,isVirt,events);
 var target=shipProg.target;
 var reqFuels=SHIP_FUELS[target]||['ROCKET_FUEL'];
 var costMap=(SHIP_FUEL_COSTS[target]&&SHIP_FUEL_COSTS[target][shipProg.durKey])||{};
 var curEgg=sim.eggType||'';
 var db=b.artifactsDb||{};
 var vafx=(b.virtue&&b.virtue.afx)||{};
 var tank=db.tankFuels||vafx.tankFuels||[];
 var tankLevel=Number(db.tankLevel||0);
 var tankCapacity=TANK_CAPACITIES[Math.min(tankLevel,TANK_CAPACITIES.length-1)]||2e9;
 var tankTotal=tank.reduce(function(x,y){return x+(y||0)},0);
 var tankFreeSpace=Math.max(0,tankCapacity-tankTotal);

 var onFuelEgg=(reqFuels.indexOf(curEgg)>=0);
 var minLaunchesInTank=Infinity;
 var missingDetails=[];
 var hasAllFuelsInTank=true;
 var hasOtherFuelsInTank=true;

 reqFuels.forEach(function(f){
  var idx=EGG_ORDER.indexOf(f);
  var stored=(idx>=0)?(tank[idx]||0):0;
  var reqAmt=costMap[f]||1e6;
  var launches=Math.floor(stored/reqAmt);
  if(launches<minLaunchesInTank)minLaunchesInTank=launches;
  if(stored<reqAmt){
   hasAllFuelsInTank=false;
   if(f!==curEgg)hasOtherFuelsInTank=false;
   missingDetails.push((EGG_HE[f]||f)+': '+fmt(stored)+'/'+fmt(reqAmt));
  }
 });
 if(!isFinite(minLaunchesInTank))minLaunchesInTank=0;

 var canLaunchNow=(onFuelEgg?hasOtherFuelsInTank:hasAllFuelsInTank);
 var reqNames=reqFuels.map(function(e){
  var amt=costMap[e];
  return (EGG_HE[e]||e)+(amt?' ('+fmt(amt)+')':'');
 }).join(', ');

 return {
  target:target,shipProg:shipProg,reqFuels:reqFuels,reqNames:reqNames,onFuelEgg:onFuelEgg,
  hasFuelInTank:hasAllFuelsInTank,canLaunchNow:canLaunchNow,
  tankTotal:tankTotal,tankCapacity:tankCapacity,tankFreeSpace:tankFreeSpace,tankLevel:tankLevel,
  minLaunchesInTank:minLaunchesInTank,missingDetails:missingDetails,
  curEggName:EGG_HE[curEgg]||curEgg
 };
}

async function run(silent){
 if(busy)return;var eid=$('eid').value.trim();if(!eid){$('out').innerHTML='<p class="err">הכנס EID</p>';return}
 sset('eid',eid);$('eid-bar').style.display='none';
 busy=true;if(!silent||!last)$('out').innerHTML='<p>טוען...</p>';
 try{
  var R=await getRes();
  last=await load(eid);
  await fetchPeriodicals(eid,last);
  show(last,R);
  $('sync').textContent='עודכן: '+new Date().toLocaleTimeString('he-IL')+' • גיבוי לפני '+Math.round((Date.now()/1000-(last.approxTime||0))/60)+' דק\''+(liveServerEvents?' • אירועים מסונכרנים מהשרת':'');
 }
 catch(e){$('eid-bar').style.display='flex';if(!last||!silent){$('out').innerHTML='<p class="err">'+esc(e.message||e)+'</p>'}else{$('sync').textContent='הרענון נכשל: '+(e.message||e)}}
 busy=false;
}

 var sameDay=(savedDate===today);
 if(!sameDay)sset('ev_date',today);
 var def=getActiveEvents().autoDefaults;
 var map={'ev-prestige':def.prestige,'ev-epic':def.epic,'ev-common':def.common,'ev-cap':false,'ev-drones':false,'ev-craft':false};
 Object.keys(map).forEach(function(id){
  var el=$(id);
  if(!el)return;
  var saved=sameDay?sget(id):null;
  el.checked=(saved!==null)?(saved==='1'):map[id];
  if(!sameDay)sset(id,el.checked?'1':'0');
  el.addEventListener('change',function(){sset('ev_date',new Date().toDateString());sset(id,el.checked?'1':'0');if(last&&RES)show(last,RES)});
 });
})();

$('go').addEventListener('click',function(){run(false)});
$('btn-ref').addEventListener('click',function(){run(false)});
$('btn-eid').addEventListener('click',function(){var b=$('eid-bar');b.style.display=(b.style.display==='none'?'flex':'none')});
['slots','run','shipTarget'].forEach(function(id){var v=sget(id);if(v)$(id).value=v;$(id).addEventListener('change',function(){sset(id,$(id).value);if(last&&RES)show(last,RES)})});
var s=sget('eid');if(s){$('eid').value=s;run(false)}
setInterval(function(){if(!document.hidden&&$('eid').value.trim())run(true)},20000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&$('eid').value.trim())run(true)});
</script></body></html>
