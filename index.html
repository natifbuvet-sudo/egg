<title>Egg Inc - הצעד הבא</title>

<style>
:root{--bg:#f3f0e6;--s:#fffdf7;--ink:#1d2330;--mut:#5d6577;--line:#d9d3c0;--acc:#2d5be3;--accink:#fff;--y:#f5b82e;--bad:#b3261e;--ok:#1b7a3d}
@media(prefers-color-scheme:dark){:root{--bg:#12151d;--s:#1b2030;--ink:#eceef5;--mut:#9aa3b8;--line:#2c3348;--acc:#7b9bff;--accink:#0f1320;--bad:#ff8a80;--ok:#6dd58c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Arial,sans-serif;line-height:1.45;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);font-size:15px}
main{max-width:520px;margin:0 auto;padding:10px 12px 36px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:6px}
h1{font-size:1.05rem;margin:0;display:flex;align-items:center;gap:6px}
.ver{font-size:.72rem;background:var(--s);border:1px solid var(--line);padding:2px 7px;border-radius:6px;color:var(--mut);font-weight:600}
.icon-btn{background:var(--s);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:.82rem;cursor:pointer;font-weight:600}
.row{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
input,select{font:inherit;color:var(--ink);background:var(--s);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;font-size:.88rem}
button{font:inherit;background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:.86rem}
button.hero-btn{margin-top:9px;background:var(--y);color:#12151d;padding:6px 14px;font-size:.84rem;border-radius:8px}
button.sm-btn{margin-top:6px;background:transparent;color:var(--acc);border:1px solid var(--acc);padding:3px 10px;font-size:.78rem;border-radius:6px}
button.copy-btn{background:var(--acc);color:var(--accink);width:100%;padding:8px;margin-top:8px;border-radius:8px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.nav{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:var(--s);color:var(--ink);border:1px solid var(--line);padding:5px 10px;font-size:.78rem;border-radius:20px;flex-shrink:0}
.nav button.active{background:var(--acc);color:var(--accink);border-color:var(--acc)}

.hud{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:10px}
.hud-box{background:var(--s);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.hud-box small{display:block;font-size:.7rem;color:var(--mut)}
.hud-box b{font-size:.86rem;display:block;margin-top:1px}

.hero{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 15px;margin:10px 0;border-inline-start:6px solid var(--y)}
.hero small{display:block;color:var(--y);font-weight:700;font-size:.76rem;margin-bottom:3px;letter-spacing:.2px}
.hero h2{margin:0 0 5px;font-size:1.15rem;line-height:1.25}
.hero p{margin:0;opacity:.92;font-size:.87rem}

ol{list-style:none;margin:0 0 12px;padding:0}
li.it{background:var(--s);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:7px}
li.it b{display:block;font-size:.9rem}
li.it span{color:var(--mut);font-size:.82rem;display:block;margin-top:2px}
.step-num{display:inline-block;background:var(--line);color:var(--ink);font-size:.72rem;font-weight:700;padding:0 6px;border-radius:5px;margin-inline-end:6px}

.tag-ok{display:inline-block;background:var(--ok);color:#fff;font-size:.72rem;padding:2px 7px;border-radius:5px;font-weight:700}
.tag-wait{display:inline-block;background:var(--line);color:var(--ink);font-size:.72rem;padding:2px 7px;border-radius:5px;font-weight:600}
.tag-warn{display:inline-block;background:var(--bad);color:#fff;font-size:.72rem;padding:2px 7px;border-radius:5px;font-weight:700}
.tier-pill{display:inline-block;background:var(--line);color:var(--ink);font-size:.68rem;padding:1px 5px;border-radius:4px;margin-inline-end:5px;font-weight:700}
.stone-pill{display:inline-block;background:rgba(45,91,227,.14);color:var(--acc);font-size:.7rem;padding:1px 6px;border-radius:4px;margin-inline-start:4px;font-weight:600}
.err{color:var(--bad);margin:6px 0;font-weight:600;font-size:.9rem}
.warn{background:var(--s);border:1px solid var(--y);border-radius:8px;padding:7px 10px;margin:6px 0;font-size:.8rem}

.card{background:var(--s);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:.88rem}
.card h3{margin:0 0 8px;font-size:.95rem;display:flex;justify-content:space-between;align-items:center}
.card .l{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);align-items:center}
.card .l:first-of-type{border-top:0;padding-top:2px}
.card small{color:var(--mut)}
.card p{margin:5px 0;font-size:.85rem}

.prog-bar{background:var(--line);border-radius:6px;height:7px;overflow:hidden;margin:5px 0}
.prog-fill{background:var(--acc);height:100%;transition:width .3s}
.prog-fill.ok{background:var(--ok)}
.prog-fill.bad{background:var(--bad)}

.status-banner{border-radius:9px;padding:9px 11px;margin-bottom:8px;border:1px solid var(--line);background:var(--bg)}
.status-banner.do{border-color:var(--ok);background:rgba(27,122,61,.12)}
.status-banner.alert{border-color:var(--bad);background:rgba(179,38,30,.12)}
.status-banner.hold{border-color:var(--line)}
.status-banner b{display:block;font-size:.92rem;margin-bottom:2px}

.c-box{border-top:1px solid var(--line);padding:8px 0}
.c-box:first-of-type{border-top:0;padding-top:2px}
.c-head{font-weight:700;font-size:.92rem;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.sec-sub{font-size:.78rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;margin:8px 0 4px;padding-bottom:3px;border-bottom:1px dashed var(--line)}
.badge{font-size:.72rem;padding:2px 7px;border-radius:5px;font-weight:700}
.b-pe{background:var(--y);color:#12151d}
.b-rew{background:var(--acc);color:var(--accink)}
.b-pts{background:var(--line);color:var(--ink)}
.b-wait{background:var(--ok);color:#fff}
.note{color:var(--mut);font-size:.76rem;margin-top:10px}
details summary{list-style:none}
details summary::-webkit-details-marker{display:none}
.sum-head{font-weight:700;font-size:.95rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
</style>

function epicPlan(R,lv,avail,peCount){
 var priList=(peCount>=15)?PRI_HIGH_PE:PRI_EARLY;
 var ep=R.filter(function(r){return r.type==='epic'}).filter(function(r){return (lv[r.id]||0)<r.levels});
 ep.sort(function(a,b){var x=priList.indexOf(a.id),y=priList.indexOf(b.id);if(x<0)x=999;if(y<0)y=999;if(x!==y)return x-y;return a.prices[lv[a.id]||0]-b.prices[lv[b.id]||0]});
 var rows=ep.map(function(r){var L=lv[r.id]||0;var left=0;for(var i=L;i<r.levels;i++)left+=r.prices[i];return {r:r,L:L,price:r.prices[L],left:left}});
 var buy=null;if(rows.length){var f=rows[0],n=0,sum=0,L=f.L;while(L<f.r.levels&&sum+f.r.prices[L]<=avail){sum+=f.r.prices[L];L++;n++}buy={row:f,n:n,sum:sum}}
 return {rows:rows,buy:buy};
}
function cgain(r,L,ctx){
 var p=r.per_level,g;
 if(r.effect_type==='multiplicative'){g=r.levels_compound==='multiplicative'?Math.log(1+p):Math.log((1+p*(L+1))/(1+p*L))}
 else{g=p/(1+p*L+(p<1?1:10))}
 var cat=r.categories;
 var w=W[cat];
 if(w===undefined)w=0.1;
 if(ctx){
  if(cat==='shipping_capacity' || cat==='fleet_size'){
   if(ctx.shipBottleneck)w=(cat==='shipping_capacity')?2.2:1.6;
   else if(ctx.shipUtilPct>=80)w=(cat==='shipping_capacity')?1.0:0.45;
   else if(ctx.shipUtilPct>=55)w=(cat==='shipping_capacity')?0.45:0.2;
   else w=0.12;
  }else if(cat==='internal_hatchery_rate'){
   w=(ctx.habPct<80)?0.95:0.2;
  }else if(cat==='hab_capacity'){
   w=(ctx.habPct>=80)?1.25:0.55;
  }
 }
 return g*w;
}

function commonPlan(R,lv,virt,cash,elv,ctx){
 var simLv=Object.assign({},lv);
 var cm=R.filter(function(r){return r.type==='common'});
 var labDisc=1-0.05*(elv['cheaper_research']||0);
 if(labDisc<0.1)labDisc=0.1;
 function bought(t){var n=0;cm.forEach(function(r){if(r.tier<=t)n+=simLv[r.id]||0});return n}

 var remCash=(cash!==undefined && cash!==null)?Number(cash):0;
 var startCash=remCash;
 var buyById={};
 var buyOrder=[];
 var totalLevelsBought=0;
 var totalSpent=0;
 var nextOutOfBudget=[];

 for(var step=0;step<2500;step++){
  var best=null;
  for(var i=0;i<cm.length;i++){
   var r=cm[i],L=simLv[r.id]||0;
   if(L>=r.levels)continue;
   if(r.tier>1&&(r.tier-1>=TH.length||bought(r.tier-1)<TH[r.tier-1]))continue;
   var pr=(virt?r.virtue_prices:r.prices)||r.prices;
   var p=(pr[L]||0)*labDisc;
   if(!p)continue;
   var sc=cgain(r,L,ctx)/p;
   if(!best||sc>best.score)best={r:r,L:L,price:p,score:sc};
  }
  if(!best)break;

  if(remCash>=best.price){
   remCash-=best.price;
   totalSpent+=best.price;
   totalLevelsBought++;
   simLv[best.r.id]=best.L+1;
   if(!buyById[best.r.id]){
    buyById[best.r.id]={r:best.r,from:(lv[best.r.id]||0),to:best.L+1,count:1,cost:best.price,canBuy:true,firstScore:best.score};
    buyOrder.push(buyById[best.r.id]);
   }else{
    buyById[best.r.id].to=best.L+1;
    buyById[best.r.id].count++;
    buyById[best.r.id].cost+=best.price;
   }
  }else{
   simLv[best.r.id]=best.L+1;
   var lastNext=nextOutOfBudget[nextOutOfBudget.length-1];
   if(lastNext && lastNext.r.id===best.r.id){
    lastNext.to=best.L+1;
    lastNext.count++;
    lastNext.cost+=best.price;
   }else{
    if(nextOutOfBudget.length>=5)break;
    nextOutOfBudget.push({r:best.r,from:best.L,to:best.L+1,count:1,cost:best.price,canBuy:false,firstScore:best.score});
   }
  }
 }

 buyOrder.sort(function(a,b){
  if(a.r.tier!==b.r.tier)return a.r.tier-b.r.tier;
  return b.firstScore-a.firstScore;
 });

 return {
  affordableList:buyOrder,
  nextList:nextOutOfBudget,
  totalLevelsBought:totalLevelsBought,
  totalSpent:totalSpent,
  remCash:remCash,
  startCash:startCash
 };
}

 }

 }

 if(artInfo && artInfo.gussetMult>1)habMult*=artInfo.gussetMult;

 }

  var tLabel=TIER_MAP[sp.level]||sp.level||'';
  var rLabel=RARITY_MAP[sp.rarity]||'';
  return info.name+' ('+tLabel+rLabel+')';
 }

 for(var i=0;i<maxArtSlots;i++){
  var sl=homeSet[i];
  if(sl && sl.occupied && byId[sl.itemId]){
   var it=byId[sl.itemId];
   var comp=it.artifact||{};
   var sp=comp.spec||{};
   var stones=comp.stones||[];
   var info=ART_INFO[sp.name]||{name:shipName(sp.name),role:'other',desc:''};

   var clarityPower=0;
   var stoneLabels=[];
   stones.forEach(function(st){
    if(!st || !st.name)return;
    var sInfo=STONE_INFO[st.name]||{name:shipName(st.name)};
    var sTier=STONE_TIER_MAP[st.level]||'';
    stoneLabels.push(sInfo.name+(sTier?' '+sTier:''));
    if(st.name==='CLARITY_STONE')clarityPower+=(CLARITY_STONE_VAL[st.level]||0);
    if(st.name==='TACHYON_STONE')tachyonStoneMult*=(TACHYON_STONE_MULT[st.level]||1);
    if(st.name==='QUANTUM_STONE')quantumStoneMult*=(QUANTUM_STONE_MULT[st.level]||1);
    if(st.name==='DILITHIUM_STONE')dilithiumMult*=(DILITHIUM_STONE_MULT[st.level]||1);
   });

   var effMult=1;
   if(isEnlightenment && sp.name!=='LIGHT_OF_EGGENDIL'){
    effMult=clarityPower;
    if(clarityPower<=0)enlightenmentWarnings.push(formatArtLabel(sp));
   }

   equipped.push({
    itemId:it.itemId,rawName:sp.name,
    name:formatArtLabel(sp),
    baseName:formatArtLabel(sp),
    stones:stoneLabels,
    role:info.role,desc:info.desc,
    clarityPower:clarityPower
   });

   if(effMult>0){
    if(sp.name==='ORNATE_GUSSET')gussetMult=Math.max(gussetMult,1+(getGussetMult(sp.level,sp.rarity)-1)*effMult);
    if(sp.name==='QUANTUM_METRONOME')metronomeMult=Math.max(metronomeMult,1+(getMetronomeMult(sp.level,sp.rarity)-1)*effMult);
    if(sp.name==='INTERSTELLAR_COMPASS')compassMult=Math.max(compassMult,1+(getCompassMult(sp.level,sp.rarity)-1)*effMult);
   }
  }
 }

 var bestOwned={};
 var dilithiumHolders=[];
 var looseStones=[];
 var demoteList=[];

 inv.forEach(function(it){
  if((it.quantity||0)<=0)return;
  var comp=it.artifact||{};
  var sp=comp.spec||{};
  var stones=comp.stones||[];

  if(STONE_INFO[sp.name]){
   var sInfo=STONE_INFO[sp.name];
   var sTier=STONE_TIER_MAP[sp.level]||'';
   looseStones.push({name:sInfo.name+' ('+sTier+')',desc:sInfo.desc,qty:it.quantity});
   return;
  }

  var dCount=stones.filter(function(st){return st && st.name==='DILITHIUM_STONE'}).length;
  if(dCount>0 && ART_INFO[sp.name]){
   var dMult=1;
   stones.forEach(function(st){if(st && st.name==='DILITHIUM_STONE')dMult*=(DILITHIUM_STONE_MULT[st.level]||1)});
   dilithiumHolders.push({name:formatArtLabel(sp),dCount:dCount,mult:dMult});
  }

  if((sp.rarity==='RARE' || sp.rarity==='EPIC') && stones.length===0 && (it.quantity||0)>1 && ART_INFO[sp.name]){
   demoteList.push({name:formatArtLabel(sp),excess:(it.quantity-1)});
  }

  var score=(TIER_RANK[sp.level]||0)*10 + (RARITY_RANK[sp.rarity]||0);
  if(!bestOwned[sp.name] || score>bestOwned[sp.name].score){
   var info=ART_INFO[sp.name]||{name:shipName(sp.name),role:'other',desc:''};
   bestOwned[sp.name]={rawName:sp.name,name:formatArtLabel(sp),score:score,qty:it.quantity,desc:info.desc};
  }
 });

 dilithiumHolders.sort(function(a,b){return b.mult-a.mult});
 var setDilithium=dilithiumHolders.slice(0,maxArtSlots);
 var potentialDilithiumMult=1;
 setDilithium.forEach(function(x){potentialDilithiumMult*=x.mult});

 function pickSet(priorityList){
  var res=[];
  for(var i=0;i<priorityList.length;i++){
   var k=priorityList[i];
   if(bestOwned[k] && res.length<maxArtSlots)res.push(bestOwned[k]);
  }
  return res;
 }
 var mainPrio=(peCount>=18)
  ?['PHOENIX_FEATHER','BOOK_OF_BASAN','DEMETERS_NECKLACE','TUNGSTEN_ANKH','VIAL_MARTIAN_DUST']
  :['PHOENIX_FEATHER','DEMETERS_NECKLACE','TUNGSTEN_ANKH','VIAL_MARTIAN_DUST','BOOK_OF_BASAN'];

 var setMain=isEnlightenment
  ?pickSet(['LIGHT_OF_EGGENDIL','PHOENIX_FEATHER','DEMETERS_NECKLACE','TUNGSTEN_ANKH','ORNATE_GUSSET'])
  :pickSet(mainPrio);
 var setContract=pickSet(['TACHYON_DEFLECTOR','QUANTUM_METRONOME','INTERSTELLAR_COMPASS','ORNATE_GUSSET','THE_CHALICE']);
 var setResearch=pickSet(['PUZZLE_CUBE','DEMETERS_NECKLACE','TUNGSTEN_ANKH']);
 var setDrones=pickSet(['AURELIAN_BROOCH','NEODYMIUM_MEDALLION','BEAK_OF_MIDAS','DEMETERS_NECKLACE']);

 return {
  equipped:equipped,maxArtSlots:maxArtSlots,
  gussetMult:gussetMult,metronomeMult:metronomeMult,compassMult:compassMult,
  tachyonStoneMult:tachyonStoneMult,quantumStoneMult:quantumStoneMult,
  dilithiumMult:dilithiumMult,potentialDilithiumMult:potentialDilithiumMult,
  setDilithium:setDilithium,looseStones:looseStones,
  enlightenmentWarnings:enlightenmentWarnings,
  setMain:setMain,setContract:setContract,setResearch:setResearch,setDrones:setDrones,demoteList:demoteList
 };
}

function analyzeBoosts(b,sim,slots,hab,prestigeInfo,hasAffordableResearch,art,eggProg,hasPEContract){
 var g=b.game||{};
 var maxBoostSlots=(slots===3)?5:2;
 var isWeekend=prestigeInfo.isWeekend;

 var active=(sim.activeBoosts||[]).filter(function(ab){
  return (ab.boostId||ab.id) && (ab.timeRemaining||0) > 0;
 }).map(function(ab){
  var bid=ab.boostId||ab.id;
  var info=getBoostInfo(bid);
  return {id:bid,name:info.name,timeRemaining:ab.timeRemaining};
 });

 var owned=[];
 (g.boosts||[]).forEach(function(bo){
  var bid=bo.boostId||bo.id||'';
  if(bid && (bo.count||0)>0){
   var info=getBoostInfo(bid);
   owned.push({id:bid,count:bo.count,name:info.name,cat:info.cat,power:info.power});
  }
 });

 function bestByCat(cat,minReserve){
  var list=owned.filter(function(x){return x.cat===cat && x.count>(minReserve||0)});
  if(!list.length)list=owned.filter(function(x){return x.cat===cat});
  list.sort(function(a,b){return b.power-a.power});
  return list[0]||null;
 }

 var bestFeed=bestByCat('feed',1);
 var bestTachyon=bestByCat('tachyon',2);
 var bestSoul=bestByCat('soul',0);
 var bestBeacon=bestByCat('beacon',1);

 var dilNote=(art && art.potentialDilithiumMult>1.01)
  ?(' טיפ: הרכב קודם סט Dilithium (+'+Math.round((art.potentialDilithiumMult-1)*100)+'% משך בוסט) לפני ההפעלה!')
  :'';

 var contractNote=hasPEContract
  ?' (בחוזי Prophecy Egg פעילים משתלם להשתמש ב-Tachyon Prism או Soul Mirror בתוך החוזה).'
  :'';

 var recCombo=[];
 var shouldUseNow=false;
 var recTitle='שמור בוסטים (ריצת חול רגילה — 0 בוסטים)';
 var recReason='בריצות Prestige שגרתיות מתקדמים בלי בוסטים עד הקיר ומאפסים. שמור Bird Feed ו-Soul Beacon לאירוע 2x Prestige בסופ"ש (שבת–שני) או לפריצה מעל 75% לביצה הבאה.'+contractNote;

 if(active.length>0){
  shouldUseNow=false;
  recTitle='בוסט פעיל כרגע ('+active.length+'/'+maxBoostSlots+')';
  recReason='החזק את כפתור התרנגולות הרצות כדי למקסם את הבוסט הפעיל.';
 }else if(eggProg && eggProg.nextEgg && !eggProg.canUpgradeEgg && eggProg.pct>=75 && !hasAffordableResearch && bestFeed && (bestFeed.count>1 || bestFeed.power>=10)){
  shouldUseNow=true;
  recCombo.push(bestFeed);
  recTitle='הפעל בוסט הכנסות לפריצה לביצת '+eggProg.nextName;
  recReason='אתה ב-'+eggProg.pct.toFixed(0)+'% בדרך לביצה הבאה! הפעלת '+bestFeed.name+' עם תרנגולות רצות תעביר אותך ביצה ותשבור את הקיר.'+dilNote;
 }else if(isWeekend && !hasAffordableResearch && hab.pop>=10000){
  if(hab.habPct<45 && bestTachyon && (bestTachyon.power>=100 || bestTachyon.count>=4)){
   shouldUseNow=true;
   recCombo.push(bestTachyon);
   recTitle='דחיפת סופ"ש (שלב 1): מלא לולים עם Tachyon';
   recReason='אירוע 2x Prestige פעיל! כדאי למלא קודם לולים עם '+bestTachyon.name+' ורק לאחר מכן להפעיל שילוב Bird Feed + Soul Beacon.'+dilNote;
  }else if((hab.habPct>=45 || prestigeInfo.status==='boost_then_prestige' || prestigeInfo.hitTimeWall) && (bestFeed || bestSoul)){
   shouldUseNow=true;
   if(bestFeed)recCombo.push(bestFeed);
   if(bestSoul && recCombo.length<maxBoostSlots)recCombo.push(bestSoul);
   if(bestBeacon && bestBeacon.count>1 && recCombo.length<maxBoostSlots)recCombo.push(bestBeacon);
   recTitle='דחיפת סופ"ש (2x Prestige): הפעל שילוב Prestige';
   recReason='אירוע 2x Prestige פעיל! הפעל, הרכב ארטיפקטי Prestige והחזק תרנגולות רצות 10 דקות לפני ביצוע Prestige.'+dilNote;
  }
 }

 return {maxBoostSlots:maxBoostSlots,active:active,owned:owned,shouldUseNow:shouldUseNow,recCombo:recCombo,recTitle:recTitle,recReason:recReason};
}

function shipName(s){return String(s||'').split('_').map(function(w){return w.charAt(0)+w.slice(1).toLowerCase()}).join(' ')}
function cleanContractName(id){return String(id||'חוזה').split('-').map(function(w){return w.charAt(0).toUpperCase()+w.slice(1)}).join(' ')}
function hrs(sec){if(sec<=0)return '0 דקות';var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);return h>=48?Math.round(h/24)+' ימים':h+' שעות ו-'+m+' דקות'}

function formatRewardItem(g){
 var rt=g.rewardType||'';
 var amt=Number(g.rewardAmount)||0;
 if(rt==='EGGS_OF_PROPHECY')return (amt>1?Math.round(amt)+' ':'')+'Prophecy Egg';
 if(rt==='GOLDEN_EGGS')return fmt(amt)+' GE';
 if(rt==='SOUL_EGGS')return fmt(amt)+' SE';
 if(rt==='ARTIFACT_CASE')return 'תיבת ארטיפקטים';
 if(rt==='EPIC_RESEARCH_ITEM')return 'שדרוג Epic';
 if(rt==='BOOST')return (amt>1?Math.round(amt)+'× ':'')+(g.rewardSubType?getBoostInfo(g.rewardSubType).name:'בוסט');
 if(rt==='PIGGY_FILL')return '+'+fmt(amt)+' Piggy';
 if(rt==='PIGGY_LEVEL_BUMP')return 'רמת Piggy +'+Math.max(1,Math.round(amt));
 if(rt==='SHELL_SCRIPT')return fmt(amt)+' תלושי עיצוב';
 if(rt==='CASH')return 'מזומן';
 return shipName(rt||'פרס');
}

function getContractGoals(c,b){
 var k=c.contract||{};
 var grade=c.grade || (b.contracts && b.contracts.lastGraded) || '';
 if(Array.isArray(k.gradeSpecs) && k.gradeSpecs.length){
  var matched=null;
  if(grade){
   for(var i=0;i<k.gradeSpecs.length;i++){
    if(k.gradeSpecs[i].grade===grade){matched=k.gradeSpecs[i];break}
   }
  }
  var spec=matched || k.gradeSpecs[0];
  if(spec && Array.isArray(spec.goals))return spec.goals;
 }
 if(Array.isArray(k.goalSets) && k.goalSets.length){
  var gs=k.goalSets[c.league||0] || k.goalSets[0];
  if(gs && Array.isArray(gs.goals))return gs.goals;
 }
 return Array.isArray(k.goals)?k.goals:[];
}

function analyzeContractRewards(c,b){
 var goals=getContractGoals(c,b);
 var hasPE=false;
 var peCount=0;
 var items=[];
 goals.forEach(function(g){
  if(g.rewardType==='EGGS_OF_PROPHECY'){
   hasPE=true;
   peCount+=Math.max(1,Math.round(Number(g.rewardAmount)||1));
  }
  items.push(formatRewardItem(g));
 });
 return {hasPE:hasPE,peCount:peCount,rewardsText:items.join(' • ')};
}

 if(isReplay){

 }

 return {

 };

 var urgent=[];

 var ownAmt=c.coopLastUploadedContribution||0;

 var sharedEnd=c.coopSharedEndTime||0;

function getSlotCount(b){
 var sel=$('slots').value;
 if(sel==='1')return 1;
 if(sel==='3')return 3;
 var g=b.game||{};
 return (g.permitLevel===1)?3:1;
}

function detectBestShip(b){
 var sel=$('shipTarget').value;
 var db=b.artifactsDb||{};
 var vafx=(b.virtue&&b.virtue.afx)||{};
 var bestIdx=0;
 var launchCounts={};
 function recordShip(s){
  var i=SHIP_ORDER.indexOf(s);
  if(i>bestIdx)bestIdx=i;
  if(s)launchCounts[s]=(launchCounts[s]||0)+1;
 }
 (db.missionInfos||[]).forEach(function(m){recordShip(m.ship)});
 (db.missionArchive||[]).forEach(function(m){recordShip(m.ship)});
 if(vafx.lastFueledShip){var idx1=SHIP_ORDER.indexOf(vafx.lastFueledShip);if(idx1>bestIdx)bestIdx=idx1;}
 if(db.lastFueledShip){var idx2=SHIP_ORDER.indexOf(db.lastFueledShip);if(idx2>bestIdx)bestIdx=idx2;}

 var target=(sel && sel!=='auto')?sel:(SHIP_ORDER[bestIdx]||'CHICKEN_ONE');
 var tIdx=SHIP_ORDER.indexOf(target);
 var launched=launchCounts[target]||0;
 var req=SHIP_UNLOCK_REQ[target]||0;
 var nextShip=(tIdx>=0 && tIdx<SHIP_ORDER.length-1)?SHIP_ORDER[tIdx+1]:null;
 var preferExtended=(target==='HENERPRISE' || target==='ATREGGIES');
 return {target:target,launched:launched,req:req,nextShip:nextShip,preferExtended:preferExtended};
}

function checkShipFuel(b,sim){
 var shipProg=detectBestShip(b);
 var target=shipProg.target;
 var reqFuels=SHIP_FUELS[target]||['ROCKET_FUEL'];
 var curEgg=sim.eggType||'';
 var db=b.artifactsDb||{};
 var vafx=(b.virtue&&b.virtue.afx)||{};
 var tank=db.tankFuels||vafx.tankFuels||[];
 var onFuelEgg=(reqFuels.indexOf(curEgg)>=0);
 var otherFuels=reqFuels.filter(function(f){return f!==curEgg});
 var hasAllFuelsInTank=reqFuels.every(function(f){
  var idx=EGG_ORDER.indexOf(f);
  return idx>=0 && (tank[idx]||0)>=1e6;
 });
 var hasOtherFuelsInTank=otherFuels.every(function(f){
  var idx=EGG_ORDER.indexOf(f);
  return idx>=0 && (tank[idx]||0)>=1e6;
 });
 var canLaunchNow=(onFuelEgg?hasOtherFuelsInTank:hasAllFuelsInTank);
 var tankTotal=tank.reduce(function(x,y){return x+(y||0)},0);
 var reqNames=reqFuels.map(function(e){return EGG_HE[e]||e}).join(', ');
 return {target:target,shipProg:shipProg,reqFuels:reqFuels,reqNames:reqNames,onFuelEgg:onFuelEgg,hasFuelInTank:hasAllFuelsInTank,canLaunchNow:canLaunchNow,tankTotal:tankTotal,curEggName:EGG_HE[curEgg]||curEgg};
}

function plan(b,R){
 var now=Date.now()/1000,g=b.game||{},sim=homeFarm(b),db=b.artifactsDb||{},slots=getSlotCount(b),runMode=$('run').value,a=[];
 var virt=!!VIRT[sim.eggType];
 var cash=farmCash(sim);
 var peCount=Number(g.eggsOfProphecy||0);
 var elv=lvMap(g.epicResearch);
 var clv=lvMap(sim.commonResearch);
 var art=analyzeArtifacts(b,slots,sim.eggType,peCount);

 var C=commonPlan(R,clv,virt,cash,elv,{shipBottleneck:logi.shipBottleneck,shipUtilPct:logi.shipUtilPct,habPct:logi.habPct});

 h+='<div class="c-box"><div class="c-head"><span>מצב Prestige והאטת התקדמות</span><small>+'+fmt(P.prestigeInfo.unclaimedSE)+' SE ('+P.prestigeInfo.gainPct.toFixed(1)+'%)</small></div>';

 h+='</div>';

 if(P.boostInfo.owned.length){

 }
 h+='</div></details>';

 var mainNames=P.art.setMain.map(function(x){return x.name}).join(' + ');

 var artMismatch=(mainNames && mainNames!==eqNames) || P.art.enlightenmentWarnings.length>0;

 h+='<div style="margin-top:8px">';
 if(P.art.enlightenmentWarnings.length>0){
  h+='<div class="status-banner alert"><b>אזהרת Enlightenment:</b><small>הארטיפקטים '+esc(P.art.enlightenmentWarnings.join(', '))+' אינם פעילים ללא שיבוץ Clarity Stone.</small></div>';
 }
 if(P.art.equipped.length){
  h+='<p><b>מותקן כרגע (כולל אבנים):</b></p>';
  P.art.equipped.forEach(function(x){
   var stHtml=x.stones.length?x.stones.map(function(s){return '<span class="stone-pill">'+esc(s)+'</span>'}).join(''):'<small> (ללא אבנים)</small>';
   h+=row('<b>'+esc(x.baseName)+'</b>',stHtml);

 }else{

 }

 if(P.art.setMain.length)h+='<p style="margin-top:8px"><small><b>סט ראשי (הכנסות/Prestige):</b> '+P.art.setMain.map(function(x){return esc(x.name)}).join(' + ')+'</small></p>';
 if(P.art.setContract.length)h+='<p><small><b>סט לחוזים (Co-op):</b> '+P.art.setContract.map(function(x){return esc(x.name)}).join(' + ')+'</small></p>';
 if(P.art.setResearch.length)h+='<p><small><b>לסבב קניית מחקר יקר:</b> '+P.art.setResearch.map(function(x){return esc(x.name)}).join(' + ')+'</small></p>';
 if(P.art.setDrones.length)h+='<p><small><b>לציד רחפנים (GE):</b> '+P.art.setDrones.map(function(x){return esc(x.name)}).join(' + ')+'</small></p>';
 if(P.art.setDilithium.length){
  var dPct=Math.round((P.art.potentialDilithiumMult-1)*100);
  h+='<p><small><b>סט Dilithium (להרכבה רגע לפני בוסט'+(dPct>0?' • +'+dPct+'% זמן':'')+'):</b> '+P.art.setDilithium.map(function(x){return esc(x.name)}).join(' + ')+'</small></p>';
 }
 if(P.art.looseStones.length){
  h+='<div class="c-box"><small><b>אבנים פנויות בתיק לשיבוץ:</b> '+P.art.looseStones.map(function(x){return esc(x.name)+' ×'+x.qty}).join(', ')+'</small></div>';
 }
 if(P.art.demoteList.length){
  h+='<div class="c-box"><small><b>כפילויות נדירות להורדת דרגה (Demote ל-GE ישיר):</b> '+P.art.demoteList.map(function(x){return esc(x.name)+' (הורד '+x.excess+')'}).join(', ')+'</small></div>';
 }
 h+='<div class="c-box"><small><b>טיפ Crafting:</b> שמור ארטיפקטים רגילים (T1) ואל תפרק אותם — שדרוגם מעלה Crafting XP ל-Legendaries.</small></div>';
 h+='</div></details>';

 // 5. חוזים (זמינים להצטרפות + פעילים)
 var hasHighPriorityAvail=P.availContracts.some(function(x){return x.prio<=2});
 var contractsOpen=(P.activeRunning>0 || hasHighPriorityAvail)?'open':'';
 h+='<details id="sec-contracts" class="card" '+contractsOpen+'><summary class="sum-head"><span>חוזים ('+P.CD.length+' פעילים • '+P.availContracts.length+' זמינים)</span><small>▼</small></summary>';
 h+='<div style="margin-top:8px">';

 if(P.availContracts.length){
  h+='<div class="sec-sub">זמינים להצטרפות (מדורגים לפי סדר עדיפויות)</div>';
  P.availContracts.forEach(function(av,idx){
   h+='<div class="c-box"><div class="c-head"><span><span class="step-num">'+(idx+1)+'</span>'+esc(av.name)+'</span><span class="badge '+av.badgeClass+'">'+esc(av.badgeText)+'</span></div>';
   var meta=[];
   if(av.eggName)meta.push('ביצה: '+av.eggName);
   if(av.maxCoop>0)meta.push('עד '+av.maxCoop+' שחקנים');
   if(av.dur>0)meta.push('משך: '+hrs(av.dur));
   if(av.joinLeft>0)meta.push('זמין עוד: '+hrs(av.joinLeft));
   if(meta.length)h+='<p><small>'+esc(meta.join(' • '))+'</small></p>';
   if(av.rewardsText)h+='<p><small><b>פרסים:</b> '+esc(av.rewardsText)+'</small></p>';
   h+='<p>'+esc(av.adviceText)+'</p>';
   h+='</div>';
  });
 }

 if(P.CD.length){
  if(P.availContracts.length)h+='<div class="sec-sub">חוזים פעילים / ממתינים לסגירה</div>';
  P.CD.forEach(function(d){
   h+='<div class="c-box"><div class="c-head"><span>'+esc(d.name)+'</span><span class="badge '+d.badgeClass+'">'+esc(d.badgeText)+'</span></div>';
   h+='<p><small>קו-אופ: '+esc(d.coop||'ללא')+' • יעדים: '+d.achieved+'/3'+(d.ownAmt>0?' • תרמת: '+fmt(d.ownAmt):'')+'</small></p>';
   if(d.rewardsText)h+='<p><small><b>פרסים:</b> '+esc(d.rewardsText)+'</small></p>';
   h+='<p>'+esc(d.actionText)+'</p>';
   if(d.researchHint)h+='<p><small><b>מחקר בחוזה:</b> '+esc(d.researchHint)+'</small></p>';
   h+='</div>';
  });
 }

 if(!P.availContracts.length && !P.CD.length){
  h+='<small>אין חוזים פתוחים או זמינים להצטרפות כרגע.</small>';
 }
 h+='</div></details>';

 // 6. מחקר אפיק וספינות
 h+='<div id="sec-epic" class="card"><h3>מחקר אפיק וספינות</h3>';
 P.E.rows.slice(0,4).forEach(function(x){
  var canEp=(P.avail>=x.price);
  h+=row('<b>'+esc(x.r.name)+'</b> <small>('+x.L+'/'+x.r.levels+')</small>',canEp?'<span class="tag-ok">'+fmt(x.price)+' GE</span>':'<small>'+fmt(x.price)+' GE</small>');
 });
 h+='<div style="margin-top:8px;padding-top:6px;border-top:1px dashed var(--line)">';
 var sp=P.fuelInfo.shipProg;
 if(sp.nextShip){
  h+='<p><small><b>התקדמות ספינות:</b> '+esc(shipName(sp.target))+' ('+sp.launched+'/'+sp.req+' שיגורים לפתיחת '+esc(shipName(sp.nextShip))+')</small></p>';
 }
 if(P.ships.length){
  P.ships.forEach(function(s){h+=row('🚀 '+esc(s[0]),'<b>'+esc(s[1])+'</b>')});
 }else{
  var mType=sp.preferExtended?'Extended':'Short';
  h+='<small>אין ספינות באוויר. יעד: <b>'+esc(shipName(P.fuelInfo.target))+' ('+mType+')</b> (דלק: '+esc(P.fuelInfo.reqNames)+')</small>';
 }
 h+='</div></div>';

 h+='<details class="card"><summary class="sum-head"><span>אבחון ונתוני חשבון</span><small>▼</small></summary><div style="margin-top:8px">';
 h+=row('Soul Eggs',fmt(P.prestigeInfo.curSE))+row('Prophecy Eggs',fmt(P.g.eggsOfProphecy))+row('תפוסת לולים',fmt(P.logi.pop)+' / '+fmt(P.logi.maxCap))+row('שווי חווה',fmt(P.eggProg.curFV));
 h+='<button class="copy-btn" onclick="copyDiag()">העתק נתוני חווה (ללא EID)</button>';
 h+='</div></details>';
 $('out').innerHTML=h;
}
async function run(silent){
 if(busy)return;var eid=$('eid').value.trim();if(!eid){$('out').innerHTML='<p class="err">הכנס EID</p>';return}
 sset('eid',eid);$('eid-bar').style.display='none';
 busy=true;if(!silent||!last)$('out').innerHTML='<p>טוען...</p>';
 try{var R=await getRes();last=await load(eid);show(last,R);$('sync').textContent='עודכן: '+new Date().toLocaleTimeString('he-IL')+' • גיבוי לפני '+Math.round((Date.now()/1000-(last.approxTime||0))/60)+' דק\''}
 catch(e){$('eid-bar').style.display='flex';if(!last||!silent){$('out').innerHTML='<p class="err">'+esc(e.message||e)+'</p>'}else{$('sync').textContent='הרענון נכשל: '+(e.message||e)}}
 busy=false;
}
$('go').addEventListener('click',function(){run(false)});
$('btn-ref').addEventListener('click',function(){run(false)});
$('btn-eid').addEventListener('click',function(){var b=$('eid-bar');b.style.display=(b.style.display==='none'?'flex':'none')});
['slots','run','shipTarget'].forEach(function(id){var v=sget(id);if(v)$(id).value=v;$(id).addEventListener('change',function(){sset(id,$(id).value);if(last&&RES)show(last,RES)})});
var s=sget('eid');if(s){$('eid').value=s;run(false)}
setInterval(function(){if(!document.hidden&&$('eid').value.trim())run(true)},20000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&$('eid').value.trim())run(true)});
</script></body></html>
