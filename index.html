 var buy=null;if(rows.length){var f=rows[0],n=0,sum=0,L=f.L;while(L<f.r.levels&&sum+f.r.prices[L]<=avail){sum+=f.r.prices[L];L++;n++}buy={row:f,n:n,sum:sum}}

function cgain(r,L,shipBottleneck){
 var p=r.per_level,g;
 if(r.effect_type==='multiplicative'){g=r.levels_compound==='multiplicative'?Math.log(1+p):Math.log((1+p*(L+1))/(1+p*L))}

 if(w===undefined)w=0.1;

 if(shipBottleneck && r.categories==='shipping_capacity')w=2.2;
 return g*w;
}

function commonPlan(R,lv,virt,cash,elv,shipBottleneck){
 var simLv=Object.assign({},lv);
 var cm=R.filter(function(r){return r.type==='common'});
 var labDisc=1-0.05*(elv['cheaper_research']||0);
 if(labDisc<0.1)labDisc=0.1;
 function bought(t){var n=0;cm.forEach(function(r){if(r.tier<=t)n+=simLv[r.id]||0});return n}

 var remCash=(cash!==undefined && cash!==null)?Number(cash):0;
 var startCash=remCash;
 var buyById={};
 var buyOrder=[];
 var totalLevelsBought=0;
 var totalSpent=0;
 var nextOutOfBudget=[];

 for(var step=0;step<2500;step++){
  var best=null;
  for(var i=0;i<cm.length;i++){
   var r=cm[i],L=simLv[r.id]||0;
   if(L>=r.levels)continue;
   if(r.tier>1&&(r.tier-1>=TH.length||bought(r.tier-1)<TH[r.tier-1]))continue;
   var pr=(virt?r.virtue_prices:r.prices)||r.prices;
   var p=(pr[L]||0)*labDisc;
   if(!p)continue;
   var sc=cgain(r,L,shipBottleneck)/p;
   if(!best||sc>best.score)best={r:r,L:L,price:p,score:sc};
  }
  if(!best)break;

  if(remCash>=best.price){
   remCash-=best.price;
   totalSpent+=best.price;
   totalLevelsBought++;
   simLv[best.r.id]=best.L+1;
   if(!buyById[best.r.id]){
    buyById[best.r.id]={r:best.r,from:(lv[best.r.id]||0),to:best.L+1,count:1,cost:best.price,canBuy:true,firstScore:best.score};
    buyOrder.push(buyById[best.r.id]);
   }else{
    buyById[best.r.id].to=best.L+1;
    buyById[best.r.id].count++;
    buyById[best.r.id].cost+=best.price;
   }
  }else{
   simLv[best.r.id]=best.L+1;
   var lastNext=nextOutOfBudget[nextOutOfBudget.length-1];
   if(lastNext && lastNext.r.id===best.r.id){
    lastNext.to=best.L+1;
    lastNext.count++;
    lastNext.cost+=best.price;
   }else{
    if(nextOutOfBudget.length>=5)break;
    nextOutOfBudget.push({r:best.r,from:best.L,to:best.L+1,count:1,cost:best.price,canBuy:false,firstScore:best.score});
   }
  }
 }

 buyOrder.sort(function(a,b){
  if(a.r.tier!==b.r.tier)return a.r.tier-b.r.tier;
  return b.firstScore-a.firstScore;
 });

 return {
  affordableList:buyOrder,
  nextList:nextOutOfBudget,
  totalLevelsBought:totalLevelsBought,
  totalSpent:totalSpent,
  remCash:remCash,
  startCash:startCash
 };
}

// חישוב לולים, משלוחים וזיהוי צוואר בקבוק (Bottleneck)
function calcFarmLogistics(sim,clv,elv,artInfo){
 var pop=(sim.habPopulation||[]).reduce(function(x,y){return x+(y||0)},0);
 var habs=sim.habs||[];
 var emptyHabSlots=0;
 var baseCap=0;
 for(var i=0;i<habs.length;i++){
  var h=habs[i];
  if(h<0 || h===19)emptyHabSlots++;
  else if(h>=0 && h<HAB_BASE.length)baseCap+=HAB_BASE[h];
 }
 if(baseCap===0)baseCap=1000;
 var habMult=1*(1+0.05*(clv['hab_capacity1']||0))*(1+0.05*(clv['microlux']||0))*(1+0.05*(clv['grav_plating']||0));
 if(artInfo && artInfo.gussetMult>1)habMult*=artInfo.gussetMult;
 var maxCap=Math.floor(baseCap*habMult);
 var habPct=maxCap>0?Math.min(100,(pop/maxCap)*100):0;

 // חישוב קצב הטלה (ביצים לדקה) מול קיבולת משלוחים (ביצים לדקה)
 var baseLayPerChicken=2; // 2 ביצים לדקה לתרנגולת בבסיס
 var layMult=1*(1+0.10*(clv['comfy_nests']||0))*(1+0.05*(clv['hen_house_ac']||0))*(1+0.15*(clv['improved_genetics']||0))*(1+0.10*(clv['time_compress']||0))*(1+0.05*(clv['epic_egg_laying']||0))*(1+0.05*(elv['epic_egg_laying']||0));
 var totalLayRate=pop*baseLayPerChicken*layMult;

 var vehs=sim.vehicles||[];
 var emptyVehSlots=0;
 var baseShip=0;
 for(var j=0;j<vehs.length;j++){
  var v=vehs[j];
  if(v<0)emptyVehSlots++;
  else if(v>=0 && v<VEH_BASE.length)baseShip+=VEH_BASE[v];
 }
 var maxVehSlots=4 + (clv['vehicle_reliablity']||0) + (clv['exhen_logistics']||0);
 if(maxVehSlots>17)maxVehSlots=17;
 var unusedVehSlots=Math.max(0,maxVehSlots - vehs.filter(function(x){return x>=0}).length);

 var shipMult=1*(1+0.05*(clv['leafsprings']||0))*(1+0.10*(clv['lightweight_boxes']||0))*(1+0.05*(clv['driver_training']||0))*(1+0.10*(clv['super_alloy']||0))*(1+0.05*(clv['quantum_storage']||0))*(1+0.05*(elv['transportation_lobbyist']||0));
 var totalShipCap=baseShip*shipMult;
 var shipUtilPct=totalShipCap>0?Math.min(120,(totalLayRate/totalShipCap)*100):0;
 var shipBottleneck=(pop>1000 && totalShipCap>0 && totalLayRate>totalShipCap*0.95);

 return {
  pop:pop,maxCap:maxCap,habPct:habPct,nearFull:habPct>=85,isFull:habPct>=97,
  emptyHabSlots:emptyHabSlots,unusedVehSlots:unusedVehSlots,
  totalLayRate:totalLayRate,totalShipCap:totalShipCap,shipUtilPct:shipUtilPct,shipBottleneck:shipBottleneck
 };
}

// חישוב התקדמות לביצה הבאה (Farm Value) + אסטרטגיית תדלוק
function calcEggProgress(b,sim,fuelInfo){
 var curEgg=sim.eggType||'EDIBLE';
 var idx=EGG_ORDER.indexOf(curEgg);
 var nextEgg=(idx>=0 && idx<EGG_ORDER.length-1)?EGG_ORDER[idx+1]:null;
 var reqFV=(idx>=0 && idx+1<EGG_UNLOCK_FV.length)?EGG_UNLOCK_FV[idx+1]:0;
 var curFV=Number(sim.farmValue||0);
 var pct=reqFV>0?Math.min(100,(curFV/reqFV)*100):100;
 var canUpgradeEgg=(nextEgg && curFV>=reqFV && reqFV>0);

 // בדיקה האם הביצה הנוכחית היא ביצת דלק נחוצה לספינות שמיכל הדלק שלה לא מלא
 var isFuelEggForShip=(fuelInfo.reqFuels.indexOf(curEgg)>=0);
 var shouldFillTankFirst=(isFuelEggForShip && !fuelInfo.hasFuelInTank);

 return {
  curEgg:curEgg,curName:EGG_HE[curEgg]||curEgg,
  nextEgg:nextEgg,nextName:nextEgg?(EGG_HE[nextEgg]||nextEgg):null,
  curFV:curFV,reqFV:reqFV,pct:pct,canUpgradeEgg:canUpgradeEgg,
  shouldFillTankFirst:shouldFillTankFirst
 };
}

 var gainPct=(curSE>0 && unclaimedSE>0)?((unclaimedSE/curSE)*100):0;

 // בדיקת סוף שבוע (שבת = 6 ב-JS) לאסטרטגיית 2x Prestige

 }else if(hab.isFull && !hasAffordableResearch){

  }else{

   reason='הלולים מלאים ('+hab.habPct.toFixed(0)+'%). הפעלת Bird Feed + Soul Beacon ל-10 דקות עם תרנגולות רצות תכפיל את ה-Soul Eggs לפני Prestige.';

 }else if(gainPct>=50 && !hasAffordableResearch){

  reason='צברת '+fmt(unclaimedSE)+' Soul Eggs חדשים וההתקדמות בריצה הנוכחית האטה.';
 }else{
  reason=unclaimedSE>0?('נצבר בריצה: +'+fmt(unclaimedSE)+' SE'+(gainPct>0?' (+'+gainPct.toFixed(1)+'%)':'')+'. המשך לשדרג מחקרים ולמלא לולים.'):'שדרג מחקרים ומלא לולים כדי לצבור Soul Eggs.';

 return {curSE:curSE,unclaimedSE:unclaimedSE,gainPct:gainPct,status:status,title:title,reason:reason,isWeekend:isWeekend};
}

function analyzeArtifacts(b,slots){
 var db=b.artifactsDb||{};
 var inv=db.inventoryItems||[];
 var byId={};
 inv.forEach(function(it){byId[it.itemId]=it});

 var sets=db.activeArtifactSets||[];
 var homeSet=(sets[0]&&sets[0].slots)||[];
 var maxArtSlots=(slots===3)?4:2;
 var equipped=[];
 var gussetMult=1;
 for(var i=0;i<maxArtSlots;i++){
  var sl=homeSet[i];
  if(sl && sl.occupied && byId[sl.itemId]){
   var it=byId[sl.itemId];
   var sp=(it.artifact&&it.artifact.spec)||{};
   var info=ART_INFO[sp.name]||{name:shipName(sp.name),role:'other',desc:''};
   var tLabel=TIER_MAP[sp.level]||sp.level||'';
   equipped.push({itemId:it.itemId,rawName:sp.name,name:info.name+' ('+tLabel+')',role:info.role,desc:info.desc});
   if(sp.name==='ORNATE_GUSSET' && GUSSET_MULT[sp.level])gussetMult=Math.max(gussetMult,GUSSET_MULT[sp.level]);
  }
 }

 var bestOwned={};
 inv.forEach(function(it){
  if((it.quantity||0)<=0)return;
  var sp=(it.artifact&&it.artifact.spec)||{};
  var rank=TIER_RANK[sp.level]||0;
  if(!bestOwned[sp.name] || rank>bestOwned[sp.name].rank){
   var info=ART_INFO[sp.name]||{name:shipName(sp.name),role:'other',desc:''};
   bestOwned[sp.name]={rawName:sp.name,name:info.name+' ('+(TIER_MAP[sp.level]||'')+')',rank:rank,qty:it.quantity,desc:info.desc};
  }
 });

 function pickSet(priorityList){
  var res=[];
  for(var i=0;i<priorityList.length;i++){
   var k=priorityList[i];
   if(bestOwned[k] && res.length<maxArtSlots)res.push(bestOwned[k]);
  }
  return res;
 }
 var setMain=pickSet(['PHOENIX_FEATHER','BOOK_OF_BASAN','DEMETERS_NECKLACE','TUNGSTEN_ANKH','VIAL_MARTIAN_DUST']);
 var setResearch=pickSet(['PUZZLE_CUBE','DEMETERS_NECKLACE','TUNGSTEN_ANKH']);
 var setDrones=pickSet(['AURELIAN_BROOCH','NEODYMIUM_MEDALLION','BEAK_OF_MIDAS','DEMETERS_NECKLACE']);

 var consumeList=[];
 inv.forEach(function(it){
  var sp=(it.artifact&&it.artifact.spec)||{};
  var qty=it.quantity||0;
  var isMat=(sp.name.indexOf('METEORITE')>=0 || sp.name.indexOf('GEODE')>=0 || sp.name.indexOf('TITANIUM')>=0 || sp.name.indexOf('FRAGMENT')>=0 || sp.name.indexOf('STONE')>=0);
  if(!isMat && sp.level==='INFERIOR' && qty>15){
   var info=ART_INFO[sp.name]||{name:shipName(sp.name)};
   consumeList.push({name:info.name+' (T1)',qty:qty,excess:qty-10});
  }
 });

 return {equipped:equipped,maxArtSlots:maxArtSlots,gussetMult:gussetMult,setMain:setMain,setResearch:setResearch,setDrones:setDrones,consumeList:consumeList};
}

function analyzeBoosts(b,sim,slots,hab,prestigeInfo,hasAffordableResearch){
 var g=b.game||{};
 var maxBoostSlots=(slots===3)?5:2;

 var active=(sim.activeBoosts||[]).filter(function(ab){
  return (ab.timeRemaining||0) > 0;
 }).map(function(ab){

  return {id:ab.boostId,name:info.name,timeRemaining:ab.timeRemaining};
 });

 var owned=[];
 (g.boosts||[]).forEach(function(bo){
  if((bo.count||0)>0){
   var info=BOOST_CAT[bo.id]||{name:shipName(bo.id),cat:'other',power:1};
   owned.push({id:bo.id,count:bo.count,name:info.name,cat:info.cat,power:info.power});
  }
 });

 function bestByCat(cat){
  var list=owned.filter(function(x){return x.cat===cat});

 }

 var bestFeed=bestByCat('feed');

 if(active.length>0){

 }else if(prestigeInfo.status==='boost_then_prestige' && (bestFeed || bestSoul)){

 }else if(hab.habPct<40 && bestTachyon && !hasAffordableResearch){

  recCombo.push(bestTachyon);
  recTitle='אפשר להפעיל Tachyon Prism למילוי לולים';
  recReason='הלולים ב-'+hab.habPct.toFixed(0)+'% תפוסה. הגדלת כמות התרנגולות תאיץ הכנסות ו-Soul Eggs.';
 }else if(!hasAffordableResearch && hab.habPct>=40 && hab.habPct<95 && bestFeed){
  shouldUseNow=true;
  recCombo.push(bestFeed);
  if(bestBeacon && recCombo.length<maxBoostSlots)recCombo.push(bestBeacon);
  recTitle='אפשר להפעיל בוסט הכנסות לפתיחת מחקר';
  recReason='המחקר הבא יקר מהמזומן הפנוי — בוסט הכנסות יקפיץ את התקציב.';
 }

 return {maxBoostSlots:maxBoostSlots,active:active,owned:owned,shouldUseNow:shouldUseNow,recCombo:recCombo,recTitle:recTitle,recReason:recReason};
}

 return {

function detectBestShip(b){
 var sel=$('shipTarget').value;
 if(sel && sel!=='auto')return sel;
 var db=b.artifactsDb||{};
 var vafx=(b.virtue&&b.virtue.afx)||{};
 var bestIdx=0;
 var launchCounts={};
 function recordShip(s){
  var i=SHIP_ORDER.indexOf(s);
  if(i>bestIdx)bestIdx=i;
  if(s)launchCounts[s]=(launchCounts[s]||0)+1;
 }
 (db.missionInfos||[]).forEach(function(m){recordShip(m.ship)});
 (db.missionArchive||[]).forEach(function(m){recordShip(m.ship)});
 if(vafx.lastFueledShip){var idx1=SHIP_ORDER.indexOf(vafx.lastFueledShip);if(idx1>bestIdx)bestIdx=idx1;}
 if(db.lastFueledShip){var idx2=SHIP_ORDER.indexOf(db.lastFueledShip);if(idx2>bestIdx)bestIdx=idx2;}

 var target=SHIP_ORDER[bestIdx]||'CHICKEN_ONE';
 var launched=launchCounts[target]||0;
 var req=SHIP_UNLOCK_REQ[target]||0;
 var nextShip=(bestIdx<SHIP_ORDER.length-1)?SHIP_ORDER[bestIdx+1]:null;
 return {target:target,launched:launched,req:req,nextShip:nextShip};
}

function plan(b,R){
 var now=Date.now()/1000,g=b.game||{},sim=homeFarm(b),db=b.artifactsDb||{},slots=getSlotCount(b),runMode=$('run').value,a=[];
 var virt=!!VIRT[sim.eggType];
 var cash=farmCash(sim);
 var elv=lvMap(g.epicResearch);
 var clv=lvMap(sim.commonResearch);
 var art=analyzeArtifacts(b,slots);
 var logi=calcFarmLogistics(sim,clv,elv,art);
 var C=commonPlan(R,clv,virt,cash,elv,logi.shipBottleneck);
 var hasAffordableResearch=(C.affordableList.length>0);
 var fuelInfo=checkShipFuel(b,sim);
 var eggProg=calcEggProgress(b,sim,fuelInfo);
 var prestigeInfo=calcPrestigeInfo(b,sim,logi,hasAffordableResearch,eggProg);
 var boostInfo=analyzeBoosts(b,sim,slots,logi,prestigeInfo,hasAffordableResearch);

 var run=runMode;
 if(run==='auto'){
  if(prestigeInfo.status==='ready')run='ready';
  else if(logi.pop<5000 && Object.keys(clv).length<15)run='start';
  else run='mid';
 }

 var ships=[],ready=0,busy2=0;
 (db.missionInfos||[]).forEach(function(m){var s=m.status,end=(m.startTimeDerived||0)+(m.durationSeconds||0),left=end-now,txt;
  if(s==='RETURNED'||s==='ANALYZING'){ready++;busy2++;txt='חזרה - לאסוף'}
  else if(s==='EXPLORING'){busy2++;if(left<=0){ready++;txt='חזרה - לאסוף'}else{var h=Math.floor(left/3600),mi=Math.floor((left%3600)/60);txt='עוד '+h+' ש\' ו-'+mi+' ד\''}}
  else if(s==='FUELING'||s==='PREPARE_TO_LAUNCH'){busy2++;txt=s==='FUELING'?'בתדלוק':'מוכנה לשיגור'}else return;
  ships.push([shipName(m.ship)+' ('+String(m.durationType||'').toLowerCase()+')',txt])});
 var free=Math.max(0,slots-busy2);

 if((g.unclaimedEggsOfProphecy||0)>0||(g.uncliamedGoldenEggs||0)>0)a.push([5,'אסוף ביצים שממתינות בחווה','Prophecy או Golden Eggs מוכנות לאיסוף.']);

 // התראת שדרוג ביצה הבאה (או תדלוק מיכל דלק לפני שדרוג)
 if(eggProg.canUpgradeEgg){
  if(eggProg.shouldFillTankFirst){
   a.push([10,'מלא מיכל דלק ('+eggProg.curName+') לפני שתעבור ל-'+eggProg.nextName,'הביצה הבאה פתוחה! מלא קודם את מיכל הדלק לספינות ואז שדרג ביצה.']);
  }else{
   a.push([11,'שדרג לביצה הבאה: '+eggProg.nextName,'שווי החווה הגיע ליעד! מעבר ביצה יכפיל את ההכנסות שלך.']);
  }
 }

 // התראת צוואר בקבוק במשלוחים
 if(logi.shipBottleneck){
  a.push([15,'צוואר בקבוק במשלוחים ('+logi.shipUtilPct.toFixed(0)+'%) — קנה/שדרג משאיות','אתה מייצר יותר ביצים ממה שהמשאיות מסוגלות לפנות! קנה משאית חדשה או שדרג מחקרי משלוחים.','research']);
 }

 // התראת מקומות ריקים ללולים או רכבים
 if(logi.emptyHabSlots>0 && cash>500){
  a.push([16,'יש לך '+logi.emptyHabSlots+' מקומות ריקים ללולים — בנה לול נוסף','הגדלת מספר הלולים תכפיל את קצב גדילת התרנגולות (Internal Hatchery).']);
 }
 if(logi.unusedVehSlots>0 && logi.shipUtilPct>75 && cash>500){
  a.push([17,'יש לך '+logi.unusedVehSlots+' מקומות פנויים לרכבים — הוסף משאית','הוספת משאית תמנע סתימה במשלוחים.']);
 }

 if(ready>0)a.push([18,'אסוף '+ready+' ספינות שחזרו','פנה מקום לשיגור המשימה הבאה.']);

 if(C.affordableList.length>0){
  var top3=C.affordableList.slice(0,3).map(function(x){return x.r.name+' ← '+x.to}).join(' • ');
  var moreTxt=C.affordableList.length>3?(' (+'+(C.affordableList.length-3)+' נוספים)'):'';
  a.push([19,'שדרג מחקרים ('+C.totalLevelsBought+' רמות ב-'+C.affordableList.length+' מחקרים)',top3+moreTxt,'research']);
 }

 var mainNames=art.setMain.map(function(x){return x.name}).join(' + ');
 var eqNames=art.equipped.map(function(x){return x.name}).join(' + ');
 if(mainNames && mainNames!==eqNames){
  a.push([21,'הרכב סט ארטיפקטים ראשי: '+mainNames,'מותקן כרגע: '+(eqNames||'כלום')+'.','artifacts']);
 }

 if(free>0){
  if(fuelInfo.onFuelEgg || fuelInfo.hasFuelInTank){
   var progTxt=fuelInfo.shipProg.nextShip?(' ('+fuelInfo.shipProg.launched+'/'+fuelInfo.shipProg.req+' לפתיחת '+shipName(fuelInfo.shipProg.nextShip)+')'):'';
   a.push([22,'שגר ספינת '+shipName(fuelInfo.target)+' (Short)','דלק זמין ('+fuelInfo.reqNames+')'+progTxt+'.']);
  }else{
   a.push([68,'ספינה פנויה ('+shipName(fuelInfo.target)+') — אין דלק כרגע','נדרשת ביצת '+fuelInfo.reqNames+' (כרגע על '+fuelInfo.curEggName+').']);
  }
 }

 if(prestigeInfo.status==='ready' || run==='ready'){

  a.push([14,'לפני Prestige: הפעל '+comboStr,prestigeInfo.reason,'boosts']);

 var cs=(b.contracts&&b.contracts.contracts)||[];

 var activeRunning=CD.filter(function(d){return !d.waitingCoop});
 var rewardContracts=activeRunning.filter(function(d){return !d.pointsOnly});
 var pointsContracts=activeRunning.filter(function(d){return d.pointsOnly});
 var waitingContracts=CD.filter(function(d){return d.waitingCoop});

 if(activeRunning.length===0){
  a.push([30,'בדוק חוזים חדשים להצטרפות','אין כרגע חוזה פעיל שרץ. בדוק בלשונית Contracts.','contracts']);
 }
 CD.forEach(function(d){d.urgent.forEach(function(u){a.push(u)})});

 if(rewardContracts.length>0){
  a.push([32,'טפל ב-'+rewardContracts.length+' חוזי פרסים פעילים','טרם הושגו כל הפרסים.','contracts']);
 }else if(pointsContracts.length>0){
  a.push([58,'חוזים לנקודות בלבד ('+pointsContracts.length+')','כל הפרסים כבר הושגו.','contracts']);
 }else if(waitingContracts.length>0){
  a.push([75,'חוזים ממתינים לסגירת קבוצה ('+waitingContracts.length+')','סיימת ואספת הכל.','contracts']);
 }

 var avail=(g.goldenEggsEarned||0)-(g.goldenEggsSpent||0);
 var E=epicPlan(R,elv,avail);
 if(E.buy){var f=E.buy.row;if(E.buy.n>0)a.push([24,'מחקר אפיק: שדרג '+f.r.name+' (+'+E.buy.n+' רמות)','עלות '+fmt(E.buy.sum)+' GE מתוך '+fmt(avail)+' פנויות.'+(prestigeInfo.isWeekend?' (טיפ: בימי ראשון יש לעיתים הנחת 35% על Epic!)':'')]);else a.push([66,'מחקר אפיק: חסוך ל-'+f.r.name,'חסרות '+fmt(f.price-avail)+' GE (עולה '+fmt(f.price)+').'])}

 if(C.affordableList.length===0 && C.nextList.length>0){
  var nx=C.nextList[0];
  a.push([45,'המחקר הבא: '+nx.r.name+' (לרמה '+nx.to+')','עלות '+fmt(nx.cost)+' (יש כרגע '+fmt(cash)+').','research']);
 }

 var gift=g.nextDailyGiftTime||0;if(gift>1e12)gift/=1000;if(gift>0&&gift<now)a.push([20,'אסוף את המתנה היומית','לחץ על אייקון המתנה בצד.']);

   h+='<p><small>קו-אופ: '+esc(d.coop||'ללא')+' • יעדים: '+d.achieved+'/3'+(d.ownAmt>0?' • תרמת: '+fmt(d.ownAmt):'')+'</small></p>';
   h+='<p>'+esc(d.actionText)+'</p>';
   if(d.researchHint)h+='<p><small><b>מחקר בחוזה:</b> '+esc(d.researchHint)+'</small></p>';
   h+='</div>';
  });
 }else{
  h+='<small>אין חוזים פתוחים כרגע.</small>';
 }
 h+='</div></details>';

 // 6. מחקר אפיק וספינות
 h+='<div id="sec-epic" class="card"><h3>מחקר אפיק וספינות</h3>';
 P.E.rows.slice(0,4).forEach(function(x){
  var canEp=(P.avail>=x.price);
  h+=row('<b>'+esc(x.r.name)+'</b> <small>('+x.L+'/'+x.r.levels+')</small>',canEp?'<span class="tag-ok">'+fmt(x.price)+' GE</span>':'<small>'+fmt(x.price)+' GE</small>');
 });
 h+='<div style="margin-top:8px;padding-top:6px;border-top:1px dashed var(--line)">';
 var sp=P.fuelInfo.shipProg;
 if(sp.nextShip){
  h+='<p><small><b>התקדמות ספינות:</b> '+esc(shipName(sp.target))+' ('+sp.launched+'/'+sp.req+' שיגורים לפתיחת '+esc(shipName(sp.nextShip))+')</small></p>';
 }
 if(P.ships.length){
  P.ships.forEach(function(s){h+=row('🚀 '+esc(s[0]),'<b>'+esc(s[1])+'</b>')});
 }else{
  h+='<small>אין ספינות באוויר. יעד: <b>'+esc(shipName(P.fuelInfo.target))+'</b> (דלק: '+esc(P.fuelInfo.reqNames)+')</small>';
 }
 h+='</div></div>';

 h+='<details class="card"><summary class="sum-head"><span>אבחון ונתוני חשבון</span><small>▼</small></summary><div style="margin-top:8px">';
 h+=row('Soul Eggs',fmt(P.prestigeInfo.curSE))+row('Prophecy Eggs',fmt(P.g.eggsOfProphecy))+row('תפוסת לולים',fmt(P.logi.pop)+' / '+fmt(P.logi.maxCap))+row('שווי חווה',fmt(P.eggProg.curFV));
 h+='<button class="copy-btn" onclick="copyDiag()">העתק נתוני חווה (ללא EID)</button>';
 h+='</div></details>';
 $('out').innerHTML=h;
}
async function run(silent){
 if(busy)return;var eid=$('eid').value.trim();if(!eid){$('out').innerHTML='<p class="err">הכנס EID</p>';return}
 sset('eid',eid);$('eid-bar').style.display='none';
 busy=true;if(!silent||!last)$('out').innerHTML='<p>טוען...</p>';
 try{var R=await getRes();last=await load(eid);show(last,R);$('sync').textContent='עודכן: '+new Date().toLocaleTimeString('he-IL')+' • גיבוי לפני '+Math.round((Date.now()/1000-(last.approxTime||0))/60)+' דק\''}
 catch(e){$('eid-bar').style.display='flex';if(!last||!silent){$('out').innerHTML='<p class="err">'+esc(e.message||e)+'</p>'}else{$('sync').textContent='הרענון נכשל: '+(e.message||e)}}
 busy=false;
}
$('go').addEventListener('click',function(){run(false)});
$('btn-ref').addEventListener('click',function(){run(false)});
$('btn-eid').addEventListener('click',function(){var b=$('eid-bar');b.style.display=(b.style.display==='none'?'flex':'none')});
['slots','run','shipTarget'].forEach(function(id){var v=sget(id);if(v)$(id).value=v;$(id).addEventListener('change',function(){sset(id,$(id).value);if(last&&RES)show(last,RES)})});
var s=sget(eid);if(s){$('eid').value=s;run(false)}
setInterval(function(){if(!document.hidden&&$('eid').value.trim())run(true)},20000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&$('eid').value.trim())run(true)});
</script></body></html>
