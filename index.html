 ORNATE_GUSSET:{name:'Ornate Gusset',role:'hab',desc:'מגדיל קיבולת לולים'},
 THE_CHALICE:{name:'The Chalice',role:'ihr',desc:'מאיץ קצב דגירה פנימי'},

 DILITHIUM_MONOCLE:{name:'Dilithium Monocle',role:'boost',desc:'מחזק אפקט של בוסטים'},

};
var GUSSET_MULT={INFERIOR:1.05,LESSER:1.10,NORMAL:1.15,GREATER:1.20};

var SUF=['','K','M','B','T','q','Q','s','S','o','N','d','U','D','Td','qd','Qd','sd','Sd','Od','Nd','V','uV','dV','tV','qV','QV','sV','SV','OV','NV','Tg'];
function fmt(n){n=Number(n)||0;if(!isFinite(n))return '∞';if(n<0)n=0;var i=0;while(n>=1000&&i<SUF.length-1){n/=1000;i++}return (i?n.toFixed(2):Math.round(n))+SUF[i]}
function esc(s){return String(s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split('"').join('&quot;')}
function $(id){return document.getElementById(id)}
function sget(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sset(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var root=null,RES=null,last=null,busy=false;
async function getRoot(){if(root)return root;var t=await (await fetch(PROTO)).text();root=protobuf.parse(t,{keepCase:false}).root;return root}
async function getRes(){if(RES)return RES;RES=await (await fetch(RES_URL)).json();return RES}
async function post(b64,enc){return fetch('/proxy',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+(enc?encodeURIComponent(b64):b64)})}
async function load(eid){
 var R=await getRoot();var Req=R.lookupType('ei.EggIncFirstContactRequest');var Res=R.lookupType('ei.EggIncFirstContactResponse');
 var msg=Req.create({rinfo:{eiUserId:'',clientVersion:72,version:'1.35.7',build:'111343',platform:'IOS'},eiUserId:eid.indexOf('mk2!')===0?eid.slice(4):eid,deviceId:'wasmegg',clientVersion:72,platform:1});
 var bytes=Req.encode(msg).finish();var bin='';for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);var b64=btoa(bin);
 var r=await post(b64,false);if(!r.ok)r=await post(b64,true);
 var txt=await r.text();if(!r.ok)throw new Error('השרת של המשחק החזיר שגיאה ('+r.status+')');
 var raw=atob(txt.trim());var u=new Uint8Array(raw.length);for(var j=0;j<raw.length;j++)u[j]=raw.charCodeAt(j);
 var o=Res.toObject(Res.decode(u),{longs:Number,enums:String,defaults:false});
 if(!o.backup)throw new Error('לא נמצא חשבון עם ה-EID הזה');
 return o.backup;
}
var TH=[0,30,80,160,280,400,520,650,800,980,1185,1390,1655];
function homeFarm(b){var f=b.farms||[];for(var i=0;i<f.length;i++){if(f[i].farmType==='HOME')return f[i]}return f[0]||b.sim||{}}

// חישוב מדויק של מזומן בחווה (בפרוטובאף המזומן הוא cashEarned - cashSpent)
function farmCash(f){
 if(!f)return 0;
 if(typeof f.cash==='number' && f.cash>0)return f.cash;
 var earned=Number(f.cashEarned)||0;
 var spent=Number(f.cashSpent)||0;
 return Math.max(0,earned-spent);
}

function lvMap(arr){var m={};(arr||[]).forEach(function(r){m[r.id]=r.level||0});return m}
function epicPlan(R,lv,avail){
 var ep=R.filter(function(r){return r.type==='epic'}).filter(function(r){return (lv[r.id]||0)<r.levels});
 ep.sort(function(a,b){var x=PRI.indexOf(a.id),y=PRI.indexOf(b.id);if(x<0)x=999;if(y<0)y=999;if(x!==y)return x-y;return a.prices[lv[a.id]||0]-b.prices[lv[b.id]||0]});
 var rows=ep.map(function(r){var L=lv[r.id]||0;var left=0;for(var i=L;i<r.levels;i++)left+=r.prices[i];return {r:r,L:L,price:r.prices[L],left:left}});
 var buy=null;if(rows.length){var f=rows[0],n=0,sum=0,L=f.L;while(L<f.r.levels&&sum+f.r.prices[L]<=avail){sum+=f.r.prices[L];L++;n++}buy={row:f,n:n,sum:sum}}
 return {rows:rows,buy:buy};
}
function cgain(r,L){var p=r.per_level,g;if(r.effect_type==='multiplicative'){g=r.levels_compound==='multiplicative'?Math.log(1+p):Math.log((1+p*(L+1))/(1+p*L))}else{g=p/(1+p*L+(p<1?1:10))}var w=W[r.categories];return g*(w===undefined?0.1:w)}

function commonPlan(R,lv,virt,cash,elv){
 var simLv=Object.assign({},lv);
 var cm=R.filter(function(r){return r.type==='common'});
 var labDisc=1-0.05*(elv['cheaper_research']||0);
 if(labDisc<0.1)labDisc=0.1;
 function bought(t){var n=0;cm.forEach(function(r){if(r.tier<=t)n+=simLv[r.id]||0});return n}
 var batches=[];
 var remCash=(cash!==undefined && cash!==null)?Number(cash):null;

 for(var step=0;step<400;step++){
  var best=null;
  for(var i=0;i<cm.length;i++){
   var r=cm[i],L=simLv[r.id]||0;
   if(L>=r.levels)continue;
   if(r.tier>1&&(r.tier-1>=TH.length||bought(r.tier-1)<TH[r.tier-1]))continue;
   var pr=(virt?r.virtue_prices:r.prices)||r.prices;
   var p=(pr[L]||0)*labDisc;
   if(!p)continue;
   var sc=cgain(r,L)/p;
   if(!best||sc>best.score)best={r:r,L:L,price:p,score:sc};
  }
  if(!best)break;
  var canBuyNow=(remCash===null)?true:(remCash>=best.price);
  if(remCash!==null && canBuyNow)remCash-=best.price;

  simLv[best.r.id]=best.L+1;
  var lastB=batches[batches.length-1];
  if(lastB && lastB.r.id===best.r.id && lastB.canBuy===canBuyNow){
   lastB.to=best.L+1;
   lastB.count++;
   lastB.cost+=best.price;
  }else{
   if(batches.length>=12)break;
   batches.push({r:best.r,from:best.L,to:best.L+1,count:1,cost:best.price,canBuy:canBuyNow,score:best.score});
  }
 }
 return batches;
}

// חישוב קיבולת לולים ותפוסה אמיתית בחווה
function calcHabInfo(sim,clv,artInfo){
 var pop=(sim.habPopulation||[]).reduce(function(x,y){return x+(y||0)},0);
 var habs=sim.habs||[];
 var baseCap=0;
 for(var i=0;i<habs.length;i++){
  var h=habs[i];
  if(h>=0 && h<HAB_BASE.length)baseCap+=HAB_BASE[h];
 }
 if(baseCap===0)baseCap=1000;
 // מכפילים ממחקר רגיל של קיבולת לולים
 var mult=1;
 mult*=(1 + 0.05*(clv['hab_capacity1']||0));
 mult*=(1 + 0.05*(clv['microlux']||0));
 mult*=(1 + 0.05*(clv['grav_plating']||0));
 // מכפיל מארטיפקט Ornate Gusset אם מותקן
 if(artInfo && artInfo.gussetMult>1)mult*=artInfo.gussetMult;
 var maxCap=Math.floor(baseCap*mult);
 var pct=maxCap>0?Math.min(100,(pop/maxCap)*100):0;
 return {pop:pop,maxCap:maxCap,pct:pct,nearFull:pct>=85,isFull:pct>=98};
}

function analyzeArtifacts(b,slots){
 var db=b.artifactsDb||{};
 var inv=db.inventoryItems||[];
 var byId={};
 inv.forEach(function(it){byId[it.itemId]=it});

 // מותקנים כרגע בחווה הראשית (set 0)
 var sets=db.activeArtifactSets||[];
 var homeSet=(sets[0]&&sets[0].slots)||[];
 var maxArtSlots=(slots===3)?4:2;
 var equipped=[];
 var gussetMult=1;
 for(var i=0;i<maxArtSlots;i++){
  var sl=homeSet[i];
  if(sl && sl.occupied && byId[sl.itemId]){
   var it=byId[sl.itemId];
   var sp=(it.artifact&&it.artifact.spec)||{};
   var info=ART_INFO[sp.name]||{name:shipName(sp.name),role:'other',desc:''};
   var tLabel=TIER_MAP[sp.level]||sp.level||'';
   equipped.push({itemId:it.itemId,rawName:sp.name,name:info.name+' ('+tLabel+')',role:info.role,desc:info.desc});
   if(sp.name==='ORNATE_GUSSET' && GUSSET_MULT[sp.level])gussetMult=Math.max(gussetMult,GUSSET_MULT[sp.level]);
  }
 }

 // בחירת הפריט הטוב ביותר מכל סוג שקיים בתיק (כמות > 0)
 var bestOwned={};
 inv.forEach(function(it){
  if((it.quantity||0)<=0)return;
  var sp=(it.artifact&&it.artifact.spec)||{};
  var rank=TIER_RANK[sp.level]||0;
  if(!bestOwned[sp.name] || rank>bestOwned[sp.name].rank){
   var info=ART_INFO[sp.name]||{name:shipName(sp.name),role:'other',desc:''};
   bestOwned[sp.name]={rawName:sp.name,name:info.name+' ('+(TIER_MAP[sp.level]||'')+')',rank:rank,qty:it.quantity,desc:info.desc};
  }
 });

 // בניית סטים מומלצים מתוך מה שבאמת יש בתיק (לפי maxArtSlots)
 function pickSet(priorityList){
  var res=[];
  for(var i=0;i<priorityList.length;i++){
   var k=priorityList[i];
   if(bestOwned[k] && res.length<maxArtSlots)res.push(bestOwned[k]);
  }
  return res;
 }
 var setResearch=pickSet(['PUZZLE_CUBE','DEMETERS_NECKLACE','TUNGSTEN_ANKH','VIAL_MARTIAN_DUST']);
 var setEarnings=pickSet(['DEMETERS_NECKLACE','TUNGSTEN_ANKH','VIAL_MARTIAN_DUST','LUNAR_TOTEM']);
 var setDrones=pickSet(['AURELIAN_BROOCH','NEODYMIUM_MEDALLION','BEAK_OF_MIDAS','DEMETERS_NECKLACE']);
 var setPrestige=pickSet(['PHOENIX_FEATHER','BOOK_OF_BASAN','DEMETERS_NECKLACE','TUNGSTEN_ANKH']);

 // בדיקת Craft זמין מתוך artifactStatus
 var craftable=[];
 (db.artifactStatus||[]).forEach(function(st){
  if(st.craftable){
   var sp=st.spec||{};
   var info=ART_INFO[sp.name]||{name:shipName(sp.name),desc:''};
   craftable.push({rawName:sp.name,name:info.name+' ('+(TIER_MAP[sp.level]||'')+')',desc:info.desc});
  }
 });

 // בדיקת עודפי T1 לפירוק (Consume) - רק פריטי T1 שאינם אבנים/מטאוריטים שיש מהם מעל 15 יחידות
 var consumeList=[];
 inv.forEach(function(it){
  var sp=(it.artifact&&it.artifact.spec)||{};
  var qty=it.quantity||0;
  var isMat=(sp.name.indexOf('METEORITE')>=0 || sp.name.indexOf('GEODE')>=0 || sp.name.indexOf('TITANIUM')>=0 || sp.name.indexOf('FRAGMENT')>=0 || sp.name.indexOf('STONE')>=0);
  if(!isMat && sp.level==='INFERIOR' && qty>15){
   var info=ART_INFO[sp.name]||{name:shipName(sp.name)};
   consumeList.push({name:info.name+' (T1)',qty:qty,keep:10,excess:qty-10});
  }
 });

 return {equipped:equipped,maxArtSlots:maxArtSlots,gussetMult:gussetMult,setResearch:setResearch,setEarnings:setEarnings,setDrones:setDrones,setPrestige:setPrestige,craftable:craftable,consumeList:consumeList};
}

function shipName(s){return String(s||'').split('_').map(function(w){return w.charAt(0)+w.slice(1).toLowerCase()}).join(' ')}
function cleanContractName(id){return String(id||'חוזה').split('-').map(function(w){return w.charAt(0).toUpperCase()+w.slice(1)}).join(' ')}
function hrs(sec){if(sec<=0)return '0 דקות';var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);return h>=48?Math.round(h/24)+' ימים':h+' שעות ו-'+m+' דקות'}

function contractInfo(c,b,R,elv,now){
 var k=c.contract||{},id=c.contractIdentifier||k.identifier||'';
 var name=k.name||cleanContractName(id);
 var urgent=[];
 var achieved=c.numGoalsAchieved||0;
 var isReplay=!!c.pointsReplay;
 var ownAmt=c.coopLastUploadedContribution||0;
 var lastRewAmt=c.lastAmountWhenRewardGiven||0;
 var simEnd=c.coopSimulationEndTime||0;
 var graceEnd=c.coopGracePeriodEndTime||0;
 var sharedEnd=c.coopSharedEndTime||0;

 var waitingCoop=(simEnd>0);
 var pointsOnly=(isReplay || achieved>=3);

 var statusType='rewards';
 var badgeText='פרסים זמינים';
 var badgeClass='b-rew';

 if(waitingCoop){
  statusType='waiting';
  badgeText='ממתין לסגירת הקבוצה';
  badgeClass='b-wait';
 }else if(pointsOnly){
  statusType='points';
  badgeText=isReplay?'חוזה חוזר (נקודות)':'כל היעדים הושגו (נקודות)';
  badgeClass='b-pts';
 }

 var actionText='';
 if(!c.coopIdentifier){
  actionText='עדיין לא הצטרפת לקו-אופ. היכנס ללשונית Contracts והצטרף לקבוצה.';
  if(!pointsOnly)urgent.push([28,'הצטרף לקו-אופ בחוזה '+name,'החוזה פעיל ויש בו פרסים, אבל אינך בקו-אופ.','contracts']);
 }else if(waitingCoop){
  var graceLeft=graceEnd>now?(graceEnd-now):0;
  actionText='סיימת את חלקך ואספת את הפרסים! ממתינים שחברי הקבוצה יתחברו ויסגרו אצלם'+(graceLeft>0?' (ייסגר אוטומטית בעוד '+hrs(graceLeft)+')':'.')+'. אין צורך לעשות כלום.';
 }else if(pointsOnly){
  var timeLeft=sharedEnd>now?(sharedEnd-now):0;
  actionText='כל 3 היעדים בחוזה הושגו ('+achieved+'/3). החוזה רץ כעת לנקודות דירוג בלבד'+(timeLeft>0?' (מסתייים בעוד '+hrs(timeLeft)+')':'')+'. אם הנקודות לא חשובות לך, אין צורך להשקיע בוסטים.';
 }else{
  var timeLeft2=sharedEnd>now?(sharedEnd-now):0;
  actionText='החוזה פעיל לפרסים! הושגו '+achieved+' מתוך 3 יעדים'+(timeLeft2>0?' (נשארו '+hrs(timeLeft2)+')':'')+'. שדרג מחקר ומשלוחים בחוות החוזה ושלח/נצל טוקנים.';
  urgent.push([31,'קדם חוזה פרסים: '+name,'הושגו '+achieved+'/3 יעדים. לחץ לפירוט החוזה.','contracts']);
 }

 var cf=(b.farms||[]).filter(function(f){return f.farmType==='CONTRACT'&&f.contractId===id})[0];
 var researchHint='';
 if(cf && !waitingCoop){
  var cp=commonPlan(R,lvMap(cf.commonResearch),false,farmCash(cf),elv);
  if(cp.length)researchHint=cp.slice(0,3).map(function(x){return x.r.name+' ('+x.from+'→'+x.to+')'}).join(', ');
 }

 return {
  id:id,name:name,grade:String(c.grade||'').replace('GRADE_',''),coop:c.coopIdentifier||'',
  statusType:statusType,badgeText:badgeText,badgeClass:badgeClass,
  waitingCoop:waitingCoop,pointsOnly:pointsOnly,achieved:achieved,
  ownAmt:ownAmt,lastRewAmt:lastRewAmt,
  actionText:actionText,researchHint:researchHint,urgent:urgent
 };
}

function getSlotCount(b){
 var sel=$('slots').value;
 if(sel==='1')return 1;
 if(sel==='3')return 3;
 var g=b.game||{};
 return (g.permitLevel===1)?3:1;
}

function detectBestShip(b){
 var sel=$('shipTarget').value;
 if(sel && sel!=='auto')return sel;
 var db=b.artifactsDb||{};
 var vafx=(b.virtue&&b.virtue.afx)||{};
 var bestIdx=0;
 function checkShip(s){
  var i=SHIP_ORDER.indexOf(s);
  if(i>bestIdx)bestIdx=i;
 }
 (db.missionInfos||[]).forEach(function(m){checkShip(m.ship)});
 (db.missionArchive||[]).forEach(function(m){checkShip(m.ship)});
 if(vafx.lastFueledShip)checkShip(vafx.lastFueledShip);
 if(db.lastFueledShip)checkShip(db.lastFueledShip);
 return SHIP_ORDER[bestIdx]||'CHICKEN_ONE';
}

function checkShipFuel(b,sim){
 var target=detectBestShip(b);
 var reqFuels=SHIP_FUELS[target]||['ROCKET_FUEL'];
 var curEgg=sim.eggType||'';
 var db=b.artifactsDb||{};
 var vafx=(b.virtue&&b.virtue.afx)||{};
 var tank=db.tankFuels||vafx.tankFuels||[];
 var onFuelEgg=(reqFuels.indexOf(curEgg)>=0);
 var hasFuelInTank=reqFuels.every(function(f){
  var idx=EGG_ORDER.indexOf(f);
  return idx>=0 && (tank[idx]||0)>1000;
 });
 var reqNames=reqFuels.map(function(e){return EGG_HE[e]||e}).join(', ');
 return {target:target,reqFuels:reqFuels,reqNames:reqNames,onFuelEgg:onFuelEgg,hasFuelInTank:hasFuelInTank,curEggName:EGG_HE[curEgg]||curEgg};
}

function plan(b,R){
 var now=Date.now()/1000,g=b.game||{},sim=homeFarm(b),db=b.artifactsDb||{},slots=getSlotCount(b),runMode=$('run').value,a=[];
 var virt=!!VIRT[sim.eggType];
 var cash=farmCash(sim);
 var elv=lvMap(g.epicResearch);
 var clv=lvMap(sim.commonResearch);
 var art=analyzeArtifacts(b,slots);
 var hab=calcHabInfo(sim,clv,art);

 // קביעת מצב הריצה אוטומטית אם נבחר auto
 var run=runMode;
 if(run==='auto'){
  if(hab.isFull)run='ready';
  else if(hab.pop<5000 && Object.keys(clv).length<15)run='start';
  else run='mid';
 }

 var ships=[],ready=0,busy2=0;
 (db.missionInfos||[]).forEach(function(m){var s=m.status,end=(m.startTimeDerived||0)+(m.durationSeconds||0),left=end-now,txt;
  if(s==='RETURNED'||s==='ANALYZING'){ready++;busy2++;txt='חזרה - לאסוף'}
  else if(s==='EXPLORING'){busy2++;if(left<=0){ready++;txt='חזרה - לאסוף'}else{var h=Math.floor(left/3600),mi=Math.floor((left%3600)/60);txt='חוזרת בעוד '+h+' שעות ו-'+mi+' דקות'}}
  else if(s==='FUELING'||s==='PREPARE_TO_LAUNCH'){busy2++;txt=s==='FUELING'?'בתדלוק':'מוכנה לשיגור'}else return;
  ships.push([shipName(m.ship)+' ('+String(m.durationType||'').toLowerCase()+')',txt])});
 var free=Math.max(0,slots-busy2);

 if((g.unclaimedEggsOfProphecy||0)>0||(g.uncliamedGoldenEggs||0)>0)a.push([5,'אסוף ביצים שממתינות לך','יש Prophecy או Golden Eggs שלא נאספו. פתח את המשחק ואסוף אותן.']);
 if(ready>0)a.push([18,'אסוף '+ready+' ספינות שחזרו','ספינה שחזרה תופסת מקום ומעכבת משימה חדשה. אסוף אותה כדי לפנות מקום.']);

 var fuelInfo=checkShipFuel(b,sim);
 if(free>0){
  if(fuelInfo.onFuelEgg || fuelInfo.hasFuelInTank){
   a.push([22,'שגר ספינת '+shipName(fuelInfo.target),'יש לך מקום פנוי ודלק זמין ('+fuelInfo.reqNames+'). בחר משימה קצרה (Short) כדי לפתוח מהר יותר את הספינות הבאות.']);
  }else{
   a.push([68,'ספינה פנויה ('+shipName(fuelInfo.target)+'), אך אין דלק כרגע','הספינה דורשת ביצת '+fuelInfo.reqNames+', ואתה כרגע על '+fuelInfo.curEggName+' (ומיכל הדלק ריק). תוכל לשגר ב-Prestige הבא כשתעבור דרך '+fuelInfo.reqNames+'.']);
  }
 }

 // המלצות ארטיפקטים חכמות
 var C=commonPlan(R,clv,virt,cash,elv);
 var hasAffordableResearch=(C.length>0 && C[0].canBuy);
 var recSet=hasAffordableResearch?art.setResearch:art.setEarnings;
 var recNames=recSet.map(function(x){return x.name}).join(' + ');
 var eqNames=art.equipped.map(function(x){return x.name}).join(' + ');
 if(recNames && recNames!==eqNames){
  var reason=hasAffordableResearch?'יש לך מזומן לקניית מחקרים — הרכב Puzzle Cube להוזלת עלויות':'כרגע צוברים מזומן — הרכב סט שממקסם הכנסות לביצה';
  a.push([23,'החלף סט ארטיפקטים ל-'+recNames,reason+' (מותקן כרגע: '+(eqNames||'כלום')+').','artifacts']);
 }
 if(art.craftable.length>0){
  a.push([42,'זמינים לייצור (Craft): '+art.craftable.length+' ארטיפקטים משודרגים','תוכל לשדרג ל-T2 את: '+art.craftable.map(function(x){return x.name}).join(', ')+'.','artifacts']);
 }

 // התרעות לולים ו-Prestige
 if(hab.isFull){
  a.push([12,'הלולים מלאים ('+hab.pct.toFixed(0)+'%) — שדרג לול/מחקר או בצע Prestige','הגיע הזמן להתקדם לביצה הבאה (אם נפתחה), לשדרג לול/מחקר קיבולת, או לבצע Prestige לאיסוף Soul Eggs.']);
 }else if(hab.nearFull){
  a.push([29,'הלולים מתמלאים ('+hab.pct.toFixed(0)+'%)','נשארו מעט מקומות בלולים ('+fmt(hab.pop)+' מתוך '+fmt(hab.maxCap)+'). הכן שדרוג לול או התכונן ל-Prestige.']);
 }

 var cs=(b.contracts&&b.contracts.contracts)||[];
 var act=cs.filter(function(c){return c.accepted&&!c.cancelled&&!c.coopContributionFinalized});
 var CD=act.map(function(c){return contractInfo(c,b,R,elv,now)});
 var activeRunning=CD.filter(function(d){return !d.waitingCoop});
 var rewardContracts=activeRunning.filter(function(d){return !d.pointsOnly});
 var pointsContracts=activeRunning.filter(function(d){return d.pointsOnly});
 var waitingContracts=CD.filter(function(d){return d.waitingCoop});

 if(activeRunning.length===0){
  a.push([30,'בדוק חוזים חדשים להצטרפות','אין לך כרגע חוזה פעיל שרץ (יש '+waitingContracts.length+' שממתינים לסגירת הקבוצה). היכנס ללשונית Contracts לבדוק אם נפתח חוזה חדש.','contracts']);
 }
 CD.forEach(function(d){d.urgent.forEach(function(u){a.push(u)})});

 if(rewardContracts.length>0){
  a.push([32,'טפל ב-'+rewardContracts.length+' חוזי פרסים פעילים','יש לך חוזים שטרם הושלמו בהם כל הפרסים. לחץ לפירוט מלא.','contracts']);
 }else if(pointsContracts.length>0){
  a.push([58,'חוזים פעילים לנקודות בלבד ('+pointsContracts.length+')','כל הפרסים בחוזים הפעילים כבר הושגו. לחץ לפירוט החוזים.','contracts']);
 }else if(waitingContracts.length>0){
  a.push([75,'חוזים ממתינים לסגירת חברי הקבוצה ('+waitingContracts.length+')','סיימת ואספת הכל. ממתינים שחברי הקבוצה יסגרו אצלם. לחץ לפירוט.','contracts']);
 }

 var avail=(g.goldenEggsEarned||0)-(g.goldenEggsSpent||0);
 var E=epicPlan(R,elv,avail);
 if(E.buy){var f=E.buy.row;if(E.buy.n>0)a.push([24,'מחקר אפיק: שדרג את '+f.r.name+' ב-'+E.buy.n+' רמות','עכשיו רמה '+f.L+' מתוך '+f.r.levels+'. עלות '+fmt(E.buy.sum)+' GE מתוך '+fmt(avail)+' פנויות.']);else a.push([66,'מחקר אפיק: חסוך ל-'+f.r.name,'הרמה הבאה עולה '+fmt(f.price)+' GE ויש לך '+fmt(avail)+' (חסרות '+fmt(f.price-avail)+').'])}

 if(C.length){
  var b1=C[0];
  var t1=b1.count>1?('מרמה '+b1.from+' עד רמה '+b1.to+' (+'+b1.count+' רמות)'):('לרמה '+b1.to);
  if(b1.canBuy){
   a.push([25,'שדרג '+b1.r.name+' '+t1,'יש לך מספיק כסף כרגע! עלות הרצף: '+fmt(b1.cost)+' מתוך '+fmt(cash)+' שברשותך.']);
  }else{
   a.push([45,'השדרוג הבא: '+b1.r.name+' '+t1,'עלות: '+fmt(b1.cost)+', וכרגע יש לך '+fmt(cash)+'. המתן להצטברות מזומן או הפעל בוסט/רחפנים.']);
  }
 }

 var gift=g.nextDailyGiftTime||0;if(gift>1e12)gift/=1000;if(gift>0&&gift<now)a.push([20,'אסוף את המתנה היומית','הזמן של המתנה היומית עבר — לחץ על אייקון המתנה בצד.']);
 if((sim.unclaimedBoostTokens||0)>0)a.push([34,'אסוף '+sim.unclaimedBoostTokens+' טוקני בוסט שממתינים','יש טוקנים מוכנים לאיסוף בחווה הראשית.']);
 var ownedB=(g.boosts||[]).reduce(function(x,y){return x+(y.count||0)},0);
 if(run==='mid'&&(sim.activeBoosts||[]).length===0&&ownedB>0)a.push([48,'אין בוסט פעיל בחווה הראשית (יש לך '+ownedB+' במלאי)','אם אתה באמצע ריצה, הפעלת בוסט שכבר ברשותך תאיץ את ההתקדמות.']);
 if(run==='ready' && !hab.isFull)a.push([10,'בצע Prestige עכשיו','החלף לסט Soul Eggs, הפעל בוסטים מתאימים ובצע Prestige.']);
 if(run==='start')a.push([15,'תחילת ריצה: התקן סט ארטפיקטים ושדרג מחקר ראשוני','התחל מהמחקרים הזולים ושגר ספינות אם יש דלק במיכל.']);
 var v=b.virtue||{};if((v.eovEarned||[]).length&&(v.eovEarned||[]).reduce(function(x,y){return x+y},0)>0)a.push([70,'המשך עבודה על ביצי Virtue','Truth Eggs שנצברו עד כה: '+(v.eovEarned||[]).reduce(function(x,y){return x+y},0)+'.']);
 a.sort(function(x,y){return x[0]-y[0]});
 if(!a.length)a.push([99,'אין פעולה דחופה','הכל מסודר. חזור לבדוק בעוד כמה דקות.']);
 return {CD:CD,a:a,avail:avail,ships:ships,E:E,C:C,virt:virt,act:act.length,activeRunning:activeRunning.length,ownedB:ownedB,slots:slots,busy:busy2,g:g,sim:sim,db:db,fuelInfo:fuelInfo,hab:hab,cash:cash,art:art};
}

function show(b,R){

 if(age>3)h+='<div class="warn">גיבוי בן '+age+' דקות. לעדכון מיידי במשחק: פתח לרגע חוזה וחזור.</div>';

 h+='<div class="hud">';

 if(P.art.setDrones.length)h+='<p><b>לציד רחפנים (Golden Eggs):</b> '+P.art.setDrones.map(function(x){return esc(x.name)}).join(' + ')+'</p>';

async function run(silent){
 if(busy)return;var eid=$('eid').value.trim();if(!eid){$('out').innerHTML='<p class="err">הכנס EID</p>';return}
 sset('eid',eid);$('eid-bar').style.display='none';
 busy=true;if(!silent||!last)$('out').innerHTML='<p>טוען...</p>';
 try{var R=await getRes();last=await load(eid);show(last,R);$('sync').textContent='עודכן: '+new Date().toLocaleTimeString('he-IL')+' | גיל גיבוי: '+Math.round((Date.now()/1000-(last.approxTime||0))/60)+' דק\''}
 catch(e){$('eid-bar').style.display='flex';if(!last||!silent){$('out').innerHTML='<p class="err">'+esc(e.message||e)+'</p>'}else{$('sync').textContent='הרענון נכשל: '+(e.message||e)}}
 busy=false;
}
$('go').addEventListener('click',function(){run(false)});
$('btn-ref').addEventListener('click',function(){run(false)});
$('btn-eid').addEventListener('click',function(){var b=$('eid-bar');b.style.display=(b.style.display==='none'?'flex':'none')});
['slots','run','shipTarget'].forEach(function(id){var v=sget(id);if(v)$(id).value=v;$(id).addEventListener('change',function(){sset(id,$(id).value);if(last&&RES)show(last,RES)})});
var s=sget('eid');if(s){$('eid').value=s;run(false)}
setInterval(function(){if(!document.hidden&&$('eid').value.trim())run(true)},20000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&$('eid').value.trim())run(true)});
</script></body></html>
