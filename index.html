main{max-width:520px;margin:0 auto;padding:10px 12px 36px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:6px}
h1{font-size:1.05rem;margin:0;display:flex;align-items:center;gap:6px}
.ver{font-size:.72rem;background:var(--s);border:1px solid var(--line);padding:2px 7px;border-radius:6px;color:var(--mut);font-weight:600}
.icon-btn{background:var(--s);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:.82rem;cursor:pointer;font-weight:600}
.row{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
input,select{font:inherit;color:var(--ink);background:var(--s);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;font-size:.88rem}
button{font:inherit;background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:.86rem}
button.hero-btn{margin-top:9px;background:var(--y);color:#12151d;padding:6px 14px;font-size:.84rem;border-radius:8px}
button.sm-btn{margin-top:6px;background:transparent;color:var(--acc);border:1px solid var(--acc);padding:3px 10px;font-size:.78rem;border-radius:6px}
button.copy-btn{background:var(--acc);color:var(--accink);width:100%;padding:8px;margin-top:8px;border-radius:8px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.nav{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:var(--s);color:var(--ink);border:1px solid var(--line);padding:5px 10px;font-size:.78rem;border-radius:20px;flex-shrink:0}
.nav button.active{background:var(--acc);color:var(--accink);border-color:var(--acc)}

.hud{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:10px}
.hud-box{background:var(--s);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.hud-box small{display:block;font-size:.7rem;color:var(--mut)}
.hud-box b{font-size:.86rem;display:block;margin-top:1px}

.hero{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 15px;margin:10px 0;border-inline-start:6px solid var(--y)}
.hero small{display:block;color:var(--y);font-weight:700;font-size:.76rem;margin-bottom:3px;letter-spacing:.2px}
.hero h2{margin:0 0 5px;font-size:1.15rem;line-height:1.25}
.hero p{margin:0;opacity:.92;font-size:.87rem}

ol{list-style:none;margin:0 0 12px;padding:0}
li.it{background:var(--s);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:7px}
li.it b{display:block;font-size:.9rem}
li.it span{color:var(--mut);font-size:.82rem;display:block;margin-top:2px}
.step-num{display:inline-block;background:var(--line);color:var(--ink);font-size:.72rem;font-weight:700;padding:0 6px;border-radius:5px;margin-inline-end:6px}

.tag-ok{display:inline-block;background:var(--ok);color:#fff;font-size:.72rem;padding:2px 7px;border-radius:5px;font-weight:700}
.tag-wait{display:inline-block;background:var(--line);color:var(--ink);font-size:.72rem;padding:2px 7px;border-radius:5px;font-weight:600}
.tag-warn{display:inline-block;background:var(--bad);color:#fff;font-size:.72rem;padding:2px 7px;border-radius:5px;font-weight:700}
.tier-pill{display:inline-block;background:var(--line);color:var(--ink);font-size:.68rem;padding:1px 5px;border-radius:4px;margin-inline-end:5px;font-weight:700}
.err{color:var(--bad);margin:6px 0;font-weight:600;font-size:.9rem}
.warn{background:var(--s);border:1px solid var(--y);border-radius:8px;padding:7px 10px;margin:6px 0;font-size:.8rem}

.card{background:var(--s);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:.88rem}

.card .l{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);align-items:center}
.card .l:first-of-type{border-top:0;padding-top:2px}
.card small{color:var(--mut)}
.card p{margin:5px 0;font-size:.85rem}

.prog-bar{background:var(--line);border-radius:6px;height:7px;overflow:hidden;margin:5px 0}
.prog-fill{background:var(--acc);height:100%;transition:width .3s}
.prog-fill.ok{background:var(--ok)}
.prog-fill.bad{background:var(--bad)}

.status-banner{border-radius:9px;padding:9px 11px;margin-bottom:8px;border:1px solid var(--line);background:var(--bg)}
.status-banner.do{border-color:var(--ok);background:rgba(27,122,61,.12)}
.status-banner.alert{border-color:var(--bad);background:rgba(179,38,30,.12)}
.status-banner.hold{border-color:var(--line)}
.status-banner b{display:block;font-size:.92rem;margin-bottom:2px}

.c-box{border-top:1px solid var(--line);padding:8px 0}

.c-head{font-weight:700;font-size:.92rem;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.badge{font-size:.72rem;padding:2px 7px;border-radius:5px;font-weight:700}
.b-rew{background:var(--acc);color:var(--accink)}
.b-pts{background:var(--line);color:var(--ink)}
.b-wait{background:var(--ok);color:#fff}
.note{color:var(--mut);font-size:.76rem;margin-top:10px}
details summary{list-style:none}
details summary::-webkit-details-marker{display:none}
.sum-head{font-weight:700;font-size:.95rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
</style>
